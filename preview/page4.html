tarted Sedo.com, a domain name market platform that has been in operation for 10 years. Later, he became an angel investor and founded several companies. Then he discovered several problems-talented founders burned out, stuck in the business, or despite the great product", "summary_jp": "世界最大の独立系SaaSポートフォリオを構築し、年間1億ドルで25以上のブランドを買収し、400人のチームを持ち、2億500万ドルのARRに注力しているティム·シューマッハは何でしょうか？彼は10代の頃からビジネスを始め、ドメイン名マーケットプレイスであるSedo.comを10年間運営していました。エンジェル投資家となり、いくつかの会社を設立した。そして、才能ある創業者が燃え尽きたり、ビジネスに行き詰まったり、素晴らしい製品にもかかわらず失敗したりといった問題がありました。", "summary_ar": "قام ببناء أكبر محفظة SaaS مستقلة في العالم ، وبناء 100 مليون دولار سنويًا على أكثر من 25 علامة تجارية ، وفريق من 400 شخص ، وتركز على شركة ARR بقيمة 205 مليون دولار.وقد بدأ أعماله في سن المراهقة، حيث بدأ بإنشاء Sedo.com، وهي منصة تسويق أسماء النطاقات التي تعمل لمدة 10 سنوات.وأصبح مستثمرا ملائكا وأسس العديد من الشركات.ثم اكتشف بعض المشاكل - المؤسسين الموهوبين يحترقون ، أو عالقون في الأعمال ، أو على الرغم من أن المنتج جيد.", "thumbnail": "https://images.indiehackers.com/post-images/diZ8gkqMHm0CvEsc7Pfo/vOqaQ3DJwYRP8MNEjUOSMger71w1/polsia-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:23"}, {"_id": "article_0155", "title": "从游戏开发和漏洞赏金到年入4000万", "title_en": "From game development and bug bounty to annual income of 40 million", "title_jp": "ゲーム開発とバグ報奨金から年間4，000万ドルまで", "title_ar": "من تطوير الألعاب والمكافآت الثغرة إلى 40 مليون دولار سنويا", "summary": "从游戏开发和漏洞赏金到年入4000万 他曾是Facebook漏洞赏金排行榜2，现在OneSignal服务200万开发者 George Deglin在湾区长大。 爸妈都是软件工程师，tech是家里的默认语言。从小摆弄编程，但更着迷的是——只要有对工具，就能build全新的东西。 计算机科学专业，但大二暑假后就没回去。 和几个friend做了一个side project， qu", "summary_en": "From game development and bug bounty to 40 million yuan a year, he was once on the Facebook bug bounty list, and now George Deglin, the 2 million developer of the OneSignal service, grew up in the Bay Area. My parents are both software engineers, and tech is the default language at home. I have been playing with programming since I was a child, but what I am more fascinated by is that as long as you have the right tools, you can build something completely new. majoring in computer science, but didn't go back after the summer vacation of sophomore year. Made a side project with several friends, qu", "summary_jp": "ゲーム開発とバグ報奨金から年間4，000万ドルまでFacebookバグ報奨金ランキング2位にランクインし、現在はOne Signalサービスの200万ドルの開発者 George Deglinはベイエリアで育った。両親はソフトウェアエンジニアで、テクノロジーは家庭のデフォルト言語です。プログラミングに夢中でしたが、より魅力的なのは、適切なツールがあれば、まったく新しいものを構築できることです。コンピュータサイエンスを専攻したが、2年生の夏休み後に戻ってこなかった。私は友人とサイドプロジェクトをしました。", "summary_ar": "من تطوير الألعاب ومكافأة الثغرات إلى 40 مليون دولار سنوياً كان من بين أفضل مكافآت الثغرات في Facebook2 ، والآن أصبح المطور المليون في خدمة OneSignal George Deglin نشأ في منطقة الخليج.والداي كلاهما مهندسو برمجيات، والتكنولوجيا هي اللغة الافتراضية في المنزل.لقد تمر بالبرمجة منذ الطفولة ، ولكن ما هو أكثر مفتونًا - طالما كان لديك الأدوات الصحيحة ، يمكنك بناء أشياء جديدة تمامًا.علم الكمبيوتر، ولكن لم يعود بعد عطلة الصيف الثانية.عملت مع بعض الأصدقاء مشروعًا جانبيًا ، كو", "thumbnail": "https://images.indiehackers.com/post-images/dq0ZB3JnJTpRqCajozQc/vOqaQ3DJwYRP8MNEjUOSMger71w1/pear-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:23"}, {"_id": "article_0156", "title": "18个月简单产品月入4万的SaaS增长战法", "title_en": "18-month SaaS growth strategy of 40,000 yuan per month for simple products", "title_jp": "18 ヶ月間のシンプルな製品が月額40，000のSaaS成長戦略", "title_ar": "18 شهرا من المنتجات البسيطة 40،000 في الشهر من استراتيجية نمو SaaS", "summary": "18个月简单产品月入4万的SaaS增长战法 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入1千美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了一年多产品，还没看到什么希望。 01 4 步 SaaS 验证框架 你以为这就完了？", "summary_en": "18-month SaaS growth strategy of 40,000 yuan per month for simple products. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made $1,000 a year by himself. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for more than a year and I haven't seen any hope yet. 01 4-Step SaaS Verification Framework Do you think this is the end?", "summary_jp": "18 ヶ月間のシンプルな製品で月額40，000のSaaS成長戦略今日の例は、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間1，000ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。1年以上経っても希望はありません。4ステップSaaS検証フレームワーク、これで終わりだと思いますか？", "summary_ar": "18 شهراً من المنتجات البسيطة 40،000 في الشهر حرب نمو SaaS هذه الحالة التي أتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.معنى: صنع المنتجات لأكثر من عام ، ولم أرى أي أمل. 01 4 خطوات إطار التحقق من SaaS هل تعتقد أن هذا قد انتهى؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/fOu8cIHgV231yctZS8hz/vOqaQ3DJwYRP8MNEjUOSMger71w1/joseph-lee-founder-of-supademo.jpeg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:26"}, {"_id": "article_0157", "title": "慢性副业者30天赚18万，给TikTok时代的解药", "title_en": "Chronic associate operators earn 180,000 yuan in 30 days, giving an antidote to the TikTok era", "title_jp": "慢性的な副業は30日間で18万を稼ぎ、TikTok時代の解毒剤を与える", "title_ar": "العامل الثانوي المزمن يكسب 180،000 يومًا في 30 يومًا ، وهو الترياق لعصر TikTok", "summary": "慢性副业者30天赚18万，给TikTok时代的解药 他自己沉迷社交媒体到\"脑腐烂\"，于是做了个App自救 Yoni Smolyar是谁？ 软件工程师，慢性副业者（chronic side hustler）。过去十年start和fail了几十个项目和business。 终于，新app Brainrot找到了traction——一个screen time mobile app，显示", "summary_en": "Chronic associate worker earned 180,000 yuan in 30 days, giving him the antidote to the TikTok era. He became addicted to social media until \"brain rot\", so he made an App to save himself. Who is Yoni Smolyar? Software engineer, chronic side hustler. Dozens of projects and businesses have been started and failed over the past decade. Finally, the new app Brainrot found traction-a screen time mobile app that showed", "summary_jp": "慢性的な副事業者は30日間で18万人を稼ぎ、TikTok時代の解毒剤を与え、“脳の腐敗”にソーシャルメディアに中毒したので、アプリの自助Yoni Smolyarは誰ですか？ソフトウェアエンジニア、慢性副chside hustler。過去10年間で数十のプロジェクトやビジネスが開始され失敗しました。最後に、新しいアプリBrainrotはtractionを見つけました。画面時間モバイルアプリです。", "summary_ar": "عامل جانبي مزمن يكسب 180،000 في 30 يومًا ، يعطي الترياق لعصر Tik Tok لقد أصبح مدمنًا على وسائل التواصل الاجتماعي لـ \"تفسد الدماغ\" ، لذلك صنع تطبيقًا لإنقاذ نفسه من هو Yoni Smolyar؟مهندس البرمجيات، مزمن side hustler.في العقد الماضي بدأت وفشل عشرات المشاريع والأعمال.أخيرًا ، وجد تطبيق Brainrot الجديد Traction - تطبيق محمول بتوقيت الشاشة", "thumbnail": "https://images.indiehackers.com/post-images/eJpLFnzD9TJlAGHVKknx/vOqaQ3DJwYRP8MNEjUOSMger71w1/reface-homepage.png?w=1400?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:26"}, {"_id": "article_0158", "title": "15个月零到月入18.6万美元", "title_en": "15 months zero to monthly income of US$186,000", "title_jp": "15 ヶ月ゼロから月額18万6千ドル", "title_ar": "000 186 دولار من دولارات الولايات المتحدة لمدة 15 شهرا", "summary": "15个月零到月入18.6万美元 同样搞技术，为什么有人累死累活赚不到钱，有人能做到年入3千美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【早高峰地铁上】 刷手机看到一个帖子：\"做独立开发快两年了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 这就是James Fleischmann的故事。 没有融资，没有运气爆棚，没有一夜爆红。 就是把一件事想透了，然后反复做。", "summary_en": "15 months of zero to 186,000 US dollars a month are also engaged in technology. Why are some people working so hard that they can't make money, and some people can earn 3,000 US dollars a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing independent development for almost two years, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. This is the story of James Fleischmann. There was no financing, no luck, and no overnight celebrity. It is to think through one thing and then do it repeatedly.", "summary_jp": "15 ヶ月0から月額186，000ドルまで同じテクノロジーに従事している、なぜ誰かがお金を稼ぐために働いている、誰かが年間3000ドルを稼ぐことができるか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。“朝のピーク地下鉄”ブラシ携帯電話の投稿を見て：“独立した開発を行うほぼ2年間、毎月の収入はまだ残っている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてくださいこれはジェームズ·フライシュマンの物語です資金調達もなく、幸運もなく、一夜限りの爆発もなかった。一つのことを考えて、それを繰り返す。", "summary_ar": "إذا كنت تبلغ من الصفر إلى 186000 دولار في الشهر لمدة 15 شهرًا ، فلماذا لا يمكن لأي شخص أن يكسب المال ، بينما يمكن لأي شخص أن يكسب 3000 دولار سنويًا؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"القيام بالتطوير المستقل لمدة عامين تقريبًا ، والدخل الشهري لا يزال يتجول ، هل يجب التخلي عن ذلك؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان.هذه هي قصة جيمس فليشمان.لا تمويل، لا حظ، لا انفجار بين عشية وضحاها.التفكير في شيء واحد ثم القيام به مرارا وتكرارا.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/fgJbWfKrigaJkqkTdVmg/PWairgiOpneHvkGJri7RVbtORKI2/headerImage", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0159", "title": "46岁做AI语音，月入6万，他说年轻人太嫩", "title_en": "At the age of 46, he worked on AI voice and earned 60,000 a month. He said young people are too tender", "title_jp": "46歳のAI音声、月額60，000人、彼は若い人たちが若すぎると述べた", "title_ar": "يبلغ من العمر 46 عامًا يصنع الصوت الذكي ويكسب 60 ألف دولار شهريًا ويقول إن الشباب صغير جدًا", "summary": "46岁做AI语音，月入6万，他说年轻人太嫩 20年企业营销经验，他用\"性能定价\"搞定太阳能行业 Neel Bhattacharya不认为自己在做\"AI公司\"。 他在解决一个20年来一直在琢磨的问题： 为什么企业会失去他们已经花钱获取的客户？ 背景是企业营销自动化——IBM Unica、Salesforce、Adobe Campaign。在\"营销自动化\"成为buzzwo", "summary_en": "At the age of 46, he works as AI voice and earns 60,000 a month. He said that young people are too inexperienced and have 20 years of corporate marketing experience. He uses \"performance pricing\" to settle the solar energy industry. Neel Bhattacharya does not think he is an \"AI company.\" He is solving a question that has been pondering for 20 years: Why do companies lose customers they have already paid for? The background is enterprise marketing automation-IBM Unica, Salesforce, Adobe Campaign. Become buzzwo in \"Marketing Automation\"", "summary_jp": "46歳のAI音声、60，000月に、彼は若い人たちが20年のビジネスマーケティング経験の若すぎると述べた、彼は太陽光産業を達成するために“パフォーマンス価格”を使用したニールBhattacharyaは、彼が“AI企業”を行っているとは思わない。彼は20年間考えてきた疑問に取り組んでいますなぜ企業はすでに支払った顧客を失うのでしょう？IBM Unica、Salesforce、Adobe Campaignなどのエンタープライズマーケティングオートメーションのバックグラウンド。“マーケティングオートメーション”でbuzzwoになる", "summary_ar": "يبلغ من العمر 46 عامًا ، يعمل AI Voice ، ويكسب 60،000 دولار شهريًا ، وقال إن الشاب لديه 20 عامًا من الخبرة في التسويق في الشركات ، وهو يستخدم \"تسعير الأداء\" لتحقيق صناعة الطاقة الشمسية Neel Bhattacharya لا يعتقد أنه يعمل \"شركة AI\".إنه يحل السؤال الذي كان يتساءل فيه لمدة 20 عامًا: لماذا تفقد الشركات العملاء الذين أنفقت أموالًا للحصول عليهم بالفعل؟الخلفية هي أتمتة التسويق في الشركات - IBM Unica ، Salesforce ، Adobe Campaign.تصبح buzzwo في \"أتمتة التسويق\"", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/efVlT8PlxYgugh2NepsV/vOqaQ3DJwYRP8MNEjUOSMger71w1/alex-turnbull-founder-of-groove.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0160", "title": "他辞掉财富500强工作，8年做到百万ARR", "title_en": "He quit his Fortune 500 job and achieved a million ARR in 8 years", "title_jp": "彼はフォーチュン500の仕事を辞め、8年間で100万ARを達成しました。", "title_ar": "استقال من وظيفته في فورتشن 500 ويحصل على مليون ARR في 8 سنوات", "summary": "他辞掉财富500强工作，8年做到百万ARR 在Airtable阴影下，Stackby找到自己的位置 Rachit Khator是Stackby的创始人——一个AIfirst nocode平台，帮非技术人员build business apps。 做了8年。 2017年，他在美国一家财富500强公司做corporate role。所有数据都用spreadsheets管理，想要", "summary_en": "He quit his Fortune 500 job and achieved a million-dollar ARR in the shadow of Airtable in eight years. Stackby found his place. Rachit Khator is the founder of Stackby-an AIfirst nocode platform that helps non-technical people build business apps. For eight years. In 2017, he worked as a corporate role for a Fortune 500 company in the United States. All data is managed using spreadsheets, and you want to", "summary_jp": "Fortune 500の仕事を辞め、Airtableの影で8年間で100万ARRを達成したStackbyは、技術者以外の人がビジネスアプリを構築するためのAIFirst nocodeプラットフォームであるStackbyの創設者であるRachit Khatorです。8年間やってた2017年には、フォーチュン500にランクインする米国企業のコーポレート·ロールとして働いています。すべてのデータはスプレッドシートで管理されます。", "summary_ar": "استقال من وظيفته في فورتشن 500، وجعل المليون في 8 سنوات ARR تحت ظل Airtable، وجد Stackby مكانته، ويشهد Rachit Khator مؤسس Stackby - منصة AIfirst nocode لمساعدة غير التقنيين على بناء تطبيقات الأعمال.عملت لمدة 8 سنوات.في عام 2017 ، شغل دورًا مؤسسيًا في إحدى شركات فورتشن 500 الأمريكية.يتم إدارة جميع البيانات باستخدام جداول البيانات، وتريد.", "thumbnail": "https://images.indiehackers.com/post-images/g0tOSDReKQ8UqHnVt86T/vOqaQ3DJwYRP8MNEjUOSMger71w1/stackby-homepage.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0161", "title": "7年创业被独角兽收购，他说 goodbye", "title_en": "After 7 years of entrepreneurship, he was acquired by Unicorn. He said goodbye", "title_jp": "ユニコーンに買収されて7年、さよならを言う。", "title_ar": "7 سنوات من الشركة التي استحوذت على يونيكورن وقال وداعا", "summary": "7年创业被独角兽收购，他说 goodbye 从 $300 万积蓄到被 acquihired，他的教训血泪 他是工程师出身，转行做营销，然后创业，现在是一家AI业务的CEO。 Product是Linguix——AI写作助手，面向knowledge workers。团队做了近7年。 最近，他和联合创始人被一家unicorn acquihired！收购时ARR约17万美元。不能s", "summary_en": "After 7 years of entrepreneurship, he was acquired by Unicorn. He said that goodbye had saved from $3 million to being acquired. His lessons were bloody and tearful. He started as an engineer, turned to marketing, and then started a business. Now he is the CEO of an AI business. Product is Linguix-AI writing assistant for knowledge workers. The team has been working for nearly 7 years. Recently, he and his co-founder were recruited by a unicorn acquired! The ARR was approximately US$170,000 at the time of acquisition. cannot s", "summary_jp": "ユニコーンに買収された7年のスタートアップ、彼は300万ドルの貯蓄からAcquihiredにさよならを言いました。彼の教訓は、エンジニアとして生まれ、マーケティングに転向し、起業し、今はAIビジネスのCEOです。Product-知識労働者向けのAIライティングアシスタントLinguixです。チームは約7年間在籍している。最近、彼と共同創設者はユニコーンに買収されました!买収时のARRは约17万ドルである。できないs", "summary_ar": "7 سنوات من بدء الأعمال تم استحواذها من قبل ليكورن ، وقال وداعا من مدخرات 3 ملايين دولار ليتم استحواذها ، درس الدموع كان مهندسًا ، تحول إلى التسويق ، ثم بدء الأعمال ، والآن هو الرئيس التنفيذي لشركة AI.المنتج هو مساعد الكتابة Linguix - AI ، موجه للعمال المعرفة.يعمل الفريق منذ سبع سنوات.في الآونة الأخيرة, هو والمؤسسين المشاركين acquired من قبل شركة يونيكورن!وقد بلغت قيمة المبالغ المستحقة عند الاقتناء حوالي 170 ألف دولار.لا يمكن S", "thumbnail": "https://images.indiehackers.com/post-images/erendy8MDnGpBEP0F2GN/vOqaQ3DJwYRP8MNEjUOSMger71w1/1765390044554-oz68bfzn2z.jpeg?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0162", "title": "AI编排平台4周做到月入2万，他的GTM秘诀", "title_en": "The AI orchestration platform earns 20,000 yuan a month in 4 weeks. His GTM secret", "title_jp": "AIオーケストレーションプラットフォームは4週間で月20，000を達成、彼のGTM秘密", "title_ar": "منصة الذكاء الاصطناعي التي تحقق 20،000 في الشهر في 4 أسابيع ، سر GTM له", "summary": "AI编排平台4周做到月入2万，他的GTM秘诀 20年GTM经验，他把SDR工作完全自动化了 Santanu Dasgupta做了20年SaaS公司的gotomarket，横跨美国、欧洲、印度——从湾区的Oracle mobile database spinout做developer开始，后来转入GTM和growth。 之后在Gartner Consulting和Tata Co", "summary_en": "The AI orchestration platform achieved a monthly income of 20,000 in 4 weeks. His GTM secret has 20 years of GTM experience. He has completely automated SDR work. Santanu Dasgupta has been a gotomarket for a SaaS company for 20 years, spanning the United States, Europe, and India-starting from the Oracle mobile database spinout in the Bay Area as a developer, and later moving to GTM and growth. Later, at Gartner Consulting and Tata Co.", "summary_jp": "AIオーケストレーションプラットフォームは4週間で月間20，000を達成し、彼のGTM秘密は20年のGTM経験を持ち、SDRの作業を完全に自動化しました。Santanu Dasguptaは20年間、米国、ヨーロッパ、インドのSaaS企業のgotomarketを務めました。ベイエリアのOracle Mobile Database Spinoutから開発者として始まり、GTMとGrowthに移行しました。ガートナー·コンサルティングとタタ社", "summary_ar": "منصة تنظيم الذكاء الاصطناعي في 4 أسابيع لتحقيق 20،000 في الشهر، سر GTM لديه 20 عاما من الخبرة في GTM، وقال انه أتمتة كاملة SDR عمل سانتانو داشجوبتا 20 عاما في شركة SaaS gotomarket، عبر الولايات المتحدة، أوروبا، الهند - بدءا من أوراكل قاعدة بيانات المحمولة العزل في منطقة الخليج كمطور، ثم انتقل إلى GTM والنمو.بعد ذلك في Gartner Consulting و Tata Co.", "thumbnail": "https://images.indiehackers.com/post-images/fC3IxR2MOffWkBSUZqF4/vOqaQ3DJwYRP8MNEjUOSMger71w1/onesignal-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0163", "title": "边在IBM上班边做AI副业，月入6万", "title_en": "Working at IBM while doing an AI sideline, earning 60,000 yuan a month", "title_jp": "IBMで働きながらAI副業をし、月に6万ドルを稼ぐ", "title_ar": "يعمل في شركة IBM ويكسب 60 ألف دولار شهرياً", "summary": "边在IBM上班边做AI副业，月入6万 从失败的交易工具到房地产AI，她找到了成功公式 Paline Clavelloux白天在IBM上班，晚上做自己的AI副业。 第一个项目是什么？ COVID期间，想搞automated trading，contact了一个在IT工作的朋友。一起做了个prototype，24/7交易，return超过5倍initial investment。", "summary_en": "While working at IBM, she does an AI sideline, earning 60,000 yuan a month. From failed trading tools to real estate AI, she found a success formula Paline Clavelloux works at IBM during the day and does her own AI sideline at night. What is the first project? During the COVID, I wanted to engage in automated trading and contacted a friend who worked in IT. We made a prototype together, traded 24/7, and returned more than 5 times the initial investment.", "summary_jp": "IBMで働きながらAIの副業をしながら、失敗したトレーディングツールから不動産AIまで、毎月6万ドルの収入を得て、彼女は日中IBMで働き、夜は自分のAI副業をする成功の公式 Paline Clavelouxを見つけました。最初のプロジェクトは？COVIDでは、自動取引をしたいと思い、ITで働く友人に連絡しました。24時間年中無休の取引は、初期投資の5倍以上のリターンをもたらします。", "summary_ar": "من أدوات التداول الفاشلة إلى الذكاء الاصطناعي في العقارات ، وجدت صيغة النجاح Paline Clavelloux التي تعمل في IBM خلال النهار وتقوم بعمل الذكاء الاصطناعي الخاص بها في الليل.ما هو المشروع الأول؟خلال COVID ، كنت ترغب في التداول الآلي ، اتصل بصديق يعمل في تكنولوجيا المعلومات.عمل نموذج أولي معا، 24/7 التداول، والعودة أكثر من 5 مرات الاستثمار الأولي.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/fOu8cIHgV231yctZS8hz/vOqaQ3DJwYRP8MNEjUOSMger71w1/joseph-lee-founder-of-supademo.jpeg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0164", "title": "多年失败产品后，他终于做到月入11万", "title_en": "After years of failed products, he finally made 110,000 yuan a month", "title_jp": "長年の失敗の後、彼はついに月11万ドルを達成しました。", "title_ar": "بعد سنوات من الفشل في المنتج ، حقق أخيرًا 110،000 دولار شهريًا.", "summary": "多年失败产品后，他终于做到月入11万 16岁做软件工程师，他说：每天工作16小时是我唯一的原因 Nic来自Ukraine。16岁开始做software engineer。 Eventually realized didn't really want grow in engineering role。Indie hacking seemed like so much more fu", "summary_en": "After years of failed products, he finally earned 110,000 a month as a software engineer at the age of 16. He said: Working 16 hours a day is the only reason why Nic comes from Ukraine. I started working as a software engineer at the age of 16. Eventually realized didn't really want grow in engineering role。Indie hacking seemed like so much more fu", "summary_jp": "何年も失敗した後、彼はついに11万 16歳でソフトウェアエンジニアになりました。“1日16時間働くことが、私がウクライナ出身の唯一の理由です。16歳でソフトウェアエンジニアとして働き始める。Eventually Realized Didn't Really Want to Grow Engineering RoleシングルIndie Hacking Seemed Like So Much More Fuシングル", "summary_ar": "بعد سنوات من المنتجات الفاشلة ، حصل أخيرًا على 110،000 دولار شهريًا من عمره 16 عامًا كمهندس برمجيات ، وقال: \"العمل 16 ساعة في اليوم هو السبب الوحيد لي أن نيك من أوكرانيا\".بدأ عمره 16 عامًا في مهندس البرمجيات.أدركت في النهاية أنني لا أريد حقًا النمو في دور الهندسة.القرصنة الهندية بدا مثل الكثير أكثر من اللعنة", "thumbnail": "https://images.indiehackers.com/post-images/fYbp8x4WWqltdifUwCZJ/vOqaQ3DJwYRP8MNEjUOSMger71w1/brainrot-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:29"}, {"_id": "article_0165", "title": "Sahil Lavingia扔VC自增长，Gumroad年入2000万", "title_en": "Sahil Lavingia has increased its own VC, and Gumroad earns 20 million yuan a year", "title_jp": "Sahil LavingiaがVCを投げ、Gumroadは年間20万ドルを獲得", "title_ar": "Sahil Lavingia يرمي VC النمو الذاتي ، Gumroad في 20 مليون سنويا", "summary": "Sahil Lavingia扔VC自增长，Gumroad年入2000万 同样搞技术，为什么有人累死累活赚不到钱，有人能做到年入2000万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【早高峰地铁上】 刷手机看到一个帖子：\"做独立开发快两年了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 我十几岁的时候就开始编码和设计。我主要是自学成才。我通过构建项目和阅读文档来学习。在 Gumroad 之前，我构建了几个小项目和应用程序，但没什么大不了的。Gumroad 是我的第一家真正的公司。我开始做这件事", "summary_en": "Sahil Lavingia has been self-reliant on VC growth, and Gumroad has an annual income of 20 million yuan. Why is it that some people work hard and can't make money, and some people can earn 20 million dollars a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing independent development for almost two years, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 I started coding and designing when I was a teenager. I am mainly self-taught. I learn by building projects and reading documents. Before Gumroad, I built a few small projects and applications, but no big deal. Gumroad is my first real company. I started doing this", "summary_jp": "Sahil LavingiaはVCを投げ、Gumroadは年間2000万ドルを稼ぐ同じ技術に従事している、なぜ誰かがお金を稼ぐために働いている、誰かが年間2000万ドルを稼ぐことができるのか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。“朝のピーク地下鉄”ブラシ携帯電話の投稿を見て：“独立した開発を行うほぼ2年間、毎月の収入はまだ残っている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください10代の頃からコーディングとデザインを始めました。主に独学でした。プロジェクトを作ったり、ドキュメントを読んだりして学びます。Gumroadの前は、小さなプロジェクトやアプリをいくつか作っていましたが、大したことではありませんでした。Gumroadは私の最初の会社でした。これを始めました", "summary_ar": "Sahil Lavingia يرمي VC للنمو الذاتي ، Gumroad دخل سنوي 20 مليون دولار نفس التكنولوجيا ، لماذا لا يمكن لأي شخص أن يكسب المال ، يمكن لأي شخص أن يحصل على 20 مليون دولار سنويًا؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"القيام بالتطوير المستقل لمدة عامين تقريبًا ، والدخل الشهري لا يزال يتجول ، هل يجب التخلي عن ذلك؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان.بدأت في الترميز والتصميم في سن المراهقة.أنا في المقام الأول تدرس نفسي.تعلمت من خلال بناء المشاريع وقراءة المستندات.قبل Gumroad ، قمت ببناء العديد من المشاريع والتطبيقات الصغيرة ، ولكن ليس هناك شيء كبير.كانت Gumroad أول شركة حقيقية لي.بدأت في القيام بذلك.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hDiewrNjP01pAJST9jH6/vOqaQ3DJwYRP8MNEjUOSMger71w1/sahil-lavingia-founder-of-gumroad.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:31"}, {"_id": "article_0166", "title": "用Product Hunt做长青副业增长", "title_en": "Use Product Hunt to grow the evergreen sideline industry", "title_jp": "プロダクトハントで成長する", "title_ar": "استخدام Product Hunt لتطوير الأعمال الثانوية", "summary": "用Product Hunt做长青副业增长 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入20美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【一个做SaaS的朋友约我吃饭】 吃到一半，他放下筷子：\"我最近特别焦虑。增长不够快\"我说我给你讲个人吧。他叫James Fleischmann。 01 我的企业职业生涯始于分析咨询，但两年内我感到无聊并辞职，与我在黑客马拉松上遇到的人一起创办了一家企业。那是八年前的事了。从那时起，情况就像过山车一样。我回到了全职工作岗位，从事从风险投资到独角兽等各个领域的工作。 但我总是把大部分空闲时间花在独立黑客上。这很有趣。它激发了我的创造力！另外，我喜欢被其他创始人包围。这是超级激励人心的。", "summary_en": "Use Product Hunt to grow the evergreen sideline industry. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $20. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [A friend who makes SaaS asked me for dinner] Halfway through the meal, he put down his chopsticks: \"I have been very anxious recently. The growth is not fast enough.\"I said, let me tell you about a person. His name is James Fleischmann. 01 My corporate career started in analytical consulting, but within two years I got bored and quit and started a business with someone I met at the hackathon. That was eight years ago. Since then, things have been like a roller coaster. I went back to full-time work, working in everything from venture capital to unicorns. But I always spend most of my free time working on independent hackers. This is interesting. It inspired my creativity! Plus, I like being surrounded by other founders. This is super inspiring.", "summary_jp": "プロダクトハントを使った長期的な副業の成長今日の例は、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間20ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【SaaSの友人が夕食に誘ってくれた】半分食べた後、箸を置いて、“最近は特に不安になっています。“成長は十分に速くない”私は個人的に話します。彼の名前はジェームズ·フライシュマン。私の企業キャリアは分析コンサルティングから始まりましたが、2年以内に退屈して辞め、ハッカソンで出会った人たちとビジネスを始めました。8年前のことです。それ以来、まるでジェットコースターのようだった。私はフルタイムの仕事に戻り、ベンチャーキャピタルからユニコーンまで、あらゆる分野で働いています。私は自由な時間のほとんどを独立したハッキングに費やしています。これは面白いわ私の創造性を刺激する!他の創業者に囲まれるのが好きです。これは超刺激的です。", "summary_ar": "يمكن أن تغير هذه الحالة اليوم فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده كان لديه 20 دولارا سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك.في منتصف الأكل ، وضع الععصي: \"أنا قلق بشكل خاص في الآونة الأخيرة. \"لا يزداد السرعة بما فيه الكفاية\" قلت لي أن أقول لك شخصيا.اسمه جيمس فليشمان.بدأت حياتي المهنية في مجال الأعمال في الاستشارات التحليلية ، ولكن في غضون عامين شعرت بالملل واستقلت لبدء مشروع تجاري مع أشخاص قابلتهم في هاكماراثون.كان ذلك قبل ثمانية أعوامومنذ ذلك الحين، كان الوضع مثل الدوارة الرافعة.لقد عدت إلى وظيفتي بدوام كامل في كل مجال من رأس المال المخاطر إلى ليكورن.لكنني أقضي دائمًا معظم وقت فراغي في القراصنة المستقلين.وهذا أمر مثير للاهتمام.لقد ألهمت إبداعي!أنا أيضا أحب أن أكون محاطا مع المؤسسين الآخرين.هذا ملهم للغاية.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hEMr9OkVxm6SoLWFGUNV/vOqaQ3DJwYRP8MNEjUOSMger71w1/felix-wong-founder-of-zlides.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:33"}, {"_id": "article_0167", "title": "从破产到月入70万，4年就够了", "title_en": "From bankruptcy to monthly income of 700,000 yuan, 4 years is enough", "title_jp": "破産から月額70万ドルまで、4年で十分です。", "title_ar": "من الإفلاس إلى 700 ألف دولار شهرياً، 4 سنوات كافية", "summary": "从破产到月入70万，4年就够了 演员梦碎后，他用Magai证明自己 Dustin Stout本应该成为actor。Smalltown Pennsylvania kid moves to Hollywood，chases the dream，learns the craft。但Hollywood对他有别的计划。 Auditions dried up，found himself a", "summary_en": "From bankruptcy to monthly income of 700,000 yuan, 4 years was enough. After his dream of being an actor was shattered, he used Magai to prove that Dustin Stout should have been an actor. Smalltown Pennsylvania kid moves to Hollywood，chases the dream，learns the craft。But Hollywood has other plans for him. Auditions dried up，found himself a", "summary_jp": "破産から月額70万ドルまで4年で俳優の夢を打ち砕いた後、マガイを使ってダスティン·スタウトが俳優になるべきだったことを証明した。Smalltownペンシルベニアの子供たちはハリウッドに引っ越し、夢を見、クラフトを学ぶ。ハリウッドには別の計画がある。オーディションを受けて自己紹介を受けました", "summary_ar": "بعد أربع سنوات من الإفلاس إلى 700،000 في الشهر ، كان كافياً بعد تحطيم أحلام الممثل ، استخدم ماغاي لإثبات أن داستن ستاوت كان يجب أن يصبح ممثلاً.ينتقل طفل من بلدة بنسلفانيا الصغيرة إلى هوليوود ، ويطارد الحلم ، ويتعلم الحرفة.لكن هوليوود لديها خطط أخرى بالنسبة له.تجارب الاختبار جفت، وجد نفسه", "thumbnail": "https://images.indiehackers.com/post-images/g0tOSDReKQ8UqHnVt86T/vOqaQ3DJwYRP8MNEjUOSMger71w1/stackby-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:33"}, {"_id": "article_0168", "title": "手机APP组合月入18.5万", "title_en": "Monthly income of mobile APP combination is 185,000", "title_jp": "モバイルアプリは月額185，000ドル", "title_ar": "تطبيقات الهواتف المحمولة 185.000 في الشهر", "summary": "手机APP组合月入18.5万 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入18万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 接下来怎么办？", "summary_en": "In less than two years, James Fleischmann proved one thing: Doing the right thing is 100 times more important than doing it hard. Annual income is US$180,000, per person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 What should we do next?", "summary_jp": "James Fleischmannは2年足らずで1つのことを証明しました正しいことをすることは必死に働くよりも100倍重要です年間18万ドルで、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。0 1次は？", "summary_ar": "أمضى جيمس فليشمان أقل من عامين على إثبات شيء: أن القيام بالأشياء الصحيحة أكثر أهمية بـ 100 مرة من القيام بها بجهد يائس. 180 ألف دولار في السنة لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\" 01 ماذا بعد؟", "thumbnail": "https://images.indiehackers.com/post-images/g9SG7tZ85NrHvXyMvwXP/vOqaQ3DJwYRP8MNEjUOSMger71w1/linguix-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:35"}, {"_id": "article_0169", "title": "两年开源产品130万美元ARR", "title_en": "Two years open source product US$1.3 million ARR", "title_jp": "2年間で130万ドルのオープンソース製品ARR", "title_ar": "منتجات مفتوحة المصدر لمدة سنتين 1.3 مليون دولار", "summary": "两年开源产品130万美元ARR 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入100万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜接了个电话】 一看是老朋友。\"不好意思这么晚打给你，但我真的睡不着。\"话筒那边的声音听起来很疲惫。\"我做了几个月了，感觉自己原地踏步。\" 01 接下来怎么办？ 你可能想不到：", "summary_en": "The two-year open source product, US$1.3 million ARR, is talking about this case today, which may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of US$1 million. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a phone call in the middle of the night] I saw that he was an old friend. \"Sorry to call you so late, but I really couldn't sleep. \"The voice on the other side of the microphone sounded tired. \"I've been doing it for a few months and I feel like I'm standing where I am. \" 01 What should we do next? You may not think of it:", "summary_jp": "2年間のオープンソース製品$1.3 M ARR今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間100万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。夜中に電話がかかってきたのは旧友だ。“こんなに遅く電話して申し訳ありませんが、眠れません。電話の向こうの声は疲れていた。“私は数ヶ月前にそれをし、自分自身を動かしていると感じた。0 1次は？考えられないかもしれません", "summary_ar": "عامين من المنتجات مفتوحة المصدر 1.3 مليون دولار ARR هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على مليون دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في منتصف الليل) صديق قديم. \"آسف على الاتصال بك في هذا الوقت المتأخر ، لكنني لا أستطيع النوم.\" \"الصوت على الجانب من الميكروفون يبدو متعبًا. \"لقد فعلت ذلك لعدة أشهر وأشعر بأنني أسير في مكاني. 01 ماذا بعد؟قد لا تفكر:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hbMiXIoZsueV9D3L58DP/vOqaQ3DJwYRP8MNEjUOSMger71w1/nevo-david-founder-of-postiz.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:38"}, {"_id": "article_0170", "title": "从Micro-SaaS到年入百万美元的进化", "title_en": "Evolution from Micro-SaaS to million-dollar annual revenue", "title_jp": "マイクロSaaSから年間100万ドルへの進化", "title_ar": "التطور من Micro-SaaS إلى مليون دولار سنوي", "summary": "从MicroSaaS到年入百万美元的进化 25年经验，他用AI把团队协调工具重做了一遍 Henry Poydar做了25年+软件、lead teams，从小bootstrapped startups到Sapient等大enterprise teams。 卖掉last company（cofounder和CTO）后，做了acquiring company的时间，想try some", "summary_en": "From MicroSaaS to million-dollar evolution for 25 years, he used AI to redo team coordination tools. Henry Poydar has been working on software and lead teams for 25 years, from small bootstrapped startups to big enterprise teams such as Sapient. After selling last company (cofounder and CTO), I spent time as an acquiring company and wanted to try some", "summary_jp": "マイクロSaaSから100万ドル規模の進化までの25年の経験を持つ彼は、Henry Poydarが25年以上にわたって行ってきたソフトウェア、リードチーム、小規模なブートストラップスタートアップからSapientのような大規模なエンタープライズチームまで、チーム調整ツールをAIでやり直しました。最後の会社（コファウンダーとCTO）を売却した後、会社を買収しました。", "summary_ar": "مع 25 عاما من الخبرة في التطور من MicroSaaS إلى مليون دولار سنويا، أعاد إصدار أدوات تنسيق الفريق مع الذكاء الاصطناعي Henry Poydar عمل على مدى 25 عاما من البرمجيات والفرق القيادية، من الشركات الناشئة الصغيرة التي تم التشغيل إلى فرق المؤسسات الكبيرة مثل Sapient.بعد بيع الشركة الأخيرة (المؤسس المشارك والمدير التنفيذي للتكنولوجيا) ، لقد حان الوقت للا ok off. This wo", "summary_jp": "2つの製品を5600万ドルで販売した後、彼は11週間で11の製品を作る必要はないと述べ、11番目は成功したが、Tiboが2015年から2019年にいくつかのスタートアップを行ったことを後悔したが、収益を生み出すことはなく、ほとんどあきらめた。2021年、彼と共同創業者のTomは、収益が出るまで週に1つのプロダクトを作るというクレイジーな挑戦を始めました。私は10を作り、すべてのクリケット。しかし、11番目のツイートハンターは離陸した。このWO。", "summary_ar": "بيع اثنين من المنتجات النقدية 56 مليون ، وقال انه لا يريد 11 أسبوعا من الانتاج 11 المنتج ، ونجح الحادي عشر ، لكنه نادم على أن Tibo قام بعدة بدءات ناشئة في عام 2015 ، ولكن لم يولد أي من الإيرادات ، وكاد أن يستسلم.في عام 2021 ، بدأ هو والمؤسس المشارك توم في التحدي المجنون - صنع منتج واحد أسبوعيًا حتى يتم الحصول على دخل.كان هناك عشرة، كلها كريكيت.لكن التغريدة الحادية عشرة ، تويتر هنتر ، أقلعت.هذا wo", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hDiewrNjP01pAJST9jH6/vOqaQ3DJwYRP8MNEjUOSMger71w1/sahil-lavingia-founder-of-gumroad.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0174", "title": "卖代码模板月入8万，他说定价太低了", "title_en": "Selling code templates earns 80,000 yuan a month, but he said the pricing is too low", "title_jp": "販売コードテンプレートは月額8万ドルで販売され、価格は低すぎると述べた", "title_ar": "بيع 80 ألف دولار في الشهر، وقال إن السعر منخفض جدا.", "summary": "卖代码模板月入8万，他说定价太低了 16岁做开发，从$49涨到$349，800+客户 他16岁开始freelancing web development。上学、多家公司工作、升到web architect。但最终发现，大团队的slow processes不适合他。 Side还在freelancing、做小客户项目——和朋友有个小agency。发现start new custome", "summary_en": "Selling code templates earns a monthly income of 80,000 yuan. He said the pricing is too low. He started developing at the age of 16, and rose from $49 to $349. 800+ customers. He started freelancing web development at the age of 16. Went to school, worked in multiple companies, and promoted to web architect. But in the end, he discovered that the slow processes of a large team were not suitable for him. Side is still working on freelancing and small client projects-a small agency with friends. Discover start new custom", "summary_jp": "コードテンプレートは月に8万ドルで販売され、16歳で開発するには低すぎると言い、49ドルから34万9800ドルに上昇し、16歳でフリーランスのウェブ開発を始めた。学校に通い、複数の会社で働き、ウェブアーキテクトに昇進した。しかし、大規模なチームの遅いプロセスは彼には合わないことがわかった。サイドはフリーランシングをしていて、小さなクライアントプロジェクトをしています。新しいカスタムを始める", "summary_ar": "بيع قوالب التعليمات البرمجية في 80،000 شهريا، وقال انه كان السعر منخفض جدا في سن 16 للتطوير، وارتفع من $49 إلى $349,800 + عملاء بدأ في 16 عاما تطوير الويب لحسابهم الخاص.الذهاب إلى المدرسة ، والعمل في العديد من الشركات ، والارتقاء إلى معماري الويب.لكن في النهاية تبين أن العمليات البطيئة للفريق الكبير ليست مناسبة له.كما تعمل Side لحسابها الخاص، وتقوم بمشاريع صغيرة للعملاء - لديها وكالة صغيرة مع أصدقائها.اكتشاف newstart custome", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hEMr9OkVxm6SoLWFGUNV/vOqaQ3DJwYRP8MNEjUOSMger71w1/felix-wong-founder-of-zlides.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0175", "title": "他买下Baremetrics，目标1000万ARR", "title_en": "He bought Baremetrics with a goal of 10 million ARRs", "title_jp": "Baremetricsを買収し、1000万ARRを目標に", "title_ar": "يشتري شركة Baremetrics ويهدف إلى 10 ملايين ARR", "summary": "他买下Baremetrics，目标1000万ARR 400万美元现金收购，现在要做到1000万ARR Luke Marshal在澳大利亚军队10年后，通过MBA和其他补充学习探索civilian career transition。得到Digital Transformation Manager角色，负责scoping和implementing modern systems进nat", "summary_en": "He bought Baremetrics with a goal of 10 million ARR and US$4 million in cash. Now he wants to get 10 million ARR Luke Marshal, after 10 years in the Australia Army, explore the civilian career transition through an MBA and other supplementary learning. Get the role of Digital Transformation Manager, responsible for scoping and implementing modern systems into nat", "summary_jp": "彼はBaremetricsを400万ドルで現金で1，000万ARRを買収し、現在は1，000万ARRを目指しています。ルーク·マーシャルはオーストラリア陸軍で10年間過ごし、MBAやその他の補完的な学習を通じて市民キャリアの移行を探求しています。デジタルトランスフォーメーションマネージャーの役割を取得し、現代システムのスコピングと実装を担当。", "summary_ar": "قام بشراء Baremetrics ، الذي يستهدف 10 مليون ARR 4 ملايين دولار من الاستحواذ النقدي ، ويريد الآن أن يحصل على 10 مليون ARR Luke Marshal بعد 10 سنوات في الجيش الأسترالي ، واستكشاف الانتقال الوظيفي المدني من خلال ماجستير في إدارة الأعمال وغيرها من التدريب التكميلي.الحصول على دور مدير التحول الرقمي، مسؤول عن scoping وتنفيذ الأنظمة الحديثة فيnat", "thumbnail": "https://images.indiehackers.com/post-images/hS1wen0srjGNIWZxSnV9/vOqaQ3DJwYRP8MNEjUOSMger71w1/magai-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0176", "title": "他把目标定低，反而做到了月入18万", "title_en": "He set his goal low and instead made 180,000 a month.", "title_jp": "目標を低く設定したが、月に18万ドルを達成した。", "title_ar": "كان هدفه منخفضًا ، بدلاً من ذلك حقق 180 ألف دولار شهريًا.", "summary": "他把目标定低，反而做到了月入18万 10年软件工程师，他说：不要听任何建议 Dmytro Krasun做了10+年software engineer才quit job。Computer science degree，all that。但一直想成为entrepreneur。 Prefer autonomy和independence——尤其关于想work的领域。 So，kept t", "summary_en": "He set his goal low and instead achieved a monthly salary of 180,000 software engineers. He said: Don't listen to any advice. Dmytro Krasun has been a software engineer for more than 10 years before quitting a job. Computer science degree，all that。But I always wanted to be an entrepreneur. Prefer autonomy and independence-especially about areas where you want to work. So，kept t", "summary_jp": "彼は低い目標を設定し、代わりに月18万 10年のソフトウェアエンジニアを達成し、彼は言った：Dmytro Krasunは10年以上ソフトウェアエンジニアをして仕事をquitするために何のアドバイスも聞かないでください。コンピュータサイエンスの学位、それだけです。私は常に起業家になりたい。自律性と独立性を好む-特に仕事の領域に関して。だから、kept t", "summary_ar": "وبدلاً من ذلك، كان هدفه منخفضًا، وبدلاً من ذلك حقق 180،000 دولار شهريًا كمهندس برمجيات لمدة 10 سنوات، وقال: \"لا تستمع إلى أي نصيحة\" ديميترو كراسون عمل مهندس برمجيات لمدة 10 سنوات قبل الاستقالة من وظيفته.شهادة علوم الكمبيوتر، كل ذلك.كنت أرغب دائمًا في أن أكون رائد أعمال.يفضل الاستقلال الذاتي والاستقلال - وخاصة فيما يتعلق بالمجالات التي تريد العمل.لذا، أبقي t", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hZ4hqICtByIljkiJECQv/PWairgiOpneHvkGJri7RVbtORKI2/Connor Burd _founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0177", "title": "38岁两次退出后，他说创业是致富唯一途径", "title_en": "After quitting twice at the age of 38, he said that starting a business is the only way to get rich", "title_jp": "38歳で2度退職した後、起業が金持ちになる唯一の方法だと語る", "title_ar": "بعد أن انسحب مرتين في سن 38 ، قال إن بدء الأعمال هو السبيل الوحيد للثراء", "summary": "38岁两次退出后，他说创业是致富唯一途径 拿66万美元preseed，他搬到硅谷重新开始 Snow Lee在韩国时exit了两家business。上个月，举家搬到California，做最新项目PlugBear。 Business银行里还有47万美元，收到angel investors现金注入后。目前月入7200美元。 二、 直到大学毕业开始第一家公司那一刻，Snow", "summary_en": "After quitting twice at the age of 38, he said starting a business was the only way to get rich. Preseed, he moved to Silicon Valley to start over and exited two businesses while Snow Lee was in South Korea. Last month, my family moved to California to work on its latest project, PlugBear. Business Bank still had $470,000 in it after receiving a cash injection from angel investors. The current monthly income is US$7200. 2. Until the moment when I graduated from college and started my first company, Snow", "summary_jp": "38歳で2度退職した後、起業家精神が金持ちになる唯一の方法だと言い、シリコンバレーに移り、韓国で2つの事業を再開した。先月、家族はカリフォルニア州に引っ越し、PlugBearプロジェクトに取り組みました。ビジネス銀行はエンジェル投資家から現金注入を受けた後、47万ドルを保有している。現在は月額7，200ドル。大学を卒業して最初の会社を始めるまで、スノー", "summary_ar": "بعد أن انسحب مرتين في سن 38 ، قال إن بدء الأعمال هو السبيل الوحيد لتحقيق الثراء مع 660،000 دولار ، انتقل إلى وادي السيليكون لإعادة بدء أعمال Snow Lee في كوريا الجنوبية.في الشهر الماضي، انتقلت العائلة إلى كاليفورنيا للقيام بأحدث مشروع لها، PlugBear.لا يزال هناك 470،000 دولار في بنك الأعمال ، بعد تلقي ضخ نقدي من المستثمرين الملائكة.وتبلغ الدخل الشهري حاليا 7200 دولار أمريكي.الثاني: حتى اللحظة التي تخرج فيها من الجامعة لبدء أول شركة ، Snow", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/hbMiXIoZsueV9D3L58DP/vOqaQ3DJwYRP8MNEjUOSMger71w1/nevo-david-founder-of-postiz.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0178", "title": "不情愿地做产品化代理，两年做到年入百万", "title_en": "Reluctantly to work as a product agent, achieving an annual income of millions in two years", "title_jp": "不本意ながら製品化エージェントを行い、2年間で100万人に達する", "title_ar": "المنتجات المهنية، وتحصل على مليون في السنة لمدة سنتين.", "summary": "不情愿地做产品化代理，两年做到年入百万 他说：我本不想做代理，但现在觉得这被低估了 Corey Haines从19岁就知道想成为entrepreneur。所以intentionally开始build up skills和experience。 给几个startups做marketing。Also lot of consulting。Built newsletter叫Swipe F", "summary_en": "Reluctantly working as a product agent, he achieved a million-dollar income in two years. He said: I didn't want to be an agent, but now I feel it's underestimated. Corey Haines has known since he was 19 years old that he wanted to be an entrepreneur. So intentionally start building up skills and experience. Marketing several startups. Also lot of consulting。Built newsletter called Swipe F", "summary_jp": "不本意ながらプロダクトエージェントとして働き、2年間で年間100万ドルを達成した彼は“エージェントになりたくなかったが、コーリー·ヘインズは19歳から起業家になりたいと思っていた”と語った。だから意識的にスキルと経験を構築し始めなさい。いくつかのスタートアップをマーケティングする。コンサルティングも豊富です。Build NewsletterはSwipe Fです。", "summary_ar": "ويقول كوري هاينز: \"لم أكن أرغب في أن أكون وكيلاً، ولكن الآن أشعر أنه من المهم التقليل من شأن ذلك.\"لذلك intentionally تبدأ بناء المهارات والخبرة.التسويق لبعض الشركات الناشئةوكذلك الكثير من الاستشارات.رسالة إخبارية مدمجة تسمى Swipe F", "thumbnail": "https://images.indiehackers.com/post-images/iZB6ZWmkqbvMkHxCRjT5/vOqaQ3DJwYRP8MNEjUOSMger71w1/steady-homepage.png?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0179", "title": "摩尔多瓦创业者，从零做到百万ARR的产品组合", "title_en": "Moldovan entrepreneur, achieving a product portfolio of millions of ARRs from zero", "title_jp": "モルドバの起業家、ゼロから数百万のARRポートフォリオに", "title_ar": "رواد الأعمال المولدوفيين ، محفظة من الصفر إلى مليون ARR", "summary": "摩尔多瓦创业者，从零做到百万ARR的产品组合 14年 bootstrapping，他说：不要等待一夜成功 Andrei Valeanu来自摩尔多瓦共和国，现在Barcelona。 Journey began in 2010，started Designmodo as blog。2011年，side income matched salary，went full time。Inde", "summary_en": "Moldovan entrepreneur who has bootstrapping a product portfolio of millions of ARRs from zero for 14 years, said: Don't wait for overnight success Andrei Valeanu is from the Republic of Moldova and now Barcelona. Journey began in 2010，started Designmodo as blog。In 2011, side income matched salary, went full time. Inde", "summary_jp": "14年間のブートストラップでゼロから何百万ものARRのポートフォリオを構築したモルドバの起業家は、“一夜の成功を待つな、モルドバ共和国、そして今バルセロナ出身のAndrei Valeanu。Journeyは2010年にブログとしてデザインモジュールを開始した。2011年には、サイド収入が給与にマッチし、フルタイムになります。インデ", "summary_ar": "مولدوفا رائد الأعمال، من الصفر إلى مليون ARR محفظة 14 عاما من التمهيد، وقال: لا تنتظر النجاح بين عشية وضحاها أندريه فاليانو من جمهورية مولدوفا، والآن برشلونة.بدأت رحلة في عام 2010 ، بدأت Designmodo كمدونة.في عام 2011 ، كان الدخل الجانبي مطابقًا للراتب ، ذهب بدوام كامل.إند", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/igZlngx39s8WnbclJ9NM/PWairgiOpneHvkGJri7RVbtORKI2/Sameer%20Narkar_founder2.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0180", "title": "救人命还能赚副业收入，他的飞机追踪App", "title_en": "Saving lives can also earn sideline income, his aircraft tracking App", "title_jp": "命を救うことも副業収入を得る、彼の飛行機追跡アプリ", "title_ar": "إنقاذ حياة الناس وكسب دخل ثانوي، تطبيق تتبع طائرته", "summary": "救人命还能赚副业收入，他的飞机追踪App 业余项目变成了救命工具，他说：别过度工程化 Ernst Mulders从16岁左右开始，在学习和工作之外build东西。 Very productminded person，just want build everything pops into mind。Always launching things on Product Hunt或", "summary_en": "Saving lives can also earn sideline income. His amateur project of the aircraft tracking App has become a life-saving tool. He said: Don't over-engineer Ernst Mulders started building things outside of study and work since he was around the age of 16. Very productminded person，just want build everything pops into mind。Always launching things on Product Hunt or", "summary_jp": "彼のアマチュアプロジェクトである飛行機追跡アプリは、命を救うツールになりました。Ernst Muldersは、16歳頃から勉強や仕事以外のものを作り始めました。非常に生産的な人々は、心の中ですべてを構築したい。常にプロダクトハントで物事を展開したり", "summary_ar": "إنقاذ الأرواح يمكن أن يكسب دخلًا جانبيًا ، وتحول مشروعه الهواة لتطبيق تتبع الطائرات إلى أداة إنقاذ الحياة ، كما يقول: \"لا تبالغ في الهندسة\" بدأ إرنست مولدرز في سن 16 تقريبًا في بناء الأشياء خارج الدراسة والعمل.شخص productminded للغاية ، يريد فقط بناء كل شيء يظهر في الذهن.دائمًا إطلاق الأشياء على Product Hunt أو", "thumbnail": "https://cdn.jsdelivr.net/gh/kylinstar2019/wad%40main/websiteArticleDeta/images/article_0180.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0181", "title": "收购AI微SaaS，两年做到月入40万", "title_en": "Acquired AI Micro SaaS and achieved a monthly income of 400,000 in two years", "title_jp": "AIマイクロSaaSを買収、2年間で月額40万ドルを達成", "title_ar": "شراء AI Micro SaaS ، أرباح 400 ألف شهرياً لمدة عامين", "summary": "收购AI微SaaS，两年做到月入40万 从SEO顾问到AI创业者，他的增长 playbook Ryan Darani过去6年在Internet上build各种business。Previous life，worked as SEO（inhouse和agency）before launching SEO consultancy——first 'big' success。Peak时，", "summary_en": "Acquired AI Micro SaaS and earned 400,000 a month in two years. From SEO consultant to AI entrepreneur, his growth playbook Ryan Darani has built various businesses on the Internet over the past 6 years. Previous life, worked as SEO (house and agency) before launching SEO consultation--first 'big' success. Peak,", "summary_jp": "AIマイクロSaaSを買収し、SEOコンサルタントからAI起業家まで2年間で月間40万人を獲得し、彼の成長プレイブックRyan Daraniは過去6年間インターネット上で様々なビジネスを構築してきました。SEOコンサルティングを開始する前にSEO（社内および代理店）として働いてきました-最初の“大きな”成功。ピーク時、", "summary_ar": "الاستحواذ على AI microSaaS ، وحقق أرباح 400،000 في الشهر لمدة عامين من مستشار SEO إلى رواد الأعمال AI ، كتابه للنمو Ryan Darani بناء الأعمال التجارية المختلفة على الإنترنت على مدى السنوات الست الماضية.الحياة السابقة ، عملت كمسئولات تحسين محركات البحث (داخلية ووكالة) قبل إطلاق استشارات تحسين محركات البحث - النجاح \"الكبير\" الأول.في الذروة،", "thumbnail": "https://images.indiehackers.com/post-images/kIRoiABUe3yTPC6AgvrN/vOqaQ3DJwYRP8MNEjUOSMger71w1/cuppa-hero.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0182", "title": "25岁营销人辞职创业：只要做热爱的事，多少钱都能活", "title_en": "A 25-year-old marketer resigned and started a business: as long as he did what he loved, he could live on as much money as he could", "title_jp": "25歳のマーケティング担当者が起業を辞める：好きなことをする限り、いくらでも生きることができる", "title_ar": "مسوق يبلغ من العمر 25 عامًا يستقيل لبدء مشروع تجاري: يمكنك العيش بقدر ما تحبه", "summary": "25岁营销人辞职创业：只要做热爱的事，多少钱都能活 6个月runway，他说：我可以活在任何金额，只要做热爱的事 25岁的Alex Liu六月quit job，100% focus on new product AutoAE。七月launch，现在$400 MRR，six months runway left。 Pressure's on。 二、 几年前coll", "summary_en": "A 25-year-old marketer resigned and started a business: As long as he did what he loved, he could live for 6 months. He said: I can live for any amount of money, as long as he did what he loved, 25-year-old Alex Liu quit his June job, 100% focus on new product AutoAE. July launch, now $400 MRR, six months runway left. Pressure's on。2. coll a few years ago", "summary_jp": "25歳のマーケティング担当者は起業家精神を辞める：限り、愛のことを行う限り、どのくらいのお金は6 ヶ月間実行することができます、彼は言った：私は愛のことを行う限り、任意の量で生きることができます25歳のアレックスLiu 6月quitジョブ、新しい製品AutoAEに100%焦点。7月のローンチ、現在$400 MRR、6 ヶ月間のランニングオフ。プレッシャーがかかっている。2年前、コール。", "summary_ar": "25 عاما من التسويق استقالة بدء الأعمال التجارية: طالما أن تفعل ما يحب، كم من المال يمكن أن تعيش لمدة 6 أشهر runway، وقال: أستطيع أن أعيش في أي مبلغ، طالما أن تفعل ما يحب أليكس ليو 25 عاما من يونيو quit job, 100٪ التركيز على المنتج الجديد AutoAE.يوليو إطلاق، الآن $400 MRR، ستة أشهر المدرج اليسار.الضغط على.منذ عدة سنوات، كول", "thumbnail": "https://images.indiehackers.com/post-images/j2n9ECQvdJBw9Gvf4TKA/vOqaQ3DJwYRP8MNEjUOSMger71w1/supastarter-homepage.png?w=1400?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0183", "title": "从融资公司到年入百万美金：他用18个月证明，靠自己才是王道", "title_en": "From financing a company to annual income of millions of dollars: It took him 18 months to prove that relying on himself is the king", "title_jp": "資金調達会社から年間100万ドルまで：彼は18 ヶ月で自分が王様であることを証明しました", "title_ar": "من شركة تمويل إلى مليون دولار سنوياً: استغرق 18 شهراً لإثبات أنه هو الملك بنفسه", "summary": "从融资公司到年入百万美金：他用18个月证明，靠自己才是王道 导语： 41岁，25年码龄，经历过 Katrina 飓风失去一切，被 Seth Godin 挖去当 CTO，把公司干到年收入 1000 万美金——然后呢？他说：去他妈的融资，老子要自己干。 Gil Hildebrand 今年 41 岁。 15 岁就开始写代码。18 岁辍学，因为那时候他当独立顾问已经能拿到 50 美金一小", "summary_en": "From financing a company to annual income of millions of dollars: He spent 18 months proving that he is the king's king. Lead: 41 years old, 25 years old, he lost everything through Hurricane Katrina, was hired by Seth Godin as a CTO, and worked the company until the annual income was 10 million US dollars-then what? He said: Fuck financing, I want to do it myself. Gil Hildebrand is 41 years old. Started writing code at the age of 15. He dropped out of school at the age of 18 because by then he could already get US$50 per school as an independent consultant", "summary_jp": "資金調達会社から年間100万ドルまで：彼は18 ヶ月を使って、自分自身が王様であることを証明しました。41歳、25歳、ハリケーンカトリーナを経験してすべてを失い、セス·ゴーディンによってCTOとして掘り出され、会社を年間収益1000 万ドルにしました。彼は言いました“資金調達は自分でやるんだ”ジル·ヒルデブランドは41歳。15歳でコードを書き始める。18歳で学校を中退しました独立コンサルタントとして50ドルを稼いでいたからです", "summary_ar": "من شركة تمويل إلى مليون دولار سنوياً: أثبت أنه كان في الثمانية عشر شهراً هو نفسه: 41 عاماً، 25 عاماً، خسر كل شيء في إعصار كاترينا، تم تعيينه كمدير تقني من قبل سيث غودين، وأدى الشركة إلى 10 ملايين دولار سنوياً - ثم ماذا؟وقال: \"أذهب إلى اللعنة، وأريد أن أفعل ذلك بنفسي\".جيل هيلدبراند يبلغ من العمر 41 عاما.بدأت في كتابة الرموز في سن الخامسة عشرة.ترك المدرسة في الثامنة عشرة من عمره لأنه كان يتقاضى 50 دولاراً في السنة كاستشاري مستقل.", "thumbnail": "https://images.indiehackers.com/post-images/j4pRR51ReC22qypJ1mQb/vOqaQ3DJwYRP8MNEjUOSMger71w1/baremetrics-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0184", "title": "融资5200万美金后，他 pivoted 做AI：6个月做到月入6位数", "title_en": "After raising US$52 million, he floated AI: achieving 6-digit monthly income in 6 months", "title_jp": "5200万ドルを調達した後、彼はAIにピボットしました：6 ヶ月で毎月6桁の数字を達成", "title_ar": "بعد تمويل 52 مليون دولار ، تحول إلى الذكاء الاصطناعي: 6 أشهر لتحقيق دخل شهري من 6 أرقام", "summary": "融资5200万美金后，他 pivoted 做AI：6个月做到月入6位数 导语： 疫情期间他踩中了远程办公的风口，公司估值飙升。疫情结束，增长归零。然后他看到了 ChatGPT，做了一个决定——All in AI。 Flo Crivello 是个幸运儿。 真的。 2020 年初，他开始做 Teamflow，一个虚拟办公室产品。 开始做的 3 周后，疫情爆发了。 远程办", "summary_en": "After raising US$52 million, he volunteered to do AI: he achieved a monthly income of 6 digits in 6 months. Lead: During the epidemic, he stepped on the trend of telecommuting, and the company's valuation soared. The epidemic is over and growth returns to zero. Then he saw ChatGPT and made a decision-All in AI. Flo Crivello is a lucky man. Really. In early 2020, he started making Teamflow, a virtual office product. Three weeks after it started, the epidemic broke out. remote office", "summary_jp": "5200万ドルを調達した後、彼はAIを採用しました。6 ヶ月間で6桁の数字を達成しました。流行中、彼は在宅勤務のコンセントを踏んで、会社の評価が急上昇しました。病気は終わり、成長はゼロになる。それから彼はChatGPTを見て、AIですべてを決定しました。フロ·クリヴェッロは幸運な男だった。ホントに。2020年初頭、バーチャルオフィス製品であるTeamflowの開発を開始した。開始から3週間後、流行が勃発した。遠隔で行う。", "summary_ar": "بعد تمويل 52 مليون دولار ، تحول إلى القيام بالذكاء الاصطناعي: خلال ستة أشهر ، حقق دخلاً شهرياً من ستة أرقام: أثناء الوباء ، دوس على منفذ العمل عن بعد ، وارتفعت قيمة الشركة.وانتهى الوباء، وانصب النمو إلى الصفر.ثم رأى ChatGPT واتخذ قرارًا - All in AI.كان Flo Crivello محظوظًا.حقاً.في أوائل عام 2020 ، بدأ العمل على Teamflow ، وهو منتج مكتب افتراضي.وبعد ثلاثة أسابيع من بدء العمل، اندلع الوباء.المكاتب عن بعد", "thumbnail": "https://images.indiehackers.com/post-images/jQRZDnzwm8DFAaS4Xrq0/vOqaQ3DJwYRP8MNEjUOSMger71w1/screenshotone-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0185", "title": "3年做到40万美金ARR：AI产品找准ICP的黄金法则", "title_en": "ARR of US$400,000 in 3 years: The golden rule for AI products to find ICP", "title_jp": "3年間で$400，000 ARRを達成：AI製品はICPの黄金律を見つける", "title_ar": "أرباح 400 ألف دولار في 3 سنوات: منتجات الذكاء الاصطناعي تحدد القاعدة الذهبية لـ ICP", "summary": "3年做到40万美金ARR：AI产品找准ICP的黄金法则 导语： 创业16年，卖了2家公司。第三次创业，他花了整整18个月才搞清楚一件事——谁才是他的真正客户。 Snow Lee 是个老司机了。 16 年创业路，3 次创业，2 次成功退出。年薪 80 万美金的产品负责人做到顶，他说：老子要自己干。 这次他要做 Runbear，一个让非技术团队也能轻松创建 AI Agent 的平台", "summary_en": "ARR of US$400,000 in 3 years: The golden rule for AI products to find ICP Lead: After 16 years of entrepreneurship, I sold 2 companies. In his third venture, it took him a full 18 months to figure out one thing-who were his real customers. Snow Lee is an old driver. In 16 years of entrepreneurship, he started businesses 3 times and successfully quit 2 times. The product manager with an annual salary of US$800,000 was the best. He said: I want to do it myself. This time he wants to build Runbear, a platform that allows non-technical teams to easily create AI Agents", "summary_jp": "3年間で40万ドルARRを達成する：AI製品はICPの黄金律を見つける：創業16年、2社を売却しました。3度目のスタートアップでは、本当の顧客が誰かを理解するのに18 ヶ月かかりました。スノー·リーは古い運転手だった。16 年の創業、3回の創業、2回の撤退に成功した。年間80 万ドルの製品責任者がピークを達成し、彼は言った：老子は自分でそれをしたい。今回は、技術者以外のチームでもAIエージェントを簡単に作成できるプラットフォームであるRunbearを作ります。", "summary_ar": "أربعة آلاف دولار أمريكي في 3 سنوات ARR: منتجات الذكاء الاصطناعي العثور على القاعدة الذهبية لـ ICP المقدمة: 16 عامًا من بدء الأعمال ، وبيعت شركتين.في المرة الثالثة، استغرق الأمر 18 شهراً كاملاً لمعرفة شيء واحد: من هم عملائه الحقيقيون.سيو لي هو سائق عجوز. 16 عاما من بدء المشاريع، 3 بدء الأعمال، 2 انسحاب ناجح.ويقول مسؤول المنتج الذي يتقاضى راتبًا سنويًا قدره 800 ألف دولار: \"لا أريد أن أفعل ذلك بنفسي\".وهذه المرة هو Runbear، وهي منصة تسهل على الفرق غير التقنية إنشاء وكلاء الذكاء الاصطناعي.", "thumbnail": "https://images.indiehackers.com/post-images/jjxCPLvP6hS71WubpBsb/vOqaQ3DJwYRP8MNEjUOSMger71w1/snow-lee-founder-of-plugbear.png?w=700", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0186", "title": "养娃持家做API：他用2年时间实现了财务自由的99%", "title_en": "Raising a child and running a family as an API: He achieved 99% of his financial freedom in 2 years", "title_jp": "育児API：彼は2年間で経済的自由の99%を達成しました", "title_ar": "ربة طفل في المنزل: حقق 99٪ من الحرية المالية في عامين", "summary": "养娃持家做API：他用2年时间实现了财务自由的99% 导语： 17 年码农，刚生娃，脑子一热说要创业。朋友问：带娃+创业，你疯了吗？他说：试试呗。然后他真的试了...2 年。 Dmytro Krasun 是个典型的工程师。 硕士学历，17 年码龄，做了 10 年软件开发，就是没创过业。 他热爱 API。 各种 API，从小型到高负载的。他在公司里负责 API 开发、文档、跨团", "summary_en": "Raising a baby and running a family as an API: It took him two years to achieve 99% of his financial freedom. Lead: 17 years as a farmer, he just gave birth to a baby, and he suddenly said he wanted to start a business. A friend asked: Bringing a baby + starting a business, are you crazy? He said: Give it a try. Then he really tried... 2 years. Dmytro Krasun is a typical engineer. Master's degree, 17 years of code age, 10 years of software development, but never started a business. He loves API. Various APIs, from small to high-load ones. He is responsible for API development, documentation, cross-team", "summary_jp": "APIを行うために子供を育てる：彼は2年間で99%の財政的自由を達成しました： 17年間のコード農家、ちょうど赤ちゃんを産んだ、心は起業家精神を熱く言った。私の友人：子供とビジネス、あなたは狂っていますか？口癖は“やってみよう”。それから彼は本当に試みた..。2 年だ。Dmytro Krasunは典型的なエンジニアです。修士号、17 年の年齢、ソフトウェア開発の10 年、つまり、ビジネスを作成していません。火が好き。小型から高負荷まで、さまざまなAPIがあります。社内でAPI開発、ドキュメンテーション、チーム横断を担当しています。", "summary_ar": "تربية الأطفال في المنزل للقيام بـ API: استغرق عامين لتحقيق 99٪ من الحرية المالية مقدمة: 17 عاما من المزارع، ولدت للتو طفل، وقال الدماغ الساخن لبدء الأعمال.السؤال: هل أنت مجنون؟ هل أنت مجنون؟فقال: جرب.ثم حاولت حقا... 2 years.كان ديميترو كراسون مهندسًا نموذجيًا.شهادة الماجستير ، 17 عامًا من العمر ، 10 سنوات من تطوير البرمجيات ، لم تبدأ أعمالًا.إنه يحب API.مجموعة متنوعة من API ، من الصغيرة إلى عالية الحمولة.كان مسؤولاً عن تطوير API والوثائق والفريق عبر الشركة.", "thumbnail": "https://images.indiehackers.com/post-images/jyU3Rf1v7Bkvl69p9iCv/vOqaQ3DJwYRP8MNEjUOSMger71w1/conversion-factory-homepage.png?w=1400?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0187", "title": "前英国田径运动员，不懂代码，却做出了月入1000美金的金融科技SaaS", "title_en": "A former British track and field athlete who didn't understand code made a financial technology SaaS that earned $1000 a month", "title_jp": "元イギリスの陸上競技選手はコードを知らないが、金融技術SaaSで月額1，000ドルを稼いだ。", "title_ar": "رياضي بريطاني سابق لا يعرف البرمجيات ولكنه يصنع تقنية مالية SaaS بقيمة 1000 دولار شهرياً", "summary": "前英国田径运动员，不懂代码，却做出了月入1000美金的金融科技SaaS 导语： 他曾为英国国家队跑800米，差一步进奥运。退役后干了三年金融，发现了一个惊人事实：富人管钱的方式，居然还停留在石器时代。 Ben Waterman 的人生轨迹很特别。 专业运动员。代表英国跑田径。 2016 年里约奥运会，他差点就能跑 800 米。差一步。 然后，他被迫面对现实：要去找个真正的", "summary_en": "A former British track and field athlete, who didn't understand code, made a financial technology SaaS lead earning US$1000 a month: He once ran 800 meters for the British national team, one short of stepping into the Olympics. After three years of working in finance after retiring, he discovered a surprising fact: the way the rich manage their money still stayed in the Stone Age. Ben Waterman's life trajectory is very special. Professional athletes. Running in track and field for the UK. At the 2016 Rio Olympics, he almost ran 800 meters. One step away. Then he was forced to face the reality: to find a real", "summary_jp": "元イギリスの陸上競技選手は、コードを理解していませんが、金融技術SaaSの導入に月額1000ドルを作りました。彼は英国代表チームのために800メートルを走っていました。引退後3年間金融をした後、驚くべき事実を発見しました。金持ちがお金を管理する方法は、実際にはまだ石器時代にとどまっています。ベン·ウォーターマンの人生は特別でした。プロのスポーツ選手。イギリスの陸上競技。2016 年のリオデジャネイロオリンピックでは800 mを走ることができた。一歩足りない。そして、彼は現実と向き合うことを余儀なくされました。", "summary_ar": "لاعب ألعاب القوى البريطاني السابق ، لا يعرف البرمجيات ، ولكنه قام بتقديم خدمة SaaS للتكنولوجيا المالية بقيمة 1000 دولار شهريًا: ركض 800 متر مع المنتخب الوطني البريطاني قبل دخوله الألعاب الأولمبية.بعد ثلاث سنوات من التقاعد في مجال التمويل ، اكتشف حقيقة مذهلة: الطريقة التي يدير بها الأغنياء أموالهم ، لا تزال في العصر الحجري.مسار حياة بن ووترمان مميز للغاية.الرياضيين المحترفين.تمثل بريطانيا في السباق.في دورة الألعاب الأولمبية في ريو 2016، كان قادرا على الركض لمسافة 800 متر.خطوة بعيدة.ثم اضطر إلى مواجهة الواقع: العثور على شخص حقيقي.", "thumbnail": "https://images.indiehackers.com/post-images/k3s7oHtdpNlwc5umlquL/vOqaQ3DJwYRP8MNEjUOSMger71w1/designmodo-homepage.png?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0188", "title": "9年做到7位数：在巨头阴影下，他用15年愿景杀出一条血路", "title_en": "Achieving 7 figures in 9 years: In the shadow of giants, he used his 15-year vision to carve out a bloody path", "title_jp": "7桁を達成するために9年間：巨人の影で、彼は15年間のビジョンを持っています。", "title_ar": "7 أرقام في 9 سنوات: في ظل العملاقة، وقال انه يقتل طريق الدم مع رؤية لمدة 15 عاما", "summary": "9年做到7位数：在巨头阴影下，他用15年愿景杀出一条血路 导语： 前 3 年只有 1500 MRR。第 4 年，疫情来了，双胞胎来了，收入来源没了。所有人都说：放弃吧。他说：不。9 年后，他做到了 7 位数 ARR。 Geoff Roberts 是个意外进入科技行业的人。 他大学学写作。2008 年毕业，经济危机，写博客没前途。 于是读了 MBA，进了波士顿一家早期创业公司叫", "summary_en": "Achieving 7 figures in 9 years: In the shadow of giants, he used his 15-year vision to carve out a bloody path. Lead: In the first three years, there was only 1500 MRR. In the fourth year, the epidemic came, the twins came, and the source of income was gone. Everyone said: Give up. He said: No. Nine years later, he achieved a 7-digit ARR. Geoff Roberts was an accidental entry into the technology industry. He studied writing in college. Graduated in 2008, the economic crisis, and there is no future for blogging. So I got an MBA and joined an early startup company in Boston called", "summary_jp": "9年間で7桁を達成：巨人の影の中で、彼は15年間のビジョンを使って道を切り開いています。最初の3年間はわずか1500 MRRでした。4 年目に流行が起こり双子がやってきて収入源がなくなりました誰もが“あきらめる”と言う。彼は言った：いいえ9 年後、彼は7桁のARRを達成しました。ジェフ·ロバーツは偶然テクノロジー業界に入った人です大学で執筆を学んだ。2008 年卒業、経済危機、ブログの未来はない。MBAを取得しボストンの初期段階のスタートアップに入社しました", "summary_ar": "في 9 سنوات لتحقيق سبعة أرقام: تحت ظل العملاق ، استخدم رؤية 15 عامًا لقتل دليل مسار الدم: فقط 1500 MRR في السنوات الثلاث الأولى.في السنة الرابعة، جاء الوباء، جاء التوأمان، ومصدر الدخل قد ذهب.فقال الجميع: استسلموا.قال: لا.بعد تسع سنوات ، حقق ARR من 7 أرقام.كان جيف روبرتس شخصًا دخل صناعة التكنولوجيا عن طريق الخطأ.تعلم الكتابة في الجامعة.تخرج في عام 2008، الأزمة الاقتصادية، والمدونة لا مستقبل لها.ودرس ماجستير في إدارة الأعمال، ودخل في شركة ناشئة في بوسطن في وقت مبكر تسمى", "thumbnail": "https://images.indiehackers.com/avatars/300x300_tSHyRvzNLWPnx4sBYEdtWkmq4u93.webp?1721747237245?w=56", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0189", "title": "从主题模板到月入6万5：他用7年建了一个开发者工具帝国", "title_en": "From theme templates to monthly income of 65,000: He spent 7 years building a developer tools empire", "title_jp": "テーマテンプレートから月額60，000ドルまで：彼は7年間で開発ツール帝国を構築しました", "title_ar": "من قالب موضوع إلى 60،000 في الشهر: لقد بنى إمبراطورية أدوات المطور في 7 سنوات", "summary": "从主题模板到月入6万5：他用7年建了一个开发者工具帝国 导语： 2018年，他和搭档还在软件公司打工，发现每个项目都要重复造轮子做管理后台。一个念头闪过：为什么不做个现成可用的？7年后，他们月入6.5万美金。 Ajay Patel 是个 15 年老兵。 技术行业摸爬滚打 15 年，做过创业者、程序员、产品创新者。 Clevision 是他和 Vrushank 在 2018 年创", "summary_en": "From theme templates to monthly income of 65,000: He spent 7 years building a developer tool empire Lead: In 2018, he and his partner still worked in a software company and found that every project had to duplicate wheels to serve as the management background. A thought flashed through his mind: Why not make it ready-made? Seven years later, they earned $65,000 a month. Ajay Patel is a 15-year veteran. The technology industry has been in the past 15 years and has been an entrepreneur, programmer, and product innovator. Clevision was created by him and Vrushank in 2018.", "summary_jp": "テーマテンプレートから月額60，000まで：彼は7年間で開発ツール帝国を構築しました： 2018年、彼とパートナーはまだソフトウェア会社で働いていましたが、すべてのプロジェクトが管理バックグラウンドとして車輪を再構築する必要があることを発見しました。アイデアが浮かびました“すぐに使えるものを作ってみませんか？”7年後、彼らは月額65，000ドルを稼いだ。アジェイ·パテルは15歳のベテランです。テクノロジー業界は15年間、起業家、プログラマー、製品イノベーターとして働いてきました。Clevisionは2018 年に彼とVrushankによって設立された。", "summary_ar": "من قوالب المواضيع إلى دخل شهري قدره 65 ألف دولار: استغرق سبع سنوات لبناء إمبراطورية أدوات المطور: في عام 2018 ، كان يعمل هو وشركاؤه في شركة برمجيات ووجدوا أن كل مشروع يتطلب تكرارًا لتصميم عجلات لإدارة خلفية.فكرة واحدة: لماذا لا تجعل جاهزا للاستخدام؟وبعد سبع سنوات، كان يحصلون على 65 ألف دولار شهرياً.أجي باتل هو جندي قدامى 15 عاما.عملت في صناعة التكنولوجيا لمدة 15 عامًا ، وكانت رائدة أعمال ومبرمجة ومبتكرة للمنتجات.كان Clevision هو الذي أنشأه هو و Vrushank في عام 2018.", "thumbnail": "https://images.indiehackers.com/post-images/kIRoiABUe3yTPC6AgvrN/vOqaQ3DJwYRP8MNEjUOSMger71w1/cuppa-hero.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0190", "title": "3个月做到月入6万2：他是如何用AI工具构建AI工具的", "title_en": "Achieving a monthly income of 62,000 yuan in 3 months: How he used AI tools to build AI tools", "title_jp": "3 ヶ月で月額60，000を達成：彼はAIツールを使ってAIツールを構築する方法", "title_ar": "60 ألف دولار شهرياً في 3 أشهر: كيف قام ببناء أداة AI مع أداة AI", "summary": "3个月做到月入6万2：他是如何用AI工具构建AI工具的 导语： 26岁，伦敦金丝雀码头33层公寓，高级软件工程师。外人眼中的梦想生活。他却觉得：我在写一些对自己毫无意义的代码。然后，他辞职了。 Cameron Trew 曾经拥有一切。 13 岁开始编程，在卧室里搭建 RuneScape 私服。 对创造的痴迷从未消退。 计算机科学学位，6 年软件工程师经验。从创业公司到 Ela", "summary_en": "Earned 62,000 a month in 3 months: How he used AI tools to build AI tools: 26 years old, senior software engineer, 33rd floor apartment in Canary Wharf, London. Dream life in the eyes of outsiders. But he thought: I was writing some code that made no sense to me. Then he resigned. Cameron Trew once had it all. He started programming at the age of 13 and built a RuneScape private service in his bedroom. The obsession with creation never subsided. Degree in Computer Science and 6 years of experience as a software engineer. From startups to Ela", "summary_jp": "3 ヶ月で月額60，000を達成：AIツールを使ってAIツールを構築する方法： 26歳、ロンドンのカナリーワーフの33階のアパート、シニアソフトウェアエンジニア。外国人の目から見た夢。自分には意味のないコードを書いていると感じましたそして彼は辞任した。キャメロン·トレウが所有した。13歳でプログラミングを始め、寝室でRuneScapeのスーツを作る。創造への執着は決して消えません。コンピュータサイエンスの学位、ソフトウェアエンジニアとしての6 年の経験。会社からエラへ", "summary_ar": "60 ألف دولار شهرياً في 3 أشهر: وهو مدرب على كيفية بناء أدوات الذكاء الاصطناعي باستخدام أدوات الذكاء الاصطناعي: 26 عاماً، شقة من الطابق 33 في كيناري مارينا في لندن، مهندس برمجيات كبير.حياة الحلم في عيون الغرباءكان يشعر: أنا أكتب شفرة لا معنى لها بالنسبة لي.وبعد ذلك استقال.كان كاميرون تريو يملك كل شيء.بدأ البرمجة في سن 13 عامًا ، وبنى RuneScape في غرفة نومه.الهوس بالخلق لم يختفي أبداً.شهادة في علوم الكمبيوتر ، 6 سنوات من الخبرة في مجال مهندس البرمجيات.من الشركة الناشئة إلى إيلا", "thumbnail": "https://images.indiehackers.com/post-images/kMEnZL7w6j3lm03yVIcL/vOqaQ3DJwYRP8MNEjUOSMger71w1/alex-liu-founder-of-autoae.png?w=700", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:42"}, {"_id": "article_0191", "title": "失败APP到30个APP月入2.2万，不到一年", "title_en": "Failed apps earned 22,000 yuan a month from 30 apps, less than a year", "title_jp": "30アプリに失敗したアプリは、1年未満で22，000に月に入る", "title_ar": "التطبيق الفاشل إلى 30 تطبيقات في 22 ألف شهريا، أقل من عام", "summary": "失败APP到30个APP月入2.2万，不到一年 James Fleischmann用几年时间证明了一件事：做对事，比拼命做事重要100倍。 年入2万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在咖啡馆写东西】 对面坐了个年轻人，一直在叹气。我问他怎么了。他说做了一年多AI产品，没什么起色。我说那你知道James Fleischmann吗？ 01 接下来怎么办？", "summary_en": "Failed apps earn 22,000 yuan a month from 30 apps. In less than a year, James Fleischmann spent a few years proving one thing: doing things right is 100 times more important than doing things hard. Annual income is 20,000 US dollars, per person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Writing in a cafe] There was a young man sitting opposite him, sighing all the time. I asked him what was wrong. He said that he had been making AI products for more than a year and had no improvement. I said, do you know James
