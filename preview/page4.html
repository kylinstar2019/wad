ة على تحقيق 50 ألف دولار في الشهر في سوق البحر الأحمر في أقل من عامين أثبت جيمس فليشمان شيئًا: أن القيام بالأشياء الصحيحة أهم 100 مرة من القيام بها بشكل يائس. 50 ألف دولار سنوياً لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. [صديق يقوم بتطوير مستقل طلب مني تناول الطعام] في منتصف تناول الطعام ، وضع الععصي: \"أنا قلق بشكل خاص في الآونة الأخيرة.أنا لا أعرف كيف أتخلى عن ذلك، أقول لي أن أقول لكم شخصيا.اسمه جيمس فليشمان.جيمس: من أين بدأ كل هذا؟رحول: أنا خريج في علوم الكمبيوتر من جامعة ستانفورد، وكانت مهندس برمجيات سابق، وعملت في شركات مثل Pinterest و Facebook.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/n1Zc94RqDgkJnsYvTGPM/vOqaQ3DJwYRP8MNEjUOSMger71w1/headerImage", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:50"}, {"_id": "article_0194", "title": "多元化失败的教训：如何从0到月入4万美元", "title_en": "Lesson from failed diversification: How to make $40,000 a month from zero to zero", "title_jp": "ダイバーシティの失敗からの教訓：0から$40，000までの収入を得る方法", "title_ar": "دروس من الفشل في التنويع: كيفية الحصول على 40،000 دولار في الشهر من الصفر", "summary": "多元化失败的教训：如何从0到月入4万美元 James Fleischmann用几年时间证明了一件事：做对事，比拼命做事重要100倍。 年入4千美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了快两年产品，还没看到什么希望。 01 接下来怎么办？", "summary_en": "Lesson from the failure of diversity: How to earn $40,000 a month from zero to zero James Fleischmann has spent a few years proving one thing: Doing the right thing is 100 times more important than doing it hard. $4,000 a year, one person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for almost two years and I haven't seen any hope yet. 01 What to do next?", "summary_jp": "ダイバーシティの失敗からの教訓：0から$40，000まで稼ぐ方法James Fleischmannは、数年にわたって1つのことを証明しました。正しいことをすることは、必死にするよりも100倍重要です。1人で年間4000ドル。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。2年近く経っても希望はありません。0 1次は何？", "summary_ar": "دروس الفشل في التنوع: كيفية الحصول على 40،000 دولار من الصفر في الشهر أمضى جيمس فليشمان عدة سنوات في إثبات شيء: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بشكل يائس.أربعة آلاف دولار في السنة لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.معنى: ما يقرب من عامين من المنتج، لا أرى أي أمل. 01 ماذا تفعل بعد؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/n3ROXFtp7nWcTWO1XayK/vOqaQ3DJwYRP8MNEjUOSMger71w1/louis-david-paul-hus-founder-of-archetype.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:53"}, {"_id": "article_0195", "title": "AI营销工具月入3万美元：从副业到全职的路径", "title_en": "AI marketing tools earn $30,000 a month: the path from sideline to full-time", "title_jp": "AIマーケティングツールが月額$30，000を獲得：副業からフルタイムへの道", "title_ar": "أدوات التسويق الذكاء الاصطناعي 30،000 دولار في الشهر: المسار من العمل الجانبي إلى بدوام كامل", "summary": "AI营销工具月入3万美元：从副业到全职的路径 同样做产品，为什么有人做到一半放弃了，有人能做到年入3万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【跟一个朋友吃烤串】 他咬了一口鸡翅，突然放下：\"我最近在想一件事——我是不是选错方向了？\"我说你等等，我给你讲个故事。 01 接下来怎么办？ 他说了一句话我记到现在：", "summary_en": "AI marketing tools earn US$30,000 a month: The path from sideline to full-time also makes products. Why do some people give up halfway and some people earn US$30,000 a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Eating kebabs with a friend] He took a bite of the chicken wings and suddenly put them down: \"I've been thinking about something recently-did I choose the wrong direction? \"I said wait, I will tell you a story. 01 What to do next? He said something that I remember to this day:", "summary_jp": "AIマーケティングツールは月額$30，000：副業からフルタイムのパスも製品を行うために、なぜ誰かが半分あきらめることを行い、誰かが$30，000年間を行うことができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。彼は手羽先を噛んで、突然それを置いた：“私は最近何かを考えていた-私は間違った方向を選んだか？“ちょっと待って、話をしましょう。0 1次は何？彼は今でも覚えていることを言った。", "summary_ar": "أدوات التسويق الذكاء الاصطناعي 30،000 دولار شهريا: من العمل الجانبي إلى بدوام كامل المسار للقيام بنفس المنتجات، لماذا يستسلم بعض الناس في النصف، والبعض الآخر يمكن أن يحصل على 30،000 دولار سنويا؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (أكل كوب شوي مع صديق) قضم أجنحة الدجاج وأسقطها فجأة: \"كنت أفكر في شيء واحد في الآونة الأخيرة - هل أخذت الاتجاه الخاطئ؟\" \"أقول لك انتظر، سأخبرك قصة\". 01 ماذا تفعل بعد؟قال له كلمة أتذكرها حتى الآن:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/n59ORJCYjnZC61Q096UL/PWairgiOpneHvkGJri7RVbtORKI2/Richard%20Wang_founderr.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:55"}, {"_id": "article_0196", "title": "做不可能的事，3个月赚10万美元", "title_en": "Do the impossible and make $100,000 in 3 months", "title_jp": "不可能なことをして3 ヶ月で10万ドル稼ぐ", "title_ar": "قم بالأشياء المستحيلة في ثلاثة أشهر لكسب 100 ألف دولار", "summary": "做不可能的事，3个月赚10万美元 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入5万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【跟一个朋友吃烤串】 他咬了一口鸡翅，突然放下：\"我最近在想一件事——我是不是选错方向了？\"我说你等等，我给你讲个故事。 01 “构建多个，发布一个”许可证 关键一步：", "summary_en": "Do the impossible and make $100,000 in 3 months. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $50,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Eating kebabs with a friend] He took a bite of the chicken wings and suddenly put them down: \"I've been thinking about something recently-did I choose the wrong direction? \"I said wait, I will tell you a story. 01 Key step of \"Build multiple, issue one\" license:", "summary_jp": "不可能なことをし、3 ヶ月で$100，000を稼ぐ今日のケースは、起業家精神に対するあなたの理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは年間5万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。彼は手羽先を噛んで、突然それを置いた：“私は最近何かを考えていた-私は間違った方向を選んだか？“ちょっと待って、話をしましょう。0 1“Build Multiple，Release One”ライセンスの重要なステップ：", "summary_ar": "جعل المستحيل كسب 100 ألف دولار في ثلاثة أشهر هذه الحالة اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على 50 ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (أكل كوب شوي مع صديق) قضم أجنحة الدجاج وأسقطها فجأة: \"كنت أفكر في شيء واحد في الآونة الأخيرة - هل أخذت الاتجاه الخاطئ؟\" \"أقول لك انتظر، سأخبرك قصة\". 01 \"بناء أكثر، إصدار واحد\" ترخيص خطوة رئيسية:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/n8qj3KIFVnXF1fUFuYaL/vOqaQ3DJwYRP8MNEjUOSMger71w1/simon-hamp-founder-of-nativephp.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:59"}, {"_id": "article_0197", "title": "被裁后用愤怒驱动，打造成功产品", "title_en": "Driven by anger after being laid off to create a successful product", "title_jp": "解雇された後、怒りで成功する製品を作る", "title_ar": "بعد تسريحهم من الخدمة، يدفعهم الغضب لبناء منتجات ناجحة", "summary": "被裁后用愤怒驱动，打造成功产品 同样做产品，为什么有人月入两千就卡死了，有人能做到年入？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了一年多产品，还没看到什么希望。 01 选择一条车道并坚持下去。 关键一步：", "summary_en": "After being laid off, he was driven by anger to create successful products and also make products. Why do some people get stuck when they earn 2,000 a month, and some people can earn an annual income? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for more than a year and I haven't seen any hope yet. 01 Choose a lane and stick to it. Key step:", "summary_jp": "怒りで解雇された後、成功した製品を作成し、製品を行うために、なぜ誰かが2000人の月にカードで死ぬ、誰かが年に入ることができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。1年以上経っても希望はありません。1車線を選択し、それに固執します。重要なステップ：", "summary_ar": "بعد تسريح مع الغضب، وبناء المنتجات الناجحة نفس المنتجات، لماذا شخص ما دخل 2000 في الشهر عالق الموت، يمكن أن يكون شخص ما في السنة؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.معنى: صنع المنتجات لأكثر من عام ، ولم أرى أي أمل. 01 اختر مسارًا واحتفظ به.الخطوة الحاسمة:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/nabmB9HOZvkx4J9902j6/vOqaQ3DJwYRP8MNEjUOSMger71w1/fernando-pessagno-founder-of-aicarousels.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:01"}, {"_id": "article_0198", "title": "数字游民在东南亚把支付SaaS做到月入1.3万美元", "title_en": "Digital Travellers are paying SaaS to earn US$13,000 a month in Southeast Asia", "title_jp": "デジタルノマド、東南アジアで月額13，000ドルのSaaSを提供", "title_ar": "الرحل الرقمي في جنوب شرق آسيا يدفع 13000 دولار شهرياً من خدمات SaaS", "summary": "数字游民在东南亚把支付SaaS做到月入1.3万美元 同样做产品，为什么有人月入两千就卡死了，有人能做到年入1万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【早高峰地铁上】 刷手机看到一个帖子：\"做SaaS大半年了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了Katie Hignett。 01 桑德：我在大学时担任自由职业者开发人员和设计师。我会尝试在周末空闲时开发产品。最初，我非常不成功。然后，我在 6 年前开始了 Checkout Page，作为一个业余项目。 当时，Stripe 已成为在网站上接受付款的一种非常流行的方式。但没有办法在没有代码的情况下使用它。我构建了一个 MVP 来将付款存入您的 Stripe 账户。", "summary_en": "In Southeast Asia, digital vagrants pay SaaS to a monthly income of US$13,000 and make the same products. Why do some people get stuck with a monthly income of 2,000, and some people can make an annual income of US$10,000? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing SaaS for more than half a year, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of Katie Hignett. 01 Sander: I worked as a freelance developer and designer in college. I will try to develop products during my free weekend. At first, I was very unsuccessful. Then, I started Checkout Page 6 years ago as an amateur project. At that time, Stripe had become a very popular way of accepting payments on websites. But there is no way to use it without code. I built an MVP to deposit payments into your Stripe account.", "summary_jp": "東南アジアのデジタルトラベラーは、同じ製品を行うために月額13，000ドルのSaaS支払いを行うために、なぜ誰かが月額2000ドルで死ぬか、誰かが年間10，000ドルを行うことができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。“朝のピーク地下鉄”ブラシ携帯電話の投稿を参照してください：“SaaSの半年以上、月収はまだホバリングしている、あきらめるべきですか？“私は戻らなかった。ケイティ·ヒネットのことを考えました0 1 Sander：大学時代はフリーランスのデベロッパー兼デザイナーとして働いていました。週末の空き時間に製品を開発してみます。最初は失敗しました。その後、6 年前にアマチュアプロジェクトとしてCheckout Pageを始めました。当時、Stripeはウェブサイト上で支払いを受け付ける非常に人気のある方法になっていました。しかし、コードなしでは使用できません。あなたのStripeアカウントに支払いを入金するためにMVPを作成しました", "summary_ar": "الرحل الرقمي في جنوب شرق آسيا لدفع خدمة الخدمات الإلكترونية لتحقيق الدخل الشهري 13،000 دولار نفس المنتجات، لماذا شخص ما دخل شهريا 2000 عالق الموت، يمكن أن يكون شخص ما دخل سنويا 10،000 دولار؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". [في مترو الأنفاق ذروة الصباح] تمرير الهاتف المحمول لرؤية منشور: \"القيام بـ SaaS لمدة نصف عام ، والدخل الشهري لا يزال يتجول ، هل يجب التخلي عن ذلك؟\" \"لم أعود بعد أن أتحمل.كنت أفكر في كاتي هيغنيت. 01 ساندر: كنت أعمل كمطور ومصمم مستقل في الجامعة.سأحاول تطوير المنتجات أثناء عطلة نهاية الأسبوع.في البداية، كنت غير ناجح للغاية.ثم بدأت Checkout Page قبل 6 سنوات كمشروع هواة.في ذلك الوقت ، أصبح Stripe طريقة شائعة للغاية لقبول الدفع على الموقع.ولكن لا توجد طريقة لاستخدامه دون رمز.لقد قمت ببناء MVP لإيداع المدفوعات في حساب Stripe الخاص بك.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/nuYrPbCoH8Y0h859drg1/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Sander-Visser-CheckoutPage-cofounder.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:02"}, {"_id": "article_0199", "title": "从失败到8个月百万美元ARR", "title_en": "From Failure to 8 Months Million Dollar ARR", "title_jp": "失敗から8 ヶ月で100万ドルARR", "title_ar": "من الفشل إلى 8 أشهر مليون دولار ARR", "summary": "从失败到8个月百万美元ARR James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入100万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【半夜接了个电话】 一看是老朋友。\"不好意思这么晚打给你，但我真的睡不着。\"话筒那边的声音听起来很疲惫。\"我做了大半年了，感觉自己原地踏步。\" 01 接下来怎么办？", "summary_en": "From Failure to 8 Months Million Dollar ARR James Fleischmann proved one thing in less than two years: Doing the right thing is 100 times more important than doing it hard. Annual income is 1 million US dollars, one person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Received a phone call in the middle of the night] I saw that he was an old friend. \"Sorry to call you so late, but I really couldn't sleep. \"The voice on the other side of the microphone sounded tired. \"I've been doing it for more than half a year, and I feel like I'm still standing where I am. \" 01 What should we do next?", "summary_jp": "失敗から8 ヶ月で100万ドルARRジェームズ·フライシュマンは、2年足らずで1つのことを証明しました。正しいことをすることは、一生懸命働くよりも100倍重要です。年間100万ドル、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。夜中に電話がかかってきたのは旧友だ。“こんなに遅く電話して申し訳ありませんが、眠れません。電話の向こうの声は疲れていた。“半年間やっていて、自分が動いているように感じました。0 1次は？", "summary_ar": "من الفشل إلى ثمانية أشهر من مليون دولار ، أثبت جيمس فليشمان شيئًا في أقل من عامين: أن القيام بالأشياء الصحيحة أهم 100 مرة من القيام بها بشكل يائس.مليون دولار في السنة، شخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. (في منتصف الليل) صديق قديم. \"آسف على الاتصال بك في هذا الوقت المتأخر ، لكنني لا أستطيع النوم.\" \"الصوت على الجانب من الميكروفون يبدو متعبًا. \"لقد عملت لمدة نصف عام وأشعر أنني أسير في مكاني. 01 ماذا بعد؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/oA0AqL4jY25lxrQ4uGBl/vOqaQ3DJwYRP8MNEjUOSMger71w1/jordan-gal-founder-of-rosie.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:04"}, {"_id": "article_0200", "title": "卖了一辈子自动生成的播客节目，月入2.7万被动收入", "title_en": "After selling automatically generated podcast programs for a lifetime, earning 27,000 passive income per month", "title_jp": "毎月27，000受動的な収入で自動生成されたポッドキャストを販売した。", "title_ar": "بيع البودكاست التي تم إنشاؤها تلقائيًا طوال حياته ، ودخل سلبي شهريًا يبلغ 27 ألف دولار", "summary": "卖了一辈子自动生成的播客节目，月入2.7万被动收入 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入2千美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了几个月产品，还没看到什么希望。 01 35 岁的塔米尔·巴什金 (Tamir Bashkin) 从未找到过工作。相反，他业务和不干涉的投资策略建立了被动收入。我们来看看他的财务状况。 当塔米尔（Tamir）在军队时，他偶然发现了蒂姆·费里斯（Tim Ferris）的“每周工作 4 小时”并爱上了这个概念。当然，当时他还不能实施，但他一直把这件事放在心上。", "summary_en": "After selling automatically generated podcasts for a lifetime and earning 27,000 yuan a month, the case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann managed to make $2,000 a year alone. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for several months and I haven't seen any hope yet. 01 Tamir Bashkin, 35, has never found a job. Instead, his business and hands-off investment strategies create passive income. Let's take a look at his financial situation. While Tamir was in the military, he stumbled upon Tim Ferris's \"4 hour work week\" and fell in love with the concept. Of course, he couldn't do it at the time, but he kept it in mind.", "summary_jp": "毎月27，000の受動的な収入に自動生成されたポッドキャストの生涯を販売し、今日のケースは起業家精神についてのあなたの理解を変えるかもしれない。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間2，000ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。製品を作って数ヶ月経っても、まだ希望が見えません。35歳のタミール·バシュキンは、仕事を見つけたことがない。代わりに、彼のビジネスと非干渉投資戦略は受動的な収入を構築した。彼の財務状況を見てみましょう。タミールTamirが軍隊にいたとき、彼はティム·フェリスTim Ferrisの“週4時間労働”に偶然出会い、この概念に恋に落ちた。もちろん、当時はまだ実行できませんでしたが、彼はそれを念頭に置いていました。", "summary_ar": "بيع البودكاست التي تم إنشاؤها تلقائيًا مدى الحياة ، والدخل السلبي الشهري 27000 دولار هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على ألفي دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.هذا هو السبب في أنه منذ عدة أشهر ، لم يرى أي أمل.لم يجد تامير باشكين، البالغ من العمر 35 عاماً، وظيفة قط.بدلاً من ذلك ، أنشأت أعماله واستراتيجياته الاستثمارية غير التدخلية دخلًا سلبيًا.دعونا نلقي نظرة على وضعها المالي.عندما كان تمير في الجيش ، صادف تيم فيريس \"العمل لمدة 4 ساعات في الأسبوع\
