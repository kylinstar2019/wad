es that make it first end up dead? It's not because the idea is bad. Because the market is not ready yet. Marcel Petitpas encountered this problem. He was building Parakeeto, the world's first \"profit management company.\" In 7 years, we achieved 7-figure income. But he said the advantage of doing the first thing is also a curse-you have to", "summary_jp": "Pioneer's Curse：最初にやったことはしばしば最悪に死ぬ20250 926“最初にやった”企業の多くが最終的に死んでいることに気づきましたか？悪いアイデアではない。市場は準備ができていないからですマルセル·プティパスはこの問題に直面した。彼は世界初の“利益管理会社”であるParakeetoを設立した。7年間で7桁の収入を得る。しかし、最初の利点は呪いでもあると彼は言います。", "summary_ar": "لعنة الرائد: أول من يفعل ذلك يموت في كثير من الأحيان أكثر من غيرها من الشركات التي تموت في نهاية المطاف؟ليس بسبب فكرة سيئة.لأن السوق ليست مستعدة.وقد واجه مارسل بيتيباس هذه المشكلة.وهو يقوم ببناء باراكيتو، أول \"شركة لإدارة الأرباح\" في العالم.سبع سنوات من الدخل سبعة أرقام.لكنه قال إن الميزة الأولى التي تقوم بها هي لعنة أيضًا - عليك أن تفعل ذلك.", "thumbnail": "https://images.indiehackers.com/post-images/RQaHrYUKBzkPoqnfMbHq/vOqaQ3DJwYRP8MNEjUOSMger71w1/baked-design-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:38"}, {"_id": "article_0107", "title": "两年做到年入350万，她的秘诀是：离客户近一点", "title_en": "Her secret to achieving an annual income of 3.5 million yuan in two years is to stay closer to customers", "title_jp": "年間350万ドルを達成するために2年間、彼女の秘密は顧客に近いことです。", "title_ar": "3 ملايين دولار سنوياً في عامين، وكانت نصائحها هي: اقترب من العملاء", "summary": "两年做到年入350万，她的秘诀是：离客户近一点 2023年8月。 暑假。 大学还没开学。 Thao 和她的联合创始人看到了一堆\"和你的PDF聊天\"的应用。 挺有意思的。 但很快意识到：太局限了。 人们处理的不只是PDF。 还有 Word、网站、演示文稿、视频…… 所以他们花了一个周末， 建了个叫 MindPal 的第一个版本。 一个地方，扔所有文件——", "summary_en": "Her secret to achieving an annual income of 3.5 million yuan in two years is to stay closer to customers by August 2023. Summer vacation. College hasn't started yet. Thao and her co-founder saw a bunch of \"chat with your PDF\" apps. It was fun. But I quickly realized that it was too limited. People are dealing with more than just PDFs. There was also Word, websites, presentations, videos... so they spent a weekend building the first version called MindPal. In one place, throw all documents--", "summary_jp": "年間350万人を達成するために2年間、彼女の秘密は、2023年8月に顧客に近いことです。夏休みです。大学はまだ始まっていない。Thao氏と彼女の共同創業者は、“PDFチャット”アプリをたくさん見てきました。面白いですね。しかしすぐに限界があることに気づきましたPDFを扱うだけではない。Word、Webサイト、プレゼンテーション、ビデオ...そこで彼らは週末にMindPalという最初のバージョンを作りました。すべての書類を捨てる場所-", "summary_ar": "تحقيق 3.5 مليون دولار سنويا في عامين ، وكانت نصيحتها هي: اقترب من العملاء في أغسطس 2023.إجازة الصيف.الجامعة لم تبدأ بعد.رأى ثاو ومؤسستها المشاركين مجموعة من تطبيقات \"الدردشة مع PDF الخاص بك\".إنه مثير للاهتمام.ولكن سرعان ما أدركت: محدود جدا.لا يتعامل الناس مع PDF فقط.كان هناك Word، ومواقع الويب، والعروض التقديمية، ومقاطع الفيديو... لذا أمضوا عطلة نهاية الأسبوع في بناء الإصدار الأول من MindPal.مكان واحد، رمي كل المستندات -", "thumbnail": "https://images.indiehackers.com/post-images/RexPz7AuKvTEcSO2UGkQ/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Heroes-of-Bronze_battlecry.jpg?w=1400?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:38"}, {"_id": "article_0108", "title": "36天，从0到年入700万，只因他挑战了大厂", "title_en": "36 days, from 0 to 7 million yuan a year, just because he challenged the big factory", "title_jp": "36日、0から年間700万まで、彼は大きな工場に挑戦したからです。", "title_ar": "36 يوما، من الصفر إلى 7 ملايين في السنة، فقط لأنه تحدى المصنع الكبير", "summary": "36天，从0到年入700万，只因他挑战了大厂 哥伦比亚大学大二学生。 4天建出产品。 36天做到100万美元 ARR。 现在月入11万，利润率95%。 这是 Roy 的故事。 一个\"慢性规则破坏者\"。 他建了个叫 Interview Coder 的东西。 一个隐形的、实时的 AI 助手。 帮候选人通过 Leetcode 风格的编程面试， 而且", "summary_en": "In 36 days, he earned 7 million yuan from 0 to 7 million yuan per year because he challenged a sophomore at Colombia University in a big factory. 4 days to build the product. Achieve US$1 million ARR in 36 days. Now the monthly income is 110,000 yuan and the profit margin is 95%. This is Roy's story. A \"chronic rule breaker.\" He built something called Interview Coder. An invisible グ、トレーニングのための魅力的なインタラクティブな製品デモの作成を支援します。", "summary_ar": "من صناعة المأكولات البحرية إلى منصة الذكاء الاصطناعي ، حقق ARR من 7 أرقام دخلًا من 7 أرقام في صناعة المأكولات البحرية.ثم غادرت وبنت Supademo. 7 أرقام أخرى ARR.جوزيف هو رجل أعمال متواصل.في سن الخامسة عشرة بدأت في بناء المشاريع والشركات.الآن هو المؤسس والرئيس التنفيذي لشركة Supademo - منصة أتمتة العرض التجريبي الأصلية للذكاء الاصطناعي.مساعدة الآلاف من الشركات على إنشاء عروض تفاعلية جذابة للمنتجات لاستخدامها في التسويق أو المبيعات أو التدريب", "thumbnail": "https://images.indiehackers.com/post-images/Rn84KRTXkG0Gi3p2w51O/vOqaQ3DJwYRP8MNEjUOSMger71w1/parakeeto-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:38"}, {"_id": "article_0111", "title": "10年成为百万富翁，他的计划是这样的", "title_en": "To become a millionaire in 10 years, his plan goes like this", "title_jp": "10年で億万長者になる彼の計画はこうでした", "title_ar": "10 سنوات لتصبح مليونير، وهذه خطته", "summary": "10年成为百万富翁，他的计划是这样的 他的目标是10年内成为百万富翁。 原本给了自己3年时间，进展不错， 但他烧尽了。 Florin Pop。 开发者、创作者、教育家。 目前是 iCodeThis 创始人—— 一个教育娱乐平台，帮助开发者通过构建项目学习编程。 目标是财务自由——不再追逐金钱。 不是不喜欢赚钱的游戏。 只是不想需要钱。 为什么成为独立黑客？", "summary_en": "Become a millionaire in 10 years. Here's his plan. His goal is to become a millionaire in 10 years. He originally gave himself 3 years and made good progress, but he burned it out. Florin Pop。Developer, creator, educator. He is currently the founder of iCodeThis-an educational and entertainment platform that helps developers learn to code by building projects. The goal is financial freedom-no longer chasing money. It's not that you don't like money-making games. I just don't want to need money. Why become an independent hacker?", "summary_jp": "10年で億万長者になる彼の计画はこうです彼の目標は10年以内に億万長者になることです彼は3年間自分自身を与え、良い進歩を遂げたが、彼は燃え尽きた。フローリン·ポップ。開発者、クリエイター、教育者。現在は、開発者がプロジェクトを構築してプログラミングを学ぶのを支援する教育エンターテインメントプラットフォームi Code Thisの創設者です。目標は財政的自由-もはやお金を追いかけないことです。お金を稼ぐゲームが嫌い。お金が欲しくないだけです。なぜ独立ハッカーなのか？", "summary_ar": "10 سنوات لتصبح مليونير ، وكان هدفه هو أن يصبح مليونير في غضون 10 سنوات.أعطى لنفسه ثلاث سنوات ، وتقدم جيدًا ، لكنه أحرق.فلورن بوب.المطورون والمبدعون والمعلمون.وهو حاليا مؤسس iCodeThis، وهي منصة تعليمية ترفيهية تساعد المطورين على تعلم البرمجة من خلال بناء المشاريع.الهدف هو الحرية المالية - عدم مطاردة المال بعد الآن.لا يحب لعبة كسب المال.فقط لا يريدون المال.لماذا أصبح قراصنة مستقلين؟", "thumbnail": "https://images.indiehackers.com/post-images/S0ugOp2P1tjxWacN3A7V/vOqaQ3DJwYRP8MNEjUOSMger71w1/mindpal-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:38"}, {"_id": "article_0112", "title": "从病毒式副业到年收500万美金的B2B AI平台", "title_en": "From a viral sideline to a B2B AI platform that earns $5 million a year", "title_jp": "バイラルサイドから年間500万ドルのB 2 B AIプラットフォームへ", "title_ar": "من الأعمال الفرعية الفيروسية إلى منصة B2B AI التي تحقق 5 ملايين دولار سنويًا", "summary": "从病毒式副业到年收500万美金的B2B AI平台 发布时间：20250204 你有没有因为实习没转正，反而成就了更大的事业？ Yasser Elsaid就经历过。 他在Meta实习，没拿到return offer。 然后呢？ 两年后，他的Chatbase做到500万美金ARR。 服务9000+活跃订阅。 意外的病毒式传播 2023年2月，Yasser在大学最", "summary_en": "From a viral sideline to a B2B AI platform that earns US$5 million a year. Release time: 20250204 Have you ever achieved a bigger career because of an internship? Yasser Elsaid has experienced it. He interned at Meta and didn't get a return offer. Then what? Two years later, his Chatbase achieved a US$5 million ARR. Serve 9000+ active subscriptions. Unexpected viral spread In February 2023, Yasser was among the most popular students in college", "summary_jp": "バイラルサイドから年間500万ドルのB 2 B AIプラットフォームまで：2025020 4インターンシップが正規化しなかったので、より大きなキャリアを達成したことはありますか？ヤーセル·エルサイードはそれを経験した。彼はメタで働いていたが、オファーはなかった。それから何？2年後、彼のChatbaseは500万ドルのARRを達成した。9，000以上のアクティブサブスクリプション。2023年2月に誤ったウイルス拡散、ヤーサーは大学で最も多くの", "summary_ar": "من الأعمال الجانبية الفيروسية إلى منصة B2B AI التي تبلغ 5 ملايين دولار سنويًا:20250204 هل سبق لك أن حققت مهنة أكبر بسبب التدريب الداخلي بدلاً من ذلك؟كان ياسر العسيد قد عانى من ذلك.كان يتدرب في ميتا ولم ي ：做对事，比拼命做事重要100倍。 年入，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【一个做AI的朋友约我吃饭】 吃到一半，他放下筷子：\"我最近特别焦虑。产品没流量\"我说我给你讲个人吧。他叫Stephen Flanders。 01 不露面的创作者现在拥有数百万粉丝。以下是独立黑客可以从这些短视频向导中学到的内容。", "summary_en": "Stephen Flanders spent a few years proving one thing: doing the right thing is 100 times more important than doing it hard. Year entry, alone. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [A friend who works AI asked me for dinner] Halfway through the meal, he put down his chopsticks: \"I have been very anxious recently. The product has no traffic.\"I said I'll tell you about the person. His name is Stephen Flanders. 01 The invisible creator now has millions of fans. Here are what independent hackers can learn from these Short videos wizards.", "summary_jp": "クリエイターの顔のないビデオが百万人のファンを獲得したスティーブン·フランダースは、数年前から1つのことを証明してきました。年に入って、一人。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【AIの友達が夕食に誘ってくれた】半分食べた後、箸を置いて“最近、特に不安になっています。製品は流れていません”私はあなたに個人的な話をします。彼の名前はスティーブン·フランダースです0 1 No Face Creatorには何百万人ものファンがいる。独立したハッカーがこれらの短いビデオウィザードから学べることは次のとおりです。", "summary_ar": "استغرق ستيفن فلاندرز عدة سنوات لإثبات شيء واحد: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بشكل يائس.في السنة، شخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. [أحد الأصدقاء الذي يعمل في الذكاء الاصطناعي طلب مني تناول الطعام] في منتصف الأكل ، وضع الععصي: \"أنا قلق بشكل خاص في الآونة الأخيرة. \"لا يوجد منتج\" أقول لك شخصياً.اسمه ستيفن فلاندرز.المبدعين غير المظهرين 01 لديهم الآن الملايين من المتابعين.فيما يلي ما يمكن للقراصنة المستقلين تعلمه من هذه المعارضين فيديو قصيرة.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/UMvU5DKa2D6lBbsoszWn/ibTLPyjwVebnZjMGKvz6ztarnuV2/Faceless-creators-are-gaining-millions-of-followers.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:41"}, {"_id": "article_0117", "title": "自举一个流行的Git客户端到7位数ARR并被收购", "title_en": "Hosted a popular Git client to 7-digit ARR and acquired", "title_jp": "人気のGitクライアントを7桁のARRに引き上げ、買収", "title_ar": "يرفع عميل Git الشهير إلى 7 أرقام ARR ويتم الاستحواذ عليه", "summary": "自举一个流行的Git客户端到7位数ARR并被收购 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【跟一个朋友吃烤串】 他咬了一口鸡翅，突然放下：\"我最近在想一件事——我是不是选错方向了？\"我说你等等，我给你讲个故事。 01 接下来怎么办？ 他说了一句话我记到现在：", "summary_en": "Citing a popular Git client to a 7-digit ARR and being acquired today's case may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann achieved the annual income alone. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Eating kebabs with a friend] He took a bite of the chicken wings and suddenly put them down: \"I've been thinking about something recently-did I choose the wrong direction? \"I said wait, I will tell you a story. 01 What to do next? He said something that I remember to this day:", "summary_jp": "人気のあるGitクライアントを7桁のARRに引き上げ、今日のケースでは、起業家精神に対する理解が変わるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人でやってきました。5分後、あなたのギャップは能力ではなく、認知であることがわかります。彼は手羽先を噛んで、突然それを置いた：“私は最近何かを考えていた-私は間違った方向を選んだか？“ちょっと待って、話をしましょう。0 1次は何？彼は今でも覚えていることを言った。", "summary_ar": "إن استحداث أحد عملاء Git الشعبية إلى 7 أرقام ARR وتم الاستحواذ عليها في هذه الحالة التي يتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (أكل كوب شوي مع صديق) قضم أجنحة الدجاج وأسقطها فجأة: \"كنت أفكر في شيء واحد في الآونة الأخيرة - هل أخذت الاتجاه الخاطئ؟\" \"أقول لك انتظر، سأخبرك قصة\". 01 ماذا تفعل بعد؟قال له كلمة أتذكرها حتى الآن:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/UULRo7cgvUFDtMhf9XXw/vOqaQ3DJwYRP8MNEjUOSMger71w1/tobias-gunther-founder-of-tower.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:43"}, {"_id": "article_0118", "title": "用\"牛肉营销\"做到年入200万美元：6年从15美元/时起的逆袭", "title_en": "Using \"beef marketing\" to achieve annual income of US$2 million: a 6-year counterattack from US$15/hour", "title_jp": "“牛肉マーケティング”で年間200万ドルを稼ぐ：6年間で15ドルからの反撃", "title_ar": "الحصول على 2 مليون دولار سنويا من \"تسويق لحوم البقر\": 6 سنوات من 15 دولار في الساعة", "summary": "用\"牛肉营销\"做到年入200万美元：6年从15美元/时起的逆袭 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入100万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【早高峰地铁上】 刷手机看到一个帖子：\"做AI几个月了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 我曾经做过的几乎所有工作都被解雇了。关于倾听人们的意见，我不确定。我一无所有地搬到了洛杉矶，开始在电影制片厂工作，然后才进入初创公司。30 岁生日那天，我每小时挣 15 美元，负债六位数。 现在，我已经 36 岁了，没有任何债务，在日落大道上有一间办公室，一家白手起家的价值 7 位数的科技公司，还有一栋山上的房子。我一直在 YouTube 上分享过去 2.5 年的历程，我从无到有创建了三家价值六位数的无代码科技公司和一家价值七位数的科技公司。", "summary_en": "Use \"beef marketing\" to achieve annual income of US$2 million: a 6-year counterattack from US$15 per hour This case I will talk about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of US$1 million. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing AI for several months, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 Almost every job I had ever done was fired. I'm not sure about listening to people. I moved to Los Angeles with nothing and started working in a movie studio before entering a startup. On my 30th birthday, I made $15 an hour and had six-figure debt. Now, I am 36 years old, without any debt, with an office on Sunset Boulevard, a self-made seven-figure technology company, and a house on a hill. I've been sharing on YouTube the past 2.5 years, where I've created three six-figure codeness technology companies and one seven-figure technology company from scratch.", "summary_jp": "“牛肉マーケティング”で年間200万ドルを稼ぐ：6年間で15ドルからの反撃今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間100万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。[朝のピーク地下鉄]ブラシ携帯電話の投稿を見て：“AIを数ヶ月間行って、月収はまだホバリングしている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください私が今までやってきた仕事のほとんどはクビになった。人の話を聞くと、自信がない。何もなくロサンゼルスに引っ越し、スタートアップに入る前に映画スタジオで働き始めました。30歳の誕生日には時給15ドルを稼ぎ6桁の借金をしていました今、私は36歳で、借金もなく、サンセット·ブールバードにオフィスを構え、自作の7桁のテクノロジー企業を経営し、丘の上に家を構えています。私はYouTubeで過去2.5 年の道のりを共有してきました。ゼロから6桁のコードなしテクノロジー企業3社と7桁のテクノロジー企業1社を立ち上げました。", "summary_ar": "الحصول على 2 مليون دولار سنويا من \"تسويق لحوم البقر\": 6 سنوات من 15 دولار في الساعة الهجوم العكسي هذه الحالة اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على مليون دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"الاصطناعية لعدة أشهر، الدخل الشهري لا يزال يتجول، هل يجب أن تستسلم؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان.لقد تم فصل كل الوظائف التي قمت بها تقريبًا.أنا لست متأكدًا من الاستماع إلى الناس.انتقلت إلى لوس أنجلوس بدون أي شيء وبدأت العمل في استوديو سينمائي قبل دخول الشركات الناشئة.في عيد ميلادي الثلاثين، كنت أتقاضى 15 دولارا في الساعة، وكان لديون من ستة أرقام.الآن، أنا في السادسة والثلاثين من عمري، وليس لدي أي ديون، ولدي مكتب في شارع غروب الشمس، وشركة تكنولوجيا من الصدر بقيمة سبعة أرقام، ومنزل على جبل.لقد كنت أشارك على موقع يوتيوب على مدى السنوات والنصف الماضية ، حيث أنشأت ثلاث شركات تكنولوجيا بلا رمز بقيمة ستة أرقام وشركة تكنولوجيا بقيمة سبعة أرقام من الصفر.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/Un2aoGNziO7kWbCkT5wb/vOqaQ3DJwYRP8MNEjUOSMger71w1/jeremy-redmand-founder-of-taskmagic.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:19:45"}, {"_id": "article_0119", "title": "边环球旅行边自举三个SaaS月入7500+美元", "title_en": "Traveling around the world while launching three SaaS projects with monthly income of US$7500 +", "title_jp": "世界中を旅しながら3つのSaaSを月額7，500ドル以上に引き上げる", "title_ar": "تجني أكثر من 7500 دولار في الشهر أثناء السفر حول العالم أثناء 3 SaaS", "summary": "边环球旅行边自举三个SaaS月入7500+美元 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——Katie Hignett一个人做到了年入7千美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 .jpg) 【在咖啡馆写东西】 对面坐了个年轻人，一直在叹气。我问他怎么了。他说做了几个月AI产品，没什么起色。我说那你知道Katie Hignett吗？ 01 海上18个月", "summary_en": "While traveling around the world, citing three SaaS monthly income of US$7500 +. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-Katie Hignett made an annual income of US$7,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. .jpg)[Writing in a cafe] There was a young man sitting opposite him, sighing all the time. I asked him what was wrong. He said that he had been making AI products for several months and had no improvement. I said, do you know Katie Hignett? 01 18 months at sea", "summary_jp": "世界中を旅しながら3つのSaaS月額7，500ドル以上を稼ぐ今日のケースは、起業家精神に対する理解を変えるかもしれません。資金調達もチームもバックグラウンドもなくケイティ·ヒネットは一人で年間7，000ドルを稼いだのです5分後、あなたのギャップは能力ではなく、認知であることがわかります。.jpg【カフェで物を書く】向こうに若い男が座ってため息をついていた。どうしたのか尋ねた。彼は数ヶ月間AI製品を作ったが、何も起こらなかった。ケイティ·ヒネットをご存知ですか？海で18 ヶ月", "summary_ar": "تجني أكثر من 7500 دولار شهرياً في خدمة الخدمات الإدارية الثلاثة أثناء السفر حول العالم قد تغير هذه الحالة اليوم فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - كاتي هيغنيت وحدها حصلت على سبعة آلاف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك.كان هناك شاب يجلس في المقهى، وكان ينهد.سألته عما حدث.وقال إنه عمل على منتجات الذكاء الاصطناعي لعدة أشهر ولم يتحسن شيء.هل تعرف كاتي هينيت؟18 شهراً في البحر", "thumbnail": "https://images.indiehackers.com/post-images/UK9omiPofFtha5Kps2Fj/vOqaQ3DJwYRP8MNEjUOSMger71w1/aragon-homepage.png?w=1400?w=1400 。“私は本当に行き詰まっていると感じます。ケイティ·ヒネットをご存知ですか？頭を振った。インターネット上で物を作るのが好きです。約15 年前、オープンソースのフォーラムソフトウェアInvision Power Boardのプラグインを販売したとき、私はオンラインで最初の1ドルを稼ぎました。私は大学を中退し、Word Pressのコンサルティングサービスを提供するオンラインビジネスを始めた。最終的に閉鎖する前に、", "summary_ar": "X منصة الفيروسات الانتشار مساعدة المطورين المستقلين AI APP دخل 15،000 شهريا القيام بنفس المنتجات، لماذا لا يمكن لأي شخص أن يكسب المال، يمكن لأي شخص أن يحصل على 20،000 دولار سنويا؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\".كان يجلس بجانبه صديق يعمل في شركة AI.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل كاتي هينييت؟وهو يهز رأسه. 01 أنا أحب بناء الأشياء على الإنترنت.قبل حوالي 15 عامًا ، كسبت أول دولار على الإنترنت عندما كنت أبيع المكونات الإضافية لبرنامج المنتدى مفتوح المصدر Invision Power Board.انسحبت من الجامعة وبدأت عملا على الإنترنت لتقديم خدمات استشارية WordPress.قبل أن أغلقها أخيراً،", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZBbFBKrpwqZQkQsy7Bcs/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Daniel", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:09"}, {"_id": "article_0129", "title": "4个月50万美元ARR", "title_en": "4 months $500,000 ARR", "title_jp": "4 ヶ月で50万ドルARR", "title_ar": "000 500 دولار من دولارات الولايات المتحدة لفترة 4 أشهر", "summary": "4个月50万美元ARR James Fleischmann用几年时间证明了一件事：做对事，比拼命做事重要100倍。 年入50万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 接下来怎么办？", "summary_en": "ARR James Fleischmann spent a few years proving one thing: Doing the right thing is 100 times more important than doing it hard. Annual income of US$500,000, one person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 What should we do next?", "summary_jp": "4 ヶ月50万ドルARRジェームズ·フライシュマンは数年の間に1つのことを証明しました正しいことをすることは必死になるよりも100倍重要です年間50万ドルで、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。0 1次は？", "summary_ar": "أربعة أشهر $500,000 ARR جيمس فليشمان أمضى عدة سنوات لإثبات شيء: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بشكل يائس. 500 ألف دولار سنوياً، لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\" 01 ماذا بعد؟", "thumbnail": "https://images.indiehackers.com/team-images/Yatharth-Sejpal_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:12"}, {"_id": "article_0130", "title": "两年内被收购两次", "title_en": "Acquired twice in two years", "title_jp": "2年間で2回購入。", "title_ar": "تم شراؤها مرتين في غضون عامين", "summary": "两年内被收购两次 同样自己干，为什么有人月入两千就卡死了，有人能做到年入5千美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 接下来怎么办？ 你以为这就完了？", "summary_en": "I was acquired twice in two years and I did it myself. Why is it that some people get stuck making 2,000 a month, and some people can make 5,000 US dollars a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 What should we do next? You think it's over?", "summary_jp": "2年以内に2回購入された同じ仕事、なぜ誰かが2000人の月にカードが死ぬ、誰かが5000ドルの年間入力を行うことができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。0 1次は？これで終わりだと思いますか？", "summary_ar": "لماذا يتم الحصول على نفس العمل مرتين في غضون عامين ، لماذا يتمكن شخص ما من الحصول على ألفي دولار في الشهر ، ويموت شخص ما من الحصول على خمسة آلاف دولار في السنة؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\" 01 ماذا بعد؟هل تعتقدين أن هذا قد انتهى؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZfcJE0vW4J2WMed070Ac/PWairgiOpneHvkGJri7RVbtORKI2/Alex_Heiden_founder.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:14"}, {"_id": "article_0131", "title": "关两退一，加入5位数月收入业务做联创", "title_en": "Two close and one back, join the five-digit monthly income business to do joint venture", "title_jp": "2つのリターン、5桁の月額収益事業に参加", "title_ar": "إغلاق اثنين من الانسحاب، والانضمام إلى 5 أرقام الدخل الشهري للعمل المشترك.", "summary": "关两退一，加入5位数月收入业务做联创 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入10万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【早高峰地铁上】 刷手机看到一个帖子：\"做独立开发一年多了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 您对刚刚起步的独立黑客有何建议？接下来怎么办？", "summary_en": "In less than two years, James Fleischmann, the co-founder of the five-figure monthly revenue business, proved one thing: doing the right thing is 100 times more important than doing it hard. Annual income is 100,000 US dollars, one person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing independent development for more than a year, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 What advice do you have for starting independent hackers? What should we do next?", "summary_jp": "ジェームズ·フライシュマンは、5桁の月額収益ビジネスの共同創業者として2年足らずで1つのことを証明しました。正しいことをすることは、一生懸命働くよりも100倍重要です。年間10万ドルで、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。[朝のピーク地下鉄]ブラシ携帯電話の投稿を見て：“独立した開発を1年以上行って、月収はまだ残っている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください始めたばかりのインディーハッカーにアドバイスはありますか？次は？", "summary_ar": "استغرق جيمس فليشمان أقل من عامين لإثبات شيء واحد: أن القيام بالأشياء الصحيحة أكثر أهمية بـ 100 مرة من القيام بها بشكل يائس. 100 ألف دولار في السنة، لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"القيام بالتطوير المستقل لأكثر من عام، الدخل الشهري لا يزال يتجول، هل يجب التخلي عن؟\"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان. 01 ما هي النصائح التي تقدمها للقراصنة المستقلين الذين يبدأون للتو؟ماذا بعد ذلك؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZoTjtZZse2MDykAo2R2n/vOqaQ3DJwYRP8MNEjUOSMger71w1/igor-debatur-founder-of-uploadcare.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:15"}, {"_id": "article_0132", "title": "26岁放下一切追求更好生活，17年后月入2.9万", "title_en": "At the age of 26, he gave up everything in pursuit of a better life, and earned 29,000 yuan a month after 17 years", "title_jp": "26歳はより良い生活を追求するためにすべてを手放し、17年後に月に29，000に入る", "title_ar": "في سن 26 عامًا ، تخلى عن كل شيء من أجل حياة أفضل بعد 17 عامًا ، دخل 29 ألف دولار شهريًا", "summary": "26岁放下一切追求更好生活，17年后月入2.9万 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入1千美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了几个月产品，还没看到什么希望。 01 43 岁的 Sorin Alupoaie 抛下一切与妻子从罗马尼亚搬到了都柏林。经过一段不确定的时期后，他提高了收入，然后辞去了工作，专注于自己的业务 Swifteq。现在，他的年收入为 26,000 欧元。 我们", "summary_en": "At the age of 26, he put everything aside in pursuit of a better life. 17 years later, he earns 29,000 yuan a month. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made $1,000 a year by himself. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for several months and I haven't seen any hope yet. 01 Sorin Alupoaie, 43, left everything behind and moved to Dublin from Romania with his wife. After an uncertain period, he raised his income and then quit his job to focus on his business Swifteq. Now, his annual income is 26,000 euros. we", "summary_jp": "26歳はより良い生活を追求するためにすべてを手放し、17年後に29，000今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間1，000ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。製品を作って数ヶ月経っても、まだ希望が見えません。43歳のソリン·アルポアイは、ルーマニアから妻と共にダブリンに移住した。不確実性の期間の後、彼は収入を増やし、彼のビジネスSwifteqに集中するために仕事を辞めました。現在の年収は26，000ユーロ。私たちは", "summary_ar": "التخلي عن كل شيء في سن 26 من أجل حياة أفضل، ودخل 29 ألف دولار في الشهر بعد 17 عامًا، هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.هذا هو السبب في أنه منذ عدة أشهر ، لم يرى أي أمل.ترك سورين ألوبواي البالغ من العمر 43 عامًا كل شيء وانتقل مع زوجته من رومانيا إلى دبلن.بعد فترة من عدم اليقين ، قام بزيادة دخله ، ثم استقال من وظيفته للتركيز على عمله الخاص ، Swifteq.ويبلغ دخله السنوي الآن 26 ألف يورو.ونحن", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZrtbDtpv5F9uR55AFLID/vOqaQ3DJwYRP8MNEjUOSMger71w1/sorin-alupoaie-founder-of-swifteq.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:16"}, {"_id": "article_0133", "title": "160万美元ARR平台期但拒绝VC", "title_en": "US$1.6 million ARR platform period but rejected VC", "title_jp": "$1.6 M ARRプラットフォーム、VCを拒否", "title_ar": "1.6 مليون دولار من دولارات الولايات المتحدة ARR منصة الفترة ولكن رفض VC", "summary": "160万美元ARR平台期但拒绝VC 同样搞技术，为什么有人累死累活赚不到钱，有人能做到年入100万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【上次在一个创业小聚上】 旁边坐了个做SaaS的哥们儿。聊了半小时，他突然说：\"我真的觉得我卡住了。\"我说你听过James Fleischmann吗？他摇头。 01 接下来怎么办？ 他做对了一件事：", "summary_en": "The US$1.6 million ARR platform period but refused to engage in technology as well. Why do some people work hard and can't make money, and some people can earn US$1 million a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Last time at a small entrepreneurial gathering] sat next to a buddy who did SaaS. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said have you heard of James Fleischmann? He shook his head. 01 What to do next? He did one thing right:", "summary_jp": "160万ドルARRプラットフォームの期間が、VCも技術に従事することを拒否し、なぜ誰かがお金を稼ぐために懸命に働いて、誰かが年間100万ドルを稼ぐことができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【前回、起業家の集まりで】隣にSaaSをやっている仲間が座っていた。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。“ジェームズ·フライシュマンをご存知ですか？頭を振った。0 1次は何？彼は一つ正しいことをしました", "summary_ar": "1.6 مليون دولار ARR منصة فترة ولكن رفض VC نفس التكنولوجيا، لماذا لا يمكن لأي شخص أن يكسب المال، يمكن لأي شخص أن يحصل على مليون دولار سنويا؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\".كان هناك صديق يجلس بجانبه يعمل في ساوس.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل جيمس فليشمان؟وهو يهز رأسه. 01 ماذا تفعل بعد؟لقد فعل شيئًا واحدًا بشكل صحيح:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/a00nu8BecGGRVXNdbT4j/vOqaQ3DJwYRP8MNEjUOSMger71w1/christopher-gimmer-founder-of-snappa.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0134", "title": "他先攒了12万月活，才想起来收钱", "title_en": "He saved 120,000 months of work before he remembered to collect money", "title_jp": "彼はお金を稼ぐ前に12万ヶ月を貯めた。", "title_ar": "كان يدخر 120 ألف دولار في الشهر قبل أن يتذكر أن يحصل على المال.", "summary": "他先攒了12万月活，才想起来收钱 从0到月入21万，这个英国人的操作反着来 大多数人怎么死的？ 先憋个产品，再想办法卖。Andrew Fennell不一样。他先让网站月流量冲到12万，才慢悠悠上线第一款产品。 结果呢？ 月收入3万英镑。约合人民币27万。 一、 Andrew以前是干猎头的。 每天西装革履，跟人精打交道。但他讨厌这行。骨子里，他想自己干点什么。 他", "summary_en": "He first saved 120,000 months of work before remembering to collect money from 0 to 210,000 a month. This British operation reversed how did most people die? Hold a product first and think of a way to sell it. Andrew Fennell is different. He first made the website's monthly traffic increase to 120,000 before slowly launching the first product. What happened? Monthly income is 30,000 pounds. It is approximately RMB 270,000. 1. Andrew used to be a headhunter. Wear suits and shoes every day and deal with talents. But he hated it. Deep down, he wanted to do something by himself. he", "summary_jp": "彼は最初に120，000 ヶ月の生活を保存し、0から210，000月にお金を集めることを考えた、この英国の操作は、ほとんどの人が死ぬ方法に反対ですか？最初に製品を作り、販売する方法を見つける。アンドリュー·フェネルは違う。彼は最初の製品をゆっくりとオンラインにする前に、ウェブサイトの月間トラフィックを12万に急いだ。結果は？月収3万円。約27万円です。アンドリューは以前ハンターだった。毎日服を着て、人と接する。しかし彼はこの仕事を嫌った。しかし、彼は自分で何かをしたかった。彼は", "summary_ar": "كان يدخر 120 ألف دولار شهرياً قبل أن يفكر في جمع المال من صفر إلى 210 ألف دولار شهرياً، وكان هذا الإنجليزي يعمل على العكس من ذلك.احصل على المنتج أولاً ثم ابحث عن طريقة للبيع.أندرو فينيل هو مختلف.لقد ترك حركة المرور الشهرية على الموقع تصل إلى 120،000 ، قبل أن يطلق المنتج الأول ببطء.ماذا عن النتيجة؟الدخل الشهري 000 30 جنيه استرليني.حوالي 270 ألف يوان.كان أندرو صيادًا للرؤوس الجافة.ارتداء الملابس كل يوم، والتعامل مع الناس.لكنه يكره هذا العمل.في العظام، يريد أن يفعل شيئا بنفسه.ويتمثل في:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/YwNbJD5AIuYe3ECMomkv/vOqaQ3DJwYRP8MNEjUOSMger71w1/arian-adeli-founder-of-evernomic-.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0135", "title": "一个周末做的破烂玩意儿，现在月入14万", "title_en": "The junk I made over the weekend now earns 140,000 yuan a month", "title_jp": "週末に作ったゴミは、今月14万ドルになります。", "title_ar": "عمل في عطلة نهاية الأسبوع، والآن 140،000 في الشهر", "summary": "一个周末做的破烂玩意儿，现在月入14万 德国程序员：我本想随便试试，没想到玩大了 你见过最草率的创业是什么样的？ Lukas Hermann告诉你：周末两天，一个破计时器，上线的时候连收费功能都没有。 现在？ 月入2万美元。约合人民币14万。 一、 故事开始于一次串门。 Lukas去朋友的工作室玩。朋友是个视频制作人，正在忙活一场直播。 突然，朋友从椅子上弹起来", "summary_en": "A piece of junk made over a weekend now earns 140,000 German programmers a month: I wanted to give it a try, but I didn't expect it to be the most sloppy venture you've ever seen? Lukas Hermann tells you: Two days on the weekend, a broken timer didn't even have a charging function when it went online. Now? Monthly income is US$20,000. About 140,000 yuan. 1. The story begins with a visit. Lukas went to a friend's studio to play. My friend is a video producer and is busy with a live broadcast. Suddenly, my friend bounced out of his chair", "summary_jp": "週末のジャンク、今では月14万人のドイツのプログラマー：私はカジュアルに試してみたいと思った、あなたが見た最もずさんなスタートアップは何ですか？ルーカス·ヘルマンは言います：週末の2日間、壊れたタイマー、オンラインでは充電機能さえありません。今のところ？月額2万ドル。約14万元です。しかし、物語はドアから始まります。ルーカスは友人のスタジオに行った。私の友人はビデオプロデューサーで、ライブ放送で忙しいです。突然、友人が椅子から飛び出した。", "summary_ar": "مبرمج ألماني يكسب الآن 140 ألف دولار شهرياً: كنت أريد أن أجربه، ولكن لم أتوقع أن أكون أكبر ما هي أكثر الشركات المستهدفة التي رأيتها في حياتك؟يقول لوكاس هيرمان: يومين في عطلة نهاية الأسبوع ، ومؤقت كسر ، دون وظيفة رسوم حتى عندما تكون على الإنترنت.الآن؟20 ألف دولار في الشهر.ما يقرب من 140 ألف يوان.القصة تبدأ من زيارة واحدة.يذهب لوكاس إلى استوديو صديقه للعب.صديق هو منتج فيديو وهو مشغول بث مباشر.فجأة، قفز صديق من الكرسي.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZBbFBKrpwqZQkQsy7Bcs/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Daniel Nguyen founder BoltAI PDFPal KTools.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0136", "title": "一个人做软件评测站，月入五位数", "title_en": "Working as a software evaluation station alone, earning five digits a month", "title_jp": "ソフトウェア評価ステーションを1人で行い、月に5桁を入力します。", "title_ar": "شخص واحد يعمل محطة تقييم البرمجيات، ويحصل على خمسة أرقام في الشهر", "summary": "一个人做软件评测站，月入五位数 他 accidentally 上了Product Hunt，结果拿了当日第一 你有没有 accidentally 做成过什么事？ Francesco D'Alessio accidentally 把产品发布了。 他本来只是想预约一下Product Hunt的发布日期，结果忘了这回事。等他想起来的时候，产品已经上线了。 更离谱的是—— 当日", "summary_en": "A person working as a software evaluation station alone, and his monthly income was five digits. He accidentally went to Product Hunt. As a result, he won the first place that day. Have you accidentally done anything? Francesco D'Alessio accidentally released the product. He just wanted to make an appointment for the release date of Product Hunt, but he forgot about it. By the time he remembered, the product was already online. What's even more outrageous is-that day", "summary_jp": "ある人がソフトウェアレビューステーションを行い、毎月5桁の数字を入力し、プロダクトハントに偶然行った結果、その日の最初の1つを取ったあなたは偶然に何をしたか？Francesco DAlioがidentallyを発表した。彼はプロダクトハントの発売日を予約しようとしていたが、それを忘れてしまった。彼が考える頃には、製品はオンラインになっていました。さらに悪いことに、その日。", "summary_ar": "شخص يقوم بمحطة تقييم البرمجيات ، ويكسب خمسة أرقام شهرياً ، ووصلت عن طريق الخطأ إلى Product Hunt ، ونتجت أنه حصل على المرتبة الأولى في اليوم ، هل فعلت شيئًا عن طريق الخطأ؟قام Francesco D'Alessio بإصدار المنتج عن طريق الخطأ.كان يريد فقط حجز موعد إصدار Product Hunt ، ونسى ذلك.عندما يتذكر ، كان المنتج موجودًا بالفعل.والأمر الأكثر إثارة للقلق هو أن ذلك اليوم", "thumbnail": "https://images.indiehackers.com/team-images/Yatharth-Sejpal_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0137", "title": "他一个人，做了个免费的Photoshop，年入2100万", "title_en": "He made a free Photoshop alone and earned 21 million yuan a year", "title_jp": "彼は一人で無料のPhotoshopを作り、年間2100万ドルを稼いだ。", "title_ar": "قام بمفرده بتصنيع Photoshop مجاناً ويكسب 21 مليون دولار سنوياً", "summary": "他一个人，做了个免费的Photoshop，年入2100万 年成本只要4000块，这TM是什么神仙生意 你知道最狠的商业模式是什么吗？ 不是收会员费。不是卖课程。是—— 完全免费，但广告收入年入300万美元。 Ivan Kutskir做到了。他一个人，花了13年，做了一个网页版Photoshop。 叫Photopea。每天100万人用。 年成本多少？ 域名20美元", "summary_en": "He made a free Photoshop alone, with an annual income of 21 million yuan and an annual cost of only 4000 yuan. What kind of fairy business is this? Do you know what the most ruthless business model is? Not a membership fee. Not selling courses. Yes-completely free, but advertising revenue earns $3 million a year. Ivan Kutskir did it. He spent 13 years alone making a web version of Photoshop. It's called Photopea. 1 million people use it every day. What is the annual cost? Domain name is US$20", "summary_jp": "彼は一人で無料のPhotoshopを作りました年間2100万ドルで年間4000ドルの費用がかかりました最も残酷なビジネスモデルは何か知っていますか？会員料金なし。コースを売らない。はい- 完全に無料ですが、広告収入は年間300万ドルです。イワン·クツキルがやりました彼は13年かけてウェブ版のPhotoshopを作りましたPhotopeaと呼ばれる。毎日100万人が利用します年間費用はいくら？ドメイン名$20", "summary_ar": "هو وحده، قام بتصنيع Photoshop مجاني، ويكلف 21 مليون دولار سنويا فقط 4000 دولار سنويا، وهذا هو الأعمال التجارية الخيالية، هل تعلم ما هو أسوأ نموذج تجاري؟وليس رسوم العضوية.لا تبيع الدوراتنعم - مجاني تمامًا ، ولكن الإعلانات تجني 3 ملايين دولار سنويًا.إيفان كوتسكير فعل ذلك.أمضى بمفرده 13 عامًا في إنشاء نسخة من Photoshop على الإنترنت.تسمى Photopea.مليون شخص يومياً.ما هي التكلفة السنوية؟اسم النطاق 20 دولار", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZfcJE0vW4J2WMed070Ac/PWairgiOpneHvkGJri7RVbtORKI2/Alex_Heiden_founder.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0138", "title": "核电工程师转行做金融AI，年入七位数", "title_en": "Nuclear power engineers switch to financial AI, earning seven-digit annual income", "title_jp": "原子力技術者が金融AIに転職、年間7桁に", "title_ar": "مهندس الطاقة النووية يتحول إلى الذكاء الاصطناعي المالي ، سبعة أرقام في السنة", "summary": "核电工程师转行做金融AI，年入七位数 他说：市场上要么太贵，要么太烂，中间空荡荡 你知道最离谱的职业转型是什么？ 从核电站，跳到金融科技。 Braden Dennis就是这么干的。他以前是搞核能和水电的工程师。现在，他是Fiscal.ai的创始人，年入七位数，正向八位数冲刺。 一、 Braden有个理想。 他想发明点对地球有益的新技术。这个理想，他到现在还没放弃。", "summary_en": "A nuclear power engineer turned to financial AI with a seven-digit annual income. He said: The market is either too expensive or too bad, and the middle is empty. You know what the most outrageous career transformation is? From nuclear power plants, jump to financial technology. Braden Dennis did just that. He used to be an engineer working in nuclear power and hydropower. Now, he is the founder of Fiscal.ai, earning seven figures a year and is sprinting towards eight figures. 1. Braden has an ideal. He wanted to invent some new technology that would be beneficial to the earth. He has not given up on this ideal yet.", "summary_jp": "原子力エンジニアは金融AIに転向し、年間7桁に達したと彼は言いました：市場は高価すぎるか、悪すぎる、真ん中は空です。原子力発電所から金融技術へ。それがBraden Dennisのやり方です。彼は原子力と水力発電のエンジニアでした。今、彼はFiscal.aiの創設者であり、年間7桁を達成し、8桁に向かっています。ブラッドには理想がある。彼は地球に役立つ新しい技術を発明したい。この理想は、彼はまだあきらめていません。", "summary_ar": "ومهندس الطاقة النووية تحول مهنته إلى الذكاء الاصطناعي في مجال التمويل، ويكسب سبعة أرقام في السنة، وقال: \"السوق إما مكلفة جدا، أو فاسدة جدا، وفارغة في وسط، هل تعلم ما هو أكثر تحولات وظيفية شنيعة؟\"من محطات الطاقة النووية إلى التكنولوجيا المالية.هذا هو ما فعله برادين دينيس.وكان مهندسًا في الطاقة النووية والكهرباء المائية.وهو الآن مؤسس Fiscal.ai، وهو يتحرك نحو ثمانية أرقام في السنة.أولاً، كان لدى برادين مثالية.كان يريد أن يخترع تكنولوجيات جديدة مفيدة لكوكب الأرض.وهذا المثل الأعلى لم يتخلى عنه حتى الآن.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZoTjtZZse2MDykAo2R2n/vOqaQ3DJwYRP8MNEjUOSMger71w1/igor-debatur-founder-of-uploadcare.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0139", "title": "两年内从零到百万ARR，这个笔记工具有什么魔力", "title_en": "From zero to one million ARRs in two years, what magic does this note taking tool have?", "title_jp": "2年でゼロから100万ARRに、このノートツールの魔法は何ですか？", "title_ar": "من الصفر إلى المليون ARR في عامين ، ما هو سحر هذه الأداة المحمولة", "summary": "两年内从零到百万ARR，这个笔记工具有什么魔力 他辍学了两次，只为做出一个让自己爽的产品 辍学一次叫叛逆。辍学两次叫......执着？ 詹雨安（YuAn Chan）就是这么个人。 台湾大学物理数学系，读了一年，退学了。说是要探索更广泛的兴趣。 然后去了美国Minerva大学计算机系，又读了一年，又退学了。 这次是为了专心做一个产品——Heptabase。 一个视觉笔记工", "summary_en": "From zero to one million ARRs in two years, what magic does this note-taking tool have? He dropped out of school twice, just to make a product that made him feel good. It was called rebellion. Dropping out of school twice is called... Persistence? Yuan Chan is such a person. Department of Physics and Mathematics at Taiwan University, after one year, dropped out. It is said to explore broader interests. Then he went to the Computer Science Department of Minerva University in the United States, studied for another year, and dropped out of school. This time I want to concentrate on making a product-Heptabase. A visual notebook", "summary_jp": "2年間でゼロから100万ARRに成長し、彼は2度中退し、反抗と呼ばれる自分を喜ばせる製品を作るために1度だけ中退した。退学二次叫...。執着する？チャン·ユアン（Yuan Chan）はそのような人です。台湾大学物理数学科、1年間勉強し、退学。より広い関心を探求することです。その後、ミネルバ大学のコンピュータ学科に進学し、1年間勉強したが、再び中退した。今回は、1つの製品、Heptabaseに焦点を当てました。視覚的なメモ帳。", "summary_ar": "في غضون عامين من الصفر إلى المليون ARR ، ما السحر لهذه الأداة المحمولة هو أنه ترك المدرسة مرتين ، فقط لجعل منتج يجعله ممتعًا ترك المدرسة مرة واحدة يسمى التمرد.انقطعت عن المدرسة مرتين..الإصرار؟كان يوان تشان (Yu An Chan) مثل هذا الشخص.في قسم الرياضيات والفيزياء بجامعة تايوان، درس لمدة عام، وانسحب.ويقول إن هذا يعني استكشاف مصالح أوسع نطاقا.ثم انتقل إلى قسم الكمبيوتر في جامعة مينيرفا في الولايات المتحدة الأمريكية، ودرس لمدة عام آخر، ثم انسحب من الدراسة.هذه المرة للتركيز على منتج واحد - Heptabase.كاتب ملاحظات بصري", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/ZrtbDtpv5F9uR55AFLID/vOqaQ3DJwYRP8MNEjUOSMger71w1/sorin-alupoaie-founder-of-swifteq.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0140", "title": "卖掉年入百万的公司后，他陷入了\"创业者诅咒\"", "title_en": "After selling the million-dollar company, he fell into the \"Entrepreneur's Curse\"", "title_jp": "100万ドルの会社を売却した後、彼は“起業家の呪い”に陥った。", "title_ar": "بعد أن بيعت شركته التي تصل إلى مليون دولار سنوياً، وقع في \"لعنة المبدعين\".", "summary": "卖掉年入百万的公司后，他陷入了\"创业者诅咒\" 第一次成功了，第二次却怎么也找不到产品市场契合 很多人以为，成功过一次的人，第二次会更容易。 Valentin Pichard告诉你：想多了。 他大学刚毕业就做了个大数据公司，年入百万美元，最后卖了。然后呢？ 第二次创业，到现在还在苦苦寻找产品市场契合（PMF）。 一、 2015年，Valentin还是学生。 在法国创", "summary_en": "After selling a million-year company, he fell into the \"Entrepreneur's Curse\". He succeeded the first time, but couldn't find a product that matched the market the second time. Many people thought that people who had succeeded once would be easier the second time. Valentin Pichard tells you: I think too much. He started a big data company right out of college, making millions of dollars a year and finally selling it. Then what? The second venture, still struggling to find product market fit (PMF). 1. In 2015, Valentin was still a student. Created in France", "summary_jp": "100万人の会社を売却した後、彼は“起業家の呪い”に陥った最初の成功は、2回目がどのように製品市場に適合することができなかった多くの人々は、一度成功した人々は、2回目が簡単になると思った。ヴァレンティン·ピシャールはもっと考えてほしいと言います彼は大学を卒業してすぐにビッグデータ会社を立ち上げ、年間100万ドルを稼ぎ、最終的に売却しました。それから何？2度目のスタートアップは、今でもプロダクト·マーケット·フィット（PMF）を見つけるのに苦労している。2015年、ヴァレンティンはまだ学生でした。フランスで創作。", "summary_ar": "بعد بيع شركة المليون سنويا، وقع في \"لعنة رائد الأعمال\" نجح في المرة الأولى، ولكن في المرة الثانية كيف لا يمكن العثور على المنتجات التي تناسب السوق كثير من الناس يعتقدون أن الناس الذين نجحوا مرة واحدة، والمرة الثانية سيكون أسهل.فالنتين بيشارد يقول لك: التفكير أكثر.بعد تخرجه من الجامعة ، بدأ شركة بيانات ضخمة ، وربح مليون دولار سنويًا ، وبيعها في النهاية.ماذا بعد ذلك؟البداية الثانية ، حتى الآن لا تزال تكافح في البحث عن سوق المنتجات (PMF).في عام 2015 ، كان فالنتين طالبًا.في فرنسا صدمة", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/a00nu8BecGGRVXNdbT4j/vOqaQ3DJwYRP8MNEjUOSMger71w1/christopher-gimmer-founder-of-snappa.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0141", "title": "他做了个人脸识别工具，专打Deepfake，年入七位数", "title_en": "He made a Face Recognition tool that specializes in Deepfake, with an annual income of seven digits", "title_jp": "彼は顔認識ツールDeepfakeを開発し、年間7桁の数字を達成しました。", "title_ar": "صنع أداة للتعرف على الوجوه الشخصية، والتي تستهدف Deepfake، وتحصل على سبعة أرقام في السنة", "summary": "他做了个人脸识别工具，专打Deepfake，年入七位数 灵感来自同事妈妈的亲身经历 你知道Deepfake有多可怕吗？ 一张你的照片，就能生成以假乱真的视频。 有人用它诈骗，有人用它造假，有人用它... Daniyal Chughtai看不下去了。他做了Facia，一个专门检测Deepfake和身份欺诈的AI工具。 现在服务1000万+终端用户，年营收250350万美元。", "summary_en": "He made a Face Recognition tool specifically for Deepfake. The seven-digit annual entry comes from the personal experience of his colleagues 'mothers. Do you know how scary Deepfake is? A photo of you can generate a real video. Some people use it to swindle, some use it to fake, some use it... Daniyal Chughtai couldn't stand it anymore. He built Facea, an AI tool that specializes in detecting Deepfake and identity fraud. It now serves 10 million + end users, with annual revenue of US$2.5035 million.", "summary_jp": "彼は顔認識ツールを作りましたディープフェイクをプレイしました同僚の母親の経験からインスピレーションを得て7桁の数字を得ましたディープフェイクがどれほど恐ろしいか知っていますか？あなたの写真は、偽のビデオを生成できます。ある人はそれを使い、ある人はそれを使い、ある人はそれを使い、ある人はそれを使う。ダニール·チュタイはそれを見なかった。彼はディープフェイクやアイデンティティ詐欺の検出に特化したAIツールFaciaを作りました現在、1，000万人以上のエンドユーザーにサービスを提供し、年間売上高は25億350万ドルです。", "summary_ar": "لقد صنع أداة للتعرف على الوجه الشخصي، وهو Deepfake، وهو سبعة أرقام مستوحاة من تجربة أمهات زميلته، هل تعلم كم هو مخيف؟يمكنك إنشاء مقطع فيديو حقيقي مع صورة واحدة.البعض يستخدمه لخداعه، البعض يستخدمه لخداعه، والبعض يستخدمه... Danial Chughtai لا يمكن أن يحتمل.لقد قام بإنشاء Facia ، وهي أداة AI متخصصة في اكتشاف Deepfake والاحتيال على الهوية.تخدم الآن أكثر من 10 ملايين مستخدم نهائي مع إيرادات سنوية قدرها 25.35 مليون دولار.", "thumbnail": "https://images.indiehackers.com/post-images/aE5g33gZxYTwu0lYhMnK/vOqaQ3DJwYRP8MNEjUOSMger71w1/standout-cv-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0142", "title": "Mac上的ChatGPT客户端，他做到了月入21万", "title_en": "With the ChatGPT client on Mac, he achieved a monthly income of 210,000", "title_jp": "Mac上のChatGPTクライアント、彼は月額210，000を達成", "title_ar": "عميل ChatGPT على ماك، وقال انه حصل على 210000 في الشهر", "summary": "Mac上的ChatGPT客户端，他做到了月入21万 一次性买断，不靠订阅，利润率高达90% 大部分人做AI工具，都在卷API、卷功能、卷价格。 Daniel Nguyen走了一条不一样的路。 他做了个Mac上的ChatGPT客户端，叫BoltAI。 一次性买断，不强制订阅。现在月入1.53万美元，利润率接近90%。 一、 Daniel不是新手。 15年前，他在网", "summary_en": "He achieved a one-time buyout of the ChatGPT client on Mac with a monthly income of 210,000 yuan. He did not rely on subscriptions and had a profit margin of as high as 90%. Most people who make AI tools focus on compiling APIs, functions, and prices. Daniel Nguyen took a different path. He made a ChatGPT client on Mac called BoltAI. One-time buyout, no mandatory subscription. It now earns US$15,300 a month and has a profit margin of close to 90%. 1. Daniel is not a novice. 15 years ago, he was online", "summary_jp": "Mac上のChatGPTクライアントは、彼はサブスクリプションなしで210，000回限りの購入を行い、利益率は90%と高く、AIツールを行うほとんどの人は、ボリュームAPI、ボリューム機能、ボリューム価格です。ダニエル·グエンは別の道を歩んだ。彼はBoltAIというMac用のChatGPTクライアントを作った。強制購読なしの一括購入。今$15，300で、利益率はほぼ90%です。ダニエルは新しい人ではない。15年前、彼はネットワークにいた。", "summary_ar": "عميل ChatGPT على Mac ، حقق 210،000 شراء لمرة واحدة في الشهر ، دون الاعتماد على الاشتراك ، وهامش الربح يصل إلى 90٪ معظم الناس يفعلون أدوات AI ، في API المجلد ، ميزة المجلد ، سعر المجلد.لقد سلك دانيال نغوين طريقًا مختلفًا.قام بتصميم عميل ChatGPT على Mac ، يسمى BoltAI.شراء مرة واحدة، لا اشتراك إلزامي.ويعمل الآن على إيرادات شهرية قدرها 15.3 مليون دولار، وهو ما يقرب من 90 في المائة من هامش الربح.دانيال ليس جديداً.منذ 15 عاماً كان على الإنترنت.", "thumbnail": "https://images.indiehackers.com/post-images/aP4YP2DouOUuicCtcnCB/vOqaQ3DJwYRP8MNEjUOSMger71w1/stagetimer-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0143", "title": "靠Lifetime Deal做生活方式生意，月入3.6万", "title_en": "Relying on Lifetime Deal to do lifestyle business, earning 36,000 yuan a month", "title_jp": "Lifetime Dealでライフスタイルビジネスを始め、月額36，000ドルを稼ぐ", "title_ar": "تجارة نمط الحياة مع Lifetime Deal ، 36000 دولار شهريًا", "summary": "靠Lifetime Deal做生活方式生意，月入3.6万 他说：我不是为了赚钱，是为了掌控感 getrichquick的故事听腻了？ 来个不一样的。 Andrew Kamphey做了个Google Sheets教程站，Better Sheets。月入5000美元（约3.6万人民币）。 活得舒服，不焦虑。 不是为了发财，是为了\"掌控和独立\"。 一、 Andre", "summary_en": "He relies on Lifetime Deal to do a lifestyle business and earns 36,000 yuan a month. He said: I don't do it to make money, I just want to feel in control. Are you tired of hearing the story of getrickquick? Give me a different one. Andrew Kamphey created a Google Sheets tutorial site called Better Sheets. The monthly income is US$5000 (about 36,000 RMB). Live comfortably without anxiety. Not to get rich, but to \"control and independence.\" 1. Andre", "summary_jp": "Lifetime Dealのライフスタイルビジネスに依存して、月額36，000彼は言った：私はお金を稼ぐためではなく、getrichquickの話を聞くのにうんざりしている？別のものを取る。Andrew KampheyはGoogleスプレッドシートを作成しました。月額5000ドル（約36，000人民元）を受け取る。快適に、不安なし。金持ちになるためではなく、“支配と独立”のため。1.アンドレ", "summary_ar": "ويعمل على نمط الحياة مع صفقة مدى الحياة، ويكسب 36 ألف دولار شهرياً، وقال: \"أنا لا أريد كسب المال، أنا أريد أن أكون متحكمًا.تعالوا إلى شيء مختلف.قام أندرو كامبي بمحطة تعليمية لـ Google Sheets ، Better Sheets.الدخل الشهري هو 5000 دولار (حوالي 36000 يوان).كن مريحًا ، دون قلق.ليس من أجل الحصول على الثروة، ولكن من أجل \"السيطرة والاستقلال\".أولاً - أندريه", "thumbnail": "https://images.indiehackers.com/post-images/akoLUha2xmqFMEzSXd7z/vOqaQ3DJw , "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0145", "title": "零营销做到年入千万，他的秘诀是做减法", "title_en": "Zero marketing achieves tens of millions of yuan a year. His secret is to subtract", "title_jp": "ゼロマーケティングは年間1000万ドルを達成し、彼の秘密は減算を行うことです", "title_ar": "التسويق الصفري يحصل على عشرة الملايين سنويا، سر هو طرحه", "summary": "零营销做到年入千万，他的秘诀是做减法 只做单页网站，8年做到200万美元ARR 创业市场上充斥着各种建议。 \"要差异化！\" \"要做垂直细分！\" \"要营销！要投广告！\" AJ告诉你：不一定。 他做了Carrd——一个单页网站搭建工具。零营销，零广告，年入200万美元。 一、 AJ最早做免费网站模板HTML5 UP。 学响应式设计时做的副产品。 后来有了Pixe", "summary_en": "Zero marketing achieves tens of millions of dollars a year. His secret is to do subtraction and only create a single-page website. In eight years, the ARR entrepreneurial market is full of various suggestions. \"Be differentiated! \" \" Vertical subdivision must be made! \" \" Marketing! Want to advertise! \" AJ tells you: Not necessarily. He built Carrd-a one-page website building tool. Zero marketing, zero advertising, annual income of US$2 million. 1. AJ was the first to make a free website template HTML5 UP. A by-product of learning responsive design. Then came Pixe", "summary_jp": "ゼロマーケティングは年間1000万ドルを達成するために、彼の秘密は減算を行うことです1ページのウェブサイト、8年間200万ドルのARRスタートアップ市場は様々な提案でいっぱいです。“差別化しよう!“垂直に分割したい!“売りたい!”広告する! AJ：必ずしもそうではない。彼はCarrdを作りました-単一ページのウェブサイト構築ツール。マーケティングゼロ広告ゼロ年間200万ドルAJは最初に無料のウェブサイトテンプレートHTML 5 UPを作った。レスポンシブデザインの副産物を学びます。その後、ピクサーが登場。", "summary_ar": "التسويق الصفر لتحقيق عشرات الملايين سنويا، سر له هو القيام بطرح فقط لإنشاء صفحة واحدة من الموقع، 8 سنوات لتحقيق 2 مليون دولار ARR سوق بدء الأعمال مليئة بمختلف النصائح. \"تفرق\"! \"إنه يجب أن يكون عموديًا! \"أريد التسويق!\"يجب أن أعلن! \"أج\" أقول لك: ليس بالضرورة.لقد صنع Carrd - أداة لإنشاء مواقع ويب من صفحة واحدة.صفر التسويق، صفر الإعلانات، 2 مليون دولار سنويا.أولاً ، AJ هو أول من قام بعمل قالب موقع مجاني HTML5 UP.المنتجات الثانوية التي يتم القيام بها عند تعلم التصميم الاستجابة.بعد ذلك أصبح Pixie.", "thumbnail": "https://images.indiehackers.com/post-images/b5VbAJ3SpS8Q7WVcTGGW/vOqaQ3DJwYRP8MNEjUOSMger71w1/fiscal-ai-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0146", "title": "从不敢收费到年入50万美元，他花了5年", "title_en": "He spent 5 years from never daring to charge fees to earning $500,000 a year", "title_jp": "年間50万ドルまで請求しなかった彼は5年かかりました", "title_ar": "لم يجرؤ على فرض رسوم حتى يكسب 500 ألف دولار سنوياً، وأمضى 5 سنوات.", "summary": "从不敢收费到年入50万美元，他花了5年 他说：收费让产品变真实了，我害怕那种感觉 Grant McConnaughey以前做的项目，全都免费。 开源Python包。Django工具。自动化代码检查服务Lintly，几百个用户，就是不收费。 为什么？ \"收费让产品变真实。付费用户会对宕机和功能有真实期待。我没那个信心。\" 2020年1月，他给自己定了个新年目标—— 在网", "summary_en": "He never dared to charge until he earned $500,000 a year. He spent five years. He said: Fees make the product real. I'm afraid of that feeling. Grant McConnaughey's previous projects were all free. Open source Python package. Django tools. Lintly, an automated code inspection service, has hundreds of users, but it doesn't charge. Why? \"Fees make products real. Paying users will have real expectations for downtime and features. I don't have that confidence. \"In January 2020, he set himself a New Year's goal-online", "summary_jp": "年間50万ドルまで請求する勇気はなく、5年間を費やしたと彼は言いました。“手数料は製品を本物にします。グラント·マコノヒーが以前行ったプロジェクトはすべて無料であったという感覚が怖いです。オープンソースPythonパッケージDjangoツールです。数百人のユーザーを持つ自動コード検査サービスLintlyは無料です。なんで？“価格は製品をリアルにする。有料ユーザーはダウンタイムと機能を期待しています。そんな自信はない。2020年1月、彼は新年の目標を設定しました。", "summary_ar": "لم يجرؤ على فرض رسوم حتى يكسب نصف مليون دولار سنويًا ، وأمضى خمس سنوات يقول: \"إن الرسوم تجعل المنتجات حقيقية ، وأخاف من الشعور بأن غرانت ماكونهي كان يعمل في مشاريع سابقة ، كلها مجانية\".حزمة مفتوحة المصدر Python.أدوات Django.خدمة التحقق الآلي من الرموز لنتلي، ومئات المستخدمين، هو مجرد دون أي رسوم.لماذا ؟\"الرسوم تجعل المنتج حقيقيًا.سيكون لدى المستخدمين المدفوعين توقعات حقيقية من وقت التوقف والوظائف.ليس لدي تلك الثقة.في يناير 2020 ، حدد لنفسه هدفاً للعام الجديد - على الإنترنت.", "thumbnail": "https://images.indiehackers.com/post-images/bHvRpjj7xxXs71R3TR4I/vOqaQ3DJwYRP8MNEjUOSMger71w1/Heptabase-homepage.png?w=1400?w=1400", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:20:19"}, {"_id": "article_0147", "title": "零员工月入350万，AI公司三个月做到", "title_en": "Zero employees earn 3.5 million a month, and AI companies achieve it in three months", "title_jp": "従業員ゼロは月350万人、AI企業は3 ヶ月で達成", "title_ar": "3 ملايين و3 ملايين و3 ملايين و3 ملايين و3 ملايين", "summary": "零员工月入350万，AI公司三个月做到 前华尔街交易员：我受够了招人，所以做了个不用招人的系统 Ben Cera的背景很炸裂。 哥伦比亚大学工程学位。华尔街Barclays做量化交易。然后连续创业做消费者App。 最成功的Future Foods，和Uber创始人Travis Kalanick一起做的CloudKitchens项目，营收做到1亿美元。 然后他发现了一个问题——", "summary_en": "With zero employees earning 3.5 million a month, the AI company became a former Wall Street trader in three months: I was fed up with hiring, so I built a system that didn't have to hire people. Ben Cera's background is very explosive. Degree in engineering from the University of Colombia. Wall Street Barclays does quantitative trading. Then continue to start businesses to make consumer apps. The most successful Future Foods, the CloudKitches project, which was done with Uber founder Travis Kalanick, achieved revenue of US$100 million. Then he discovered a problem--", "summary_jp": "従業員ゼロの月間350万人、AI会社は3 ヶ月で元ウォールストリートトレーダー：私は採用にうんざりしているので、採用なしのシステムを作りましたベン·セラのバックグラウンドは爆発しました。コロンビア大学で工学を専攻。ウォール街のバークレイズは量的取引を行う。その後、コンシューマアプリを開発しました。最も成功したFuture Foodsは、Uberの創設者Travis Kalanickと共同で立ち上げたCloudKitchensプロジェクトで、1億ドルの収益を上げました。そして彼は問題を発見した。", "summary_ar": "صفر موظف 3.5 مليون في الشهر، شركة الذكاء الاصطناعي في ثلاثة أشهر من تاجر وول ستريت السابق: لقد سئمت من توظيف الناس، لذلك جعل نظام دون توظيف الناس، الخلفية من بن سيرا كان مكسورا.شهادة في الهندسة من جامعة كولومبيا.وول ستريت باركليز يقوم بالتداول الكمي.ثم تبدأ الأعمال التجارية المستمرة لتطبيق المستهلك.أنجح شركة Future Foods ، وهي مشروع CloudKitchens مع مؤسس Uber ، ترافيس كالانيك ، حققت عائدات قدرها 100 مليون دولار.ثم اكتشف مشكلة..", "thumbnail": "https://images.indiehackers.com/post-images/b7e9dab196/vOqaQ3DJwY
