ري في هذه الحالة التي تحدث عنها اليوم ، قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على 0 دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (أكل كوب شوي مع صديق) قضم أجنحة الدجاج وأسقطها فجأة: \"كنت أفكر في شيء واحد في الآونة الأخيرة - هل أخذت الاتجاه الخاطئ؟\" \"أقول لك انتظر، سأخبرك قصة\". 01 ماذا تفعل بعد؟هل تعتقدين أن هذا قد انتهى؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/qdReVAgLjz6EpW4OrJSI/vOqaQ3DJwYRP8MNEjUOSMger71w1/erikas-malisauskas-founder-of-kaching-appz.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:17"}, {"_id": "article_0207", "title": "VC失败后自举AI组合月入2万美元", "title_en": "Bootstrap AI combination earns US$20,000 a month after VC failure", "title_jp": "VCが失敗した後、AIポートフォリオが月2万ドルを獲得", "title_ar": "VC يفشل في الحصول على 20،000 دولار شهريا من محفظة AI", "summary": "VC失败后自举AI组合月入2万美元 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入2万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在咖啡馆写东西】 对面坐了个年轻人，一直在叹气。我问他怎么了。他说做了几个月AI产品，没什么起色。我说那你知道James Fleischmann吗？ 01 接下来怎么办？", "summary_en": "James Fleischmann spent less than two years proving one thing: Doing the right thing is 100 times more important than doing it hard. Annual income is 20,000 US dollars, per person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Writing in a cafe] There was a young man sitting opposite him, sighing all the time. I asked him what was wrong. He said that he had been making AI products for several months and had no improvement. I said, do you know James Fleischmann? 01 What to do next?", "summary_jp": "VCが失敗した後、ブートストラップAIポートフォリオが月額20，000ドルに達するJames Fleischmannは、2年足らずで1つのことを証明しました。年間2万ドルで、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【カフェでの書き込み】向かい側に座った若い男が、ため息をついていた。どうしたのか尋ねた。彼は数ヶ月間AI製品を作ったが、何も起こらなかった。ジェームズ·フライシュマンを知っていますか？0 1次は何？", "summary_ar": "استغرق جيمس فليشمان أقل من عامين لإثبات شيء واحد: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بشكل يائس. 20 ألف دولار سنوياً لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك.كان هناك شاب يجلس في المقهى، وكان ينهد.سألته عما حدث.وقال إنه عمل على منتجات الذكاء الاصطناعي لعدة أشهر ولم يتحسن شيء.هل تعرف على جيمس فليشمان؟01 ماذا تفعل بعد؟", "thumbnail": "https://images.indiehackers.com/team-images/Alexander-Van-Le_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:20"}, {"_id": "article_0208", "title": "独立创始人在饱和市场撬出月入2.5万美元的利基", "title_en": "Independent founders carve out a $25,000 monthly niche in saturated markets", "title_jp": "独立系創業者が飽和市場で月額$25，000のニッチを切り開く", "title_ar": "المؤسس المستقل يختبر مكانة بقيمة 25000 دولار شهرياً في السوق المشبعة", "summary": "独立创始人在饱和市场撬出月入2.5万美元的利基 同样自己干，为什么有人做到一半放弃了，有人能做到年入3美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【上次在一个创业小聚上】 旁边坐了个做AI的哥们儿。聊了半小时，他突然说：\"我真的觉得我卡住了。\"我说你听过James Fleischmann吗？他摇头。 01 我不会冒太大的风险——我只冒过经过计算的小风险。查理的另一个多元宇宙版本很早就全身心投入了 Liinks，现在是一家价值十亿美元企业的首席执行官。但查理很可能放弃了爱好、周末、睡眠和其他对这个版本的查理来说太重要的事情。 我不想忙碌和磨砺。我之所以进入这个行业，是因为我想对我正在做的事情拥有完全的所有权——这种所有权只有独立创始人才能享有。我想赚足够的钱来养活自己。现在这件事发生了，我感到无比兴奋。", "summary_en": "Independent founders create a niche earning US$25,000 a month in a saturated market and do it themselves. Why do some people give up halfway and others make US$3 a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Last time at a small entrepreneurial gathering] sat next to a buddy working in AI. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said have you heard of James Fleischmann? He shook his head. 01 I don't take too big a risk-I've only taken small calculated risks. Another version of Charlie's multiverse devoted himself to Liinks early on and is now CEO of a billion-dollar company. But Charlie probably gave up hobbies, weekends, sleep and other things that were too important to this version of Charlie. I don't want to be busy and honed. I entered the industry because I wanted to have full ownership of what I was doing-ownership that only independent founders could enjoy. I want to make enough money to support myself. Now that this has happened, I feel extremely excited.", "summary_jp": "独立した創業者は飽和市場で$25，000のニッチを作る、なぜ誰かが半分あきらめ、誰かが$3を作ることができるか。ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【前回の起業家集会で】AIをやっている仲間の隣に座った。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。“ジェームズ·フライシュマンをご存知ですか？頭を振った。私は大きなリスクを取らない-私は計算された小さなリスクしか取らない。チャーリーのもう一つのバージョンのマルチユニバースは、早い段階でLiinksに完全にコミットし、現在は10億ドル規模の企業のCEOです。しかし、チャーリーは趣味、週末、睡眠、そしてこのバージョンのチャーリーにとって重要すぎる他のものをあきらめている可能性が高い。私は忙しくて疲れたくない。私がこの業界に入ったのは、自分がやっていることの完全な所有権を持ちたかったからです。独立した創業者だけが享受できる所有権です。自分を養うのに十分なお金を稼ぎたい。それが起こった今、とても興奮しています。", "summary_ar": "المؤسسون المستقلون الذين يحصلون على 25000 دولار شهرياً في السوق المشبعة يفعلون الشيء نفسه بنفسه، لماذا يستسلمون نصفهم، بينما يحصلون على 3 دولارات سنوياً؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\".كان يجلس بجانبه صديق يعمل في شركة AI.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل جيمس فليشمان؟وهو يهز رأسه.أنا لا أخاطر كثيراً - أنا أخاطر فقط مخاطر صغيرة محسوبة.نسخة أخرى متعددة الكون من تشارلي قد خصصت في وقت مبكر ل لينكس ، وهو الآن الرئيس التنفيذي لشركة بقيمة مليار دولار.لكن من المحتمل أن يتخلى تشارلي عن هواياته وعطلات نهاية الأسبوع والنوم وغيرها من الأشياء المهمة للغاية بالنسبة لهذه النسخة من تشارلي.أنا لا أريد أن أكون مشغولاً أو مشغولاًلقد دخلت هذه الصناعة لأنني أردت أن أكون ملكية كاملة لما أقوم به - ملكية لا يمكن أن يتمتع بها سوى المؤسسين المستقلين.أريد أن أجني ما يكفي من المال لإطعام نفسي.والآن عندما يحدث هذا، أشعر بالإثارة الكبيرة.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.co ميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.معنى: لقد صنعت منتجات لمدة نصف عام ، ولم أرى أي أمل. 01 ماذا تفعل بعد؟", "thumbnail": "https://images.indiehackers.com/team-images/Andris-Reinman_founder.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:24"}, {"_id": "article_0210", "title": "打造月入2万美元组合，终于all in一个产品", "title_en": "Create a combination with monthly income of US$20,000 and finally all in one product", "title_jp": "月額$20，000のポートフォリオを作成し、最終的に1つの製品にすべてを", "title_ar": "إنشاء محفظة 20،000 دولار شهريا، وأخيرا كل في منتج واحد", "summary": "打造月入2万美元组合，终于all in一个产品 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入2千美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了几个月产品，还没看到什么希望。 01 接下来怎么办？ 最有意思的部分来了：", "summary_en": "Create a portfolio with a monthly income of US$20,000 and finally all in one product. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann managed to make $2,000 a year alone. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for several months and I haven't seen any hope yet. 01 What to do next? Here comes the most interesting part:", "summary_jp": "毎月$20，000のポートフォリオを構築し、最終的に製品で今日のケースは、起業家精神に対するあなたの理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間2，000ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。製品を作って数ヶ月経っても、まだ希望が見えません。0 1次は何？最も興味深い部分はここに来る：", "summary_ar": "إن إنشاء محفظة بقيمة 20 ألف دولار شهرياً، وأخيراً كل شيء في منتج واحد، في هذه الحالة التي أتحدث عنها اليوم، قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على ألفي دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.هذا هو السبب في أنه منذ عدة أشهر ، لم يرى أي أمل. 01 ماذا تفعل بعد؟الجزء الأكثر إثارة للاهتمام يأتي:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/p1fyDKtYj5HMItJxV87H/PWairgiOpneHvkGJri7RVbtORKI2/Val Sopi_2.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:25"}, {"_id": "article_0211", "title": "从消费APP赚了100万+美元后，跳入SaaS做月入3.5万美元工具", "title_en": "After making $1 million + from consumer apps, I jumped into SaaS to make a $35,000 monthly tool", "title_jp": "コンシューマアプリから100万ドル以上を稼いだ後、SaaSに飛び込み、月額35，000ドルのツールを獲得", "title_ar": "بعد كسب مليون دولار من تطبيقات المستهلكين ، قفز إلى أداة SaaS لجعل 35000 دولار شهرياً", "summary": "从消费APP赚了100万+美元后，跳入SaaS做月入3.5万美元工具 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在咖啡馆写东西】 对面坐了个年轻人，一直在叹气。我问他怎么了。他说做了几个月AI产品，没什么起色。我说那你知道James Fleischmann吗？ 01 接下来怎么办？", "summary_en": "After making $1 million + from consumer apps, James Fleischmann jumped into SaaS to make a monthly income of $35,000. It took less than two years to prove one thing: doing the right thing is 100 times more important than doing it hard. Year entry, alone. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Writing in a cafe] There was a young man sitting opposite him, sighing all the time. I asked him what was wrong. He said that he had been making AI products for several months and had no improvement. I said, do you know James Fleischmann? 01 What to do next?", "summary_jp": "コンシューマアプリで100万ドル以上を稼いだ後、SaaSに飛び込み、月額35，000ドルのツールを開発したJames Fleischmannは、2年足らずで1つのことを証明しました。正しいことをすることは、一生懸命やるよりも100倍重要です。年に入って、一人。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【カフェでの書き込み】向かい側に座った若い男が、ため息をついていた。どうしたのか尋ねた。彼は数ヶ月間AI製品を作ったが、何も起こらなかった。ジェームズ·フライシュマンを知っていますか？0 1次は何？", "summary_ar": "بعد أن كسب أكثر من مليون دولار من تطبيقات المستهلكين ، قفز إلى أداة SaaS لتحقيق الدخل الشهري البالغ 35000 دولار أمريكي ، أثبت جيمس فليشمان شيئًا في أقل من عامين: أن القيام بالأشياء الصحيحة أهم 100 مرة من القيام بها بشكل يائس.في السنة، شخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك.كان هناك شاب يجلس في المقهى، وكان ينهد.سألته عما حدث.وقال إنه عمل على منتجات الذكاء الاصطناعي لعدة أشهر ولم يتحسن شيء.هل تعرف على جيمس فليشمان؟01 ماذا تفعل بعد؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/sJNVOd15DOIwtBufa60K/PWairgiOpneHvkGJri7RVbtORKI2/kevin-founder-upscaled.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:28"}, {"_id": "article_0212", "title": "限制功能做金融科技产品，月入10.8万美元", "title_en": "Restricted functions to make financial technology products, with a monthly income of US$108,000", "title_jp": "金融技術製品の制限機能、月額108，000ドル", "title_ar": "تقييد وظائف المنتجات التكنولوجية المالية ، دخل شهري قدره 108،000 دولار", "summary": "限制功能做金融科技产品，月入10.8万美元 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入10美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【一个做独立开发的朋友约我吃饭】 吃到一半，他放下筷子：\"我最近特别焦虑。不知道怎么突破\"我说我给你讲个人吧。他叫James Fleischmann。 01 2019 年 12 月，我开始在沙发上编写 Parqet 代码。我是一家德国汽车共享公司的工程主管，在晚上和周末进行开发。然后，我收到了 Stripe 的录用通知，这是我在全球雇主中的第一选择。我无法忽略它。", "summary_en": "Restricted features to make financial technology products, earning US$108,000 a month. James Fleischmann proved one thing in less than two years: doing the right thing is 100 times more important than doing it hard. Annual income is US$10, per person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [A friend who is doing independent development asked me for dinner] Halfway through the meal, he put down his chopsticks: \"I have been very anxious recently. I don't know how to break through.\"I said, I'll tell you about a person. His name is James Fleischmann. 01 In December 2019, I started writing Parqet code on the sofa. I am an engineering director for a German car-sharing company, developing in the evenings and weekends. Then I received an offer from Stripe, my number one choice among global employers. I couldn't ignore it.", "summary_jp": "フィンテック製品を作るための機能制限、月額108，000ドルJames Fleischmannは、2年足らずで1つのことを証明しました。正しいことをすることは、必死にするよりも100倍重要です。年間10ドルで、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。“独立した開発の友人は私の食事に誘った”半分食べて、彼は箸を置いた：“私は最近特に心配している。どうやって突破するか分からない”私はあなたに個人的な話をすると言った。彼の名前はジェームズ·フライシュマン。2019 年 12 月、ソファでParqetのコードを書き始めました。私はドイツのカーシェアリング会社のエンジニアリング責任者で、夜間や週末に開発を行っています。その後、世界中の雇用主の中で最初に選ばれたStripeからオファーが届きました。無視できませんでした", "summary_ar": "في أقل من عامين، أثبت جيمس فليشمان شيئًا ما: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بشكل يائس.عشرة دولارات سنوياً لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك. [صديق يقوم بتطوير مستقل طلب مني تناول الطعام] في منتصف تناول الطعام ، وضع الععصي: \"أنا قلق بشكل خاص في الآونة الأخيرة.أنا لا أعرف كيف أتخلى عن ذلك، أقول لي أن أقول لكم شخصيا.اسمه جيمس فليشمان. 01 في ديسمبر 2019 ، بدأت في كتابة برنامج Parkett على الأريكة.أنا مدير هندسي في شركة ألمانية لتقاسم السيارات ، وأقوم بالتطوير في المساء وعطلات نهاية الأسبوع.ثم تلقيت عرض توظيف من Stripe ، الذي كان خياري الأول بين أرباب العمل في جميع أنحاء العالم.لا أستطيع تجاهلها.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/sQoTemyW9t7ZAOurFhZk/vOqaQ3DJwYRP8MNEjUOSMger71w1/sumit-kumar-founder-of-parqet.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:31"}, {"_id": "article_0213", "title": "从保洁副业到年入300万美元的清洁行业SaaS", "title_en": "From the cleaning sideline to the $3 million annual cleaning industry SaaS", "title_jp": "副業の清掃から年間300万ドルの清掃サービスSaaSへ", "title_ar": "من الأعمال الفرعية للتنظيف إلى صناعة التنظيف التي تبلغ إيراداتها 3 ملايين دولار سنويًا SaaS", "summary": "从保洁副业到年入300万美元的清洁行业SaaS 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入300万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 接下来怎么办？ 他说了一句话我记到现在：", "summary_en": "From the cleaning sideline to the US$3 million annual cleaning industry SaaS, this case told today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann managed to make $3 million a year alone. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 What should we do next? He said something that I remember to this day:", "summary_jp": "副業の清掃から年間300万ドルの清掃サービスへのSaaS今日のケースは、起業家精神に対するあなたの理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは年間300万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。0 1次は？彼は今でも覚えていることを言った。", "summary_ar": "من الأعمال الفرعية للتنظيف إلى صناعة التنظيف SaaS التي تبلغ عائداتها 3 ملايين دولار سنويًا ، قد تغير هذه الحالة اليوم فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على ثلاثة ملايين دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\" 01 ماذا بعد؟قال له كلمة أتذكرها حتى الآن:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/suhsqkDZB1zIwRmXxrFm/vOqaQ3DJwYRP8MNEjUOSMger71w1/amar-ghose-founder-of-zenmaid.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:32"}, {"_id": "article_0214", "title": "Des Traynor讲述如何把Intercom做到4亿美元ARR", "title_en": "Des Traynor talks about how to turn Intercom into a $400 million ARR", "title_jp": "デス·トレイナー、Intercomを4億ドルのARRにする方法を語る", "title_ar": "Des Traynor يروي كيف أن Intercom حققت 400 مليون دولار ARR", "summary": "Des Traynor讲述如何把Intercom做到4亿美元ARR 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入10000万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【早高峰地铁上】 刷手机看到一个帖子：\"做AI大半年了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 接下来怎么办？ 但这不是重点。", "summary_en": "Des Traynor talks about how to turn Intercom into US$400 million ARR's case today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann managed to make $100 million a year alone. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing AI for more than half a year, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 What to do next? But that's not the point.", "summary_jp": "Intercomを4億ドルのARRにするためのDes Traynorの今日のケースは、起業家精神に対する理解を変えるかもしれない。資金調達もチームもバックグラウンドもなくジェームズ·フライシュマンは一人で年間1億ドルを稼ぎました5分後、あなたのギャップは能力ではなく、認知であることがわかります。[朝のピーク地下鉄]ブラシ携帯電話の投稿を見てください：“AIを行う半年間、月収はまだホバリングしている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください0 1次は何？でもそれはポイントじゃない", "summary_ar": "ديس تراينور يروي كيفية جعل إنتركوم 400 مليون دولار هذه القضية التي أتحدث عنها ARR اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حقق 10 ملايين دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"الاصطناعية لمدة نصف عام، والدخل الشهري لا يزال يتجول، هل يجب أن تستسلم؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان. 01 ماذا تفعل بعد؟ولكن هذا ليس هو المحور.", "thumbnail": "https://images.indiehackers.com/team-images/Des-Traynor_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:34"}, {"_id": "article_0215", "title": "Marc Louvion非传统营销把Ship Fast做到4.3万美元", "title_en": "Marc Louvion's non-traditional marketing targets Ship Fast to $43,000", "title_jp": "Marc Louvion、型破りなマーケティングでShip Fastを43，000ドルで買収", "title_ar": "مارك لوفيون التسويق غير التقليدي يجعل Ship Fast 43000 دولار", "summary": "Marc Louvion非传统营销把Ship Fast做到4.3万美元 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——Hazel Lim一个人做到了年入4万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【上次在一个创业小聚上】 旁边坐了个做SaaS的哥们儿。聊了半小时，他突然说：\"我真的觉得我卡住了。\"我说你听过Hazel Lim吗？他摇头。 01 我第一次认识 Marc Louvion 是在 2023 年 2 月，当时我试图给他买一杯虚拟咖啡，作为他作为独立制作人度过的艰难一周的惊喜。 遗憾的是，虽然我们谁也不明白为什么星巴克不让他兑换真正的咖啡，但我继续在 Twitter/X 上关注他的旅程，并且很高兴看到他最近在 Ship Fast 上取得的连胜。", "summary_en": "Marc Louvion's unconventional marketing has made Ship Fast $43,000. Today's case may change your understanding of entrepreneurship. No financing, no team, no background-Hazel Lim made an annual income of US$40,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Last time at a small entrepreneurial gathering] sat next to a buddy who did SaaS. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said, have you heard of Hazel Lim? He shook his head. 01 I first met Marc Louvion in February 2023, when I tried to buy him a cup of virtual coffee as a surprise for his difficult week as an indie producer. Unfortunately, while none of us can understand why Starbucks won't let him redeem real coffee, I continue to follow his journey on Twitter/X and am pleased to see his recent winning streak on Ship Fast.", "summary_jp": "Marc Louvionの型破りなマーケティングがShip Fastを$43，000にした今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、Hazel Limは年間4万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【前回、起業家の集まりで】隣にSaaSをやっている仲間が座っていた。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。“ヘイゼル·リムを聞いたことがある？頭を振った。マーク·ルヴィオンに初めて会ったのは2023 年 2 月で、インディペンデント·プロデューサーとしての厳しい1週間のサプライズとしてバーチャルコーヒーを買おうとしたときでした。残念ながら、スターバックスが彼を本物のコーヒーと引き換えることを許さない理由は誰にも理解できませんが、私はTwitter/Xで彼の旅をフォローし続けており、Ship Fastでの彼の最近の連勝を見て興奮しています。", "summary_ar": "مارك لوفيون التسويق غير التقليدي جعل السفينة سريعة إلى 43،000 دولار هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - حققت هازل ليم وحدها أربعين ألف دولار سنوياً.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك.كان هناك صديق يجلس بجانبه يعمل في ساوس.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل هازيل ليم؟وهو يهز رأسه. 01 تعرفت على مارك لوفيون لأول مرة في فبراير 2023 عندما حاولت أن أشتري له فنجانًا من القهوة الافتراضية كمفاجأة لأسبوعه الصعب كمنتج مستقل.للأسف ، على الرغم من أن أيا منا لا يفهم لماذا لم تسمح له ستاربكس باستبدال القهوة الحقيقية ، إلا أنني أتابع رحلته على تويتر / X ، وكان من دواعي سروري أن أرى سلسلة انتصاره الأخيرة على Ship Fast.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/6163fb113f/6bKF6OxQO4WDRblhRxcAYTTojJw2/287d211d-02ca-8f92-647b-013f6e72e1e1.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:38"}, {"_id": "article_0216", "title": "打造月入5.1万美元的小型APP生态", "title_en": "Create a small APP ecosystem with a monthly income of US$51,000", "title_jp": "月額51，000ドルの小さなアプリを作成する", "title_ar": "إنشاء بيئة تطبيقات صغيرة بقيمة 51 ألف دولار شهريًا", "summary": "打造月入5.1万美元的小型APP生态 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入4万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了几个月产品，还没看到什么希望。 01 我本质上是一名软件工程师。从我记事起，我就一直在构建东西，主要是在网络和 SaaS 领域。在 Swifteq 之前，我实际上尝试过推出另一种产品，但并没有真正成功，但它教会了我很多关于快速发货、与用户交谈以及不要爱上错误想法的知识。 2020 年，我以个人创始人身份创办了 Swifteq。我们为 Zendesk 生态系统构建应用程序，帮助支持团队更智能地工作并更有效地使用 Zendesk。考虑为代理和管理员提供生活质量工具。", "summary_en": "Create a small APP ecosystem with a monthly income of US$51,000. Today's case may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $40,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for several months and I haven't seen any hope yet. 01 I am essentially a software engineer. I've been building things for as long as I can remember, mainly in the web and SaaS space. Before Swifteq, I actually tried launching another product, but it didn't really succeed, but it taught me a lot about shipping quickly, talking to users, and not falling in love with wrong ideas. In 2020, I founded Swifteq as a personal founder. We build apps for the Zendesk ecosystem to help support teams work smarter and use Zendesk more effectively. Consider providing quality of life tools for agents and administrators.", "summary_jp": "月額51，000ドルの小さなアプリエコを構築今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは年間4万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。製品を作って数ヶ月経っても、まだ希望が見えません。私は基本的にソフトウェアエンジニアです。覚えている限り、主にウェブとSaaSの分野でモノを作ってきました。Swifteqの前に、別の製品をローンチしようとしたが、あまり成功しなかったが、迅速な出荷、ユーザーとの会話、間違ったアイデアに恋しないことについて多くを学んだ。2020 年に個人創業者としてSwifteqを立ち上げました。Zendeskエコシステム向けのアプリケーションを構築し、サポートチームがよりスマートに作業し、Zendeskをより効率的に使用できるよう支援します。エージェントや管理者向けのQOLツールの提供を検討してください。", "summary_ar": "إنشاء تطبيقات صغيرة بقيمة 51 ألف دولار شهرياً هذه الحالة التي أشار إليها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على 40 ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.هذا هو السبب في أنه منذ عدة أشهر ، لم يرى أي أمل. 01 أنا في الأساس مهندس برمجيات.منذ أن أتذكر ، كنت أبني أشياء ، بشكل أساسي في مجال الشبكات و SaaS.قبل Swifteq ، حاولت في الواقع إطلاق منتج آخر ولم تنجح حقًا ، لكنه علمني الكثير عن التسليم السريع ، والتحدث مع المستخدمين ، وعدم الوقوع في الحب مع الأفكار الخاطئة.في عام 2020 ، أسست Swifteq كمؤسس شخصي.نقوم ببناء تطبيقات للنظام الإيكولوجي Zendesk لمساعدة فرق الدعم على العمل بشكل أكثر ذكاءً واستخدام Zendesk بشكل أكثر فعالية.فكر في توفير أدوات جودة الحياة للوكلاء والمديرين.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/tvYLER4k6KVeA4NiwRJL/PWairgiOpneHvkGJri7RVbtORKI2/Founder_cover212.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:42"}, {"_id": "article_0217", "title": "两次失败后，自用产品做到月入4万美元", "title_en": "After two failures, the monthly income of self-use products reached US$40,000", "title_jp": "2回の失敗の後、自己消費製品は月額4万ドルを稼ぐ", "title_ar": "بعد فشل مرتين ، يحصل على 40 ألف دولار شهريًا من المنتج الخاص بالاستخدام.", "summary": "两次失败后，自用产品做到月入4万美元 同样搞技术，为什么有人做到一半放弃了，有人能做到年入1万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 接下来怎么办？ 他做对了一件事：", "summary_en": "After two failures, my own products earned a monthly income of US$40,000 and also engaged in technology. Why did some people give up halfway and some people earn an annual income of US$10,000? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 What should we do next? He did one thing right:", "summary_jp": "2つの失敗の後、自己消費製品は月額4万ドルの技術に従事し、なぜ誰かが半分あきらめることをし、誰かが年間1万ドルを得ることができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。0 1次は？彼は一つ正しいことをしました", "summary_ar": "بعد الفشل مرتين ، يمكنك الحصول على 40،000 دولار شهرياً من المنتجات الخاصة بالعمل في نفس التكنولوجيا ، لماذا يستسلم شخص ما نصفها ، ويمكنه شخص ما الحصول على 10،000 دولار سنوياً؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\". (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\" 01 ماذا بعد؟لقد فعل شيئًا واحدًا بشكل صحيح:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/twVhoBtXHF2Q9knIFY3k/vOqaQ3DJwYRP8MNEjUOSMger71w1/yasha-boroumand-founder-of-flowhunt.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:44"}, {"_id": "article_0218", "title": "收购微SaaS产品，做到月入12万美元", "title_en": "Acquisition of micro-SaaS products to achieve a monthly income of US$120,000", "title_jp": "マイクロSaaS製品を月額12万ドルで買収", "title_ar": "شراء منتجات SaaS الصغيرة وتحقيق دخل شهري قدره 120 ألف دولار", "summary": "收购微SaaS产品，做到月入12万美元 James Fleischmann用不到两年时间证明了一件事：做对事，比拼命做事重要100倍。 年入100万美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【在咖啡馆写东西】 对面坐了个年轻人，一直在叹气。我问他怎么了。他说做了一年多SaaS产品，没什么起色。我说那你知道James Fleischmann吗？ 01 接下来怎么办？", "summary_en": "It took James Fleischmann less than two years to prove one thing by acquiring micro-SaaS products and earning US$120,000 a month: Doing the right thing is 100 times more important than doing it hard. Annual income is 1 million US dollars, one person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Writing in a cafe] There was a young man sitting opposite him, sighing all the time. I asked him what was wrong. He said that he had been making SaaS products for more than a year, but there was no improvement. I said, do you know James Fleischmann? 01 What to do next?", "summary_jp": "マイクロSaaS製品を購入し、月額12万ドルを獲得James Fleischmannは2年足らずで1つのことを証明しました。正しいことをすることは、一生懸命やるよりも100倍重要です。年間100万ドル、一人で。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【カフェでの書き込み】向かい側に座った若い男が、ため息をついていた。どうしたのか尋ねた。彼は1年以上SaaS製品を作っていたが、何も起こらなかった。ジェームズ·フライシュマンを知っていますか？0 1次は何？", "summary_ar": "استحوذ على منتجات خدمة الخدمات المتكاملة لخدمة الخدمات المتكاملةمليون دولار في السنة، شخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك.كان هناك شاب يجلس في المقهى، وكان ينهد.سألته عما حدث.وقال انه يعمل على المنتجات SaaS لأكثر من عام، ولكن لا شيء يتحسن.هل تعرف على جيمس فليشمان؟01 ماذا تفعل بعد؟", "thumbnail": "https://images.indiehackers.com/team-images/Pascal-Levy-Garboua_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:45"}, {"_id": "article_0219", "title": "在饱和市场通过差异化做到500万美元ARR", "title_en": "Achieve US$5 million ARR through differentiation in saturated markets", "title_jp": "飽和市場での差別化で500万ドルのARR", "title_ar": "تحقيق 5 ملايين دولار من الناتج السريع عن طريق التفاوت في الأسواق المشبعة", "summary": "在饱和市场通过差异化做到500万美元ARR 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入500万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【早高峰地铁上】 刷手机看到一个帖子：\"做AI几个月了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 我出身于企业家世家。我的父母都是小企业主，至今仍然一起工作。我哥哥经营着一家很受欢迎的直接面向消费者的厨具公司。我一直觉得小企业确实没有得到充分的服务，尤其是软件公司。 美国经济确实建立在小企业主的勇气和创造力的基础上，并由美国的创业理想提供动力。然而，许多软件都是专门为了帮助大公司和财富 500 强公司发展而构建的，而小型企业在很大程度上被忽视了。", "summary_en": "Achieving $5 million through differentiation in saturated markets ARR This case today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of US$5 million by himself. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing AI for several months, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 I came from a family of entrepreneurs. My parents are both small business owners and still work together. My brother runs a popular direct-to-consumer kitchenware company. I have always felt that small businesses do not receive adequate services, especially software companies. The U.S. economy is indeed built on the courage and creativity of small business owners and is powered by America's entrepreneurial ideals. However, much software is specifically built to help large companies and Fortune 500 companies grow, while small businesses are largely ignored.", "summary_jp": "飽和市場での差別化で$5百万を達成するARR今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは年間500万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。[朝のピーク地下鉄]ブラシ携帯電話の投稿を見て：“AIを数ヶ月間行って、月収はまだホバリングしている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください私は起業家の家系に生まれました。両親は中小企業経営者で、今も一緒に働いています。私の兄は、人気のダイレクト·ツー·コンシューマー·キッチン·カンパニーを経営しています。私は常に中小企業、特にソフトウェア会社が十分にサービスを受けていないと感じています。アメリカ経済は、中小企業経営者の勇気と創造性に基づいており、アメリカの起業家精神に支えられています。しかし、多くのソフトウェアは大企業やフォーチュン500企業の成長を支援するために特別に構築されており、中小企業はほとんど無視されています。", "summary_ar": "تحقيق 5 ملايين دولار من خلال التمييز في السوق المشبعة هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على خمسة ملايين دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"الاصطناعية لعدة أشهر، الدخل الشهري لا يزال يتجول، هل يجب أن تستسلم؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان.أنا من عائلة من رجال الأعمال.والداي كانا أصحاب أعمال تجارية صغيرة ولا يزالان يعملان らめるべきですか？“私は戻らなかった。でも@arjunpredevを思い出しました。Ajun Predvこれで終わりだと思う？", "summary_ar": "حل المشاكل الداخلية باستخدام أدوات الذكاء الاصطناعي بمبلغ 100 ألف دولار هذه الحالة التي تتحدث عنها ARR اليوم قد تغير فهمك لبدء الأعمال.لا تمويل، لا فريق، لا خلفية - @arjunpredev وحده في السنة.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) فرشاة الهاتف المحمول لرؤية منشور: \"الاصطناعية لأكثر من عام، الدخل الشهري لا يزال يتجول، هل يجب أن تستسلم؟\" \"لم أعود بعد أن أتحمل.ولكنني أفكر في @arjunpredev. 01 أجون بريدف هل تعتقد أن هذا قد انتهى؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/438c1ab476/JAcyjiQbmJYSOUTK9UQC1PNf9D13/8fb99059-b7bb-1784-92d7-30e3faca837f.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:49"}, {"_id": "article_0221", "title": "把泛兴趣newsletter变成超利基产品", "title_en": "Turn pan-interest newsletter into a super-niche product", "title_jp": "興味のあるニュースレターを超ニッチな製品に変える", "title_ar": "تحويل النشرة الإخبارية إلى منتجات فائقة الاهتمام", "summary": "把泛兴趣newsletter变成超利基产品 James Fleischmann用几年时间证明了一件事：做对事，比拼命做事重要100倍。 年入1千美金，一个人。 你可能会说：那是别人，我不行。看完你就知道了——他开始的起点，可能还不如你。 【上次在一个创业小聚上】 旁边坐了个做内容的哥们儿。聊了半小时，他突然说：\"我真的觉得我卡住了。\"我说你听过James Fleischmann吗？他摇头。 01 在开始之前，你不必把所有事情都弄清楚。就开始吧。当我开始时，我没有追随者、电子邮件列表、网站，甚至没有精致的利基市场。", "summary_en": "Turning the pan-interest newsletter into a ultra-niche product James Fleischmann spent a few years proving one thing: doing the right thing is 100 times more important than doing it hard. Annual income is 1,000 US dollars, per person. You may say: That's someone else, I can't do it. You will know after reading it-his starting point may not be as good as yours. [Last time at a small entrepreneurial gathering] sat next to a buddy doing content. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said have you heard of James Fleischmann? He shook his head. 01 You don't have to figure everything out before you start. Let's get started. When I started, I had no followers, email lists, websites, or even sophisticated niche markets.", "summary_jp": "興味のあるニュースレターを超ニッチな製品に変えるJames Fleischmannは数年にわたって1つのことを証明しました正しいことをすることは必死に働くよりも100倍重要です1人で年間1000ドル。他の誰かだと思うかもしれませんが私はできません彼が始めた場所は、おそらくあなたほどではないことがわかります。【前回は起業家の集まりで】隣に座っている仲間のコンテンツを作った。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。“ジェームズ·フライシュマンをご存知ですか？頭を振った。始める前に、すべてを把握する必要はありません。さあ始めましょう私が始めたとき、私にはフォロワー、電子メールリスト、ウェブサイト、または洗練されたニッチさえありませんでした。", "summary_ar": "تحويل النشرة الإخبارية لجميع الاهتمامات إلى منتج فائق المتخصصة أمضى جيمس فليشمان عدة سنوات في إثبات شيء: أن القيام بالأشياء الصحيحة أكثر أهمية 100 مرة من القيام بها بجد.ألف دولار في السنة، لشخص واحد.قد تقول: هذا شخص آخر، أنا لا أستطيع.ستعرف بعد قراءته - نقطة البداية التي بدأها ، ربما أقل منك.كان هناك صديق يجلس بجانبه يعمل على المحتوى.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل جيمس فليشمان؟وهو يهز رأسه.لا تحتاج إلى معرفة كل شيء قبل أن تبدأ.فلنبدأ.عندما بدأت ، لم يكن لدي أتباع أو قائمة بريد إلكتروني أو موقع ويب أو حتى مكانة رائعة.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/uz5xOP2l8vdQMguhUpNn/vOqaQ3DJwYRP8MNEjUOSMger71w1/dylan-redekop-founder-of-growth-currency.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:51"}, {"_id": "article_0222", "title": "先发优势帮他在红海市场做到高6位数ARR", "title_en": "The first-mover advantage helped him achieve a high 6-digit ARR in the Red Sea market", "title_jp": "彼は紅海市場で6桁のARRを達成した。", "title_ar": "الميزة الأولى تساعده على الحصول على 6 أرقام أعلى في أسواق البحر الأحمر ARR", "summary": "先发优势帮他在红海市场做到高6位数ARR 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入18美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【一个做AI的朋友约我吃饭】 吃到一半，他放下筷子：\"我最近特别焦虑。产品没流量\"我说我给你讲个人吧。他叫James Fleischmann。 01 接下来怎么办？ 你可能想不到：", "summary_en": "The first-mover advantage helped him achieve a high 6-digit ARR in the Red Sea market. This case I talked about today may change yo  the most honest way to both parties", "title_jp": "彼は無料トライアルなしで課金するのはダークモードだと言い、Jay Tanは答えた：それは双方にとって最も正直な方法です。", "title_ar": "وقال إن الرسوم بدون تجريبة مجانية هي الوضع المظلم، Jay Tan: هذه هي الطريقة الأكثر صدقًا للطرفين", "summary": "\"They say it's a dark pattern. That's a cowardly, lose-win w 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入10美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【在楼下便利店买水】 碰见以前的同事。他在货架前愣了半天，拿了两瓶啤酒——大早上的。结完帐，他叫住我：\"有空聊聊吗？\" 01 当 X 开始对其 API 收取过高的价格：4.2 万美元/月时，Jay Tan 正靠 3 万美元的 MRR 过着舒适的生活。于是他关闭了它并开始开发 Zylv", "summary_en": "\"They say it's a dark pattern. That's a cowards, lose-win w talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $10. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Buying water at the convenience store downstairs] I met a former colleague. He froze in front of the shelf for a long time and took two bottles of beer-early in the morning. After settling the bill, he stopped me: \"Do you have time to chat? \" 01 When X started charging exorbitant prices for its APIs: $42,000 a month, Jay Tan was living comfortably on a $30,000 MRR. So he shut it down and started developing Zylv", "summary_jp": "“They say it's a dark pattern. That's a cowardly lose-win w今日のケースは、起業家精神に対する理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは一人で年間10ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【下のコンビニで水を買う】元同僚に会う。彼は長い間棚の前に立っていて、ビールを2本持ってきました。電話が終わると、彼は私を呼びました。XがAPIに月額42，000ドルという法外な価格を請求し始めたとき、Jay Tanは30，000ドルのMRRで快適に暮らしていました。そこで彼はそれをシャットダウンしZylvの開発を始めました", "summary_ar": "\"يقولون إنه نمط مظلم.هذا هو الجبان، الخسارة-الفوز w هذه الحالة التي تحدث اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على 10 دولارات سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (ألتقي بزملاء سابقين)كان يقف أمام الرف لمدة نصف يوم وأخذ زجاجة من البيرة - في الصباح الباكر.عندما أنهى الحساب، قال لي: \"هل لديك وقت للحديث؟\"عندما بدأت X في فرض أسعار مفرطة على واجهة برمجة التطبيقات الخاصة بها: 4.2 ألف دولار شهريًا ، كان جاي تان يعيش حياة مريحة على MRR بقيمة 30 ألف دولار.لذلك أغلقها وبدأ في تطوير Zylv.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/8ac02f37ea/vOqaQ3DJwYRP8MNEjUOSMger71w1/da3e14ea-4fc6-1655-dc7d-8fe2165e4143.jpeg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:57"}, {"_id": "article_0225", "title": "免费副项目转型11个月做到月入1.2万美元", "title_en": "Free sub-project transformation takes 11 months to achieve a monthly income of US$12,000", "title_jp": "無料サブプログラム変換11 ヶ月間$12，000の月額収入を達成", "title_ar": "تحويل المشروع الفرعي مجاني لمدة 11 شهرًا إلى دخل شهري قدره 12000 دولار", "summary": "免费副项目转型11个月做到月入1.2万美元 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入1万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【半夜收到一条微信】 一个很久没联系的前同事。他说：\"在吗？想跟你聊个事。\"然后发了一长串。大意是：做了一年多产品，还没看到什么希望。 01 接下来怎么办？ 你以为这就完了？", "summary_en": "Free sub-project transformation takes 11 months to achieve a monthly income of US$12,000. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $10,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Received a WeChat message in the middle of the night] A former colleague who had not contacted for a long time. He said: \"Are you there? I want to talk to you about something. \"Then I sent a long list. The general idea is: I have been making products for more than a year and I haven't seen any hope yet. 01 What to do next? You think it's over?", "summary_jp": "無料のサブプログラム変換11 ヶ月で月額12，000ドルを達成今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは1万ドルを稼ぐことができた。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【夜中に微信を受信】長い間連絡を取り合っていなかった元同僚。彼は言いました“そこに？あなたと話したいことがあります。”と長いリストを送った。1年以上経っても希望はありません。0 1次は何？これで終わりだと思いますか？", "summary_ar": "تحويل المشاريع الفرعية المجانية لتحقيق دخل شهري قدره 12000 دولار في 11 شهرًا قد تغير هذه الحالة اليوم فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على عشرة آلاف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (تلقيت رسالة في منتصف الليل) زميل سابق لم يتصل به منذ فترة طويلة.قال: هل أنت هنا؟أريد التحدث معك.ثم أرسلت قائمة طويلة.معنى: صنع المنتجات لأكثر من عام ، ولم أرى أي أمل. 01 ماذا تفعل بعد؟هل تعتقدين أن هذا قد انتهى؟", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/wUZgSLPMYgJMQkQ4b0ZB/vOqaQ3DJwYRP8MNEjUOSMger71w1/pranay-agarwal-founder-of-mockey.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:21:59"}, {"_id": "article_0226", "title": "简单Notion扩展变成月入3.7万美元的表单工具", "title_en": "Simple Notion extension becomes a form tool that earns $37,000 a month", "title_jp": "シンプルなNotion拡張機能が月額$37，000のフォームツールになる", "title_ar": "تمديد Notion بسيط يتحول إلى أداة نموذجية بقيمة 37000 دولار شهريًا", "summary": "简单Notion扩展变成月入3.7万美元的表单工具 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——Katie Hignett一个人做到了年入4万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【上次在一个创业小聚上】 旁边坐了个做独立开发的哥们儿。聊了半小时，他突然说：\"我真的觉得我卡住了。\"我说你听过Katie Hignett吗？他摇头。 01 100%控制 更扎心的是——", "summary_en": "Simple Notion extension becomes a form tool that earns $37,000 a month. Today's case may change your understanding of entrepreneurship. No financing, no team, no background-Katie Hignett made an annual income of $40,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [Last time at an entrepreneurial gathering] sat next to a buddy who was doing independent development. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said have you heard of Katie Hignett? He shook his head. 01 100% control What is even more heartbreaking is--", "summary_jp": "シンプルなNotion拡張機能が月額37，000ドルのフォームツールになる今日の例は、起業家精神に対する理解を変えるかもしれません。資金調達もチームもバックグラウンドもありませんケイティ·ヒネットは一人で年間4万ドルを稼ぎました5分後、あなたのギャップは能力ではなく、認知であることがわかります。【前回の起業家集会で】独立した開発者の隣に座っていた。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。ケイティ·ヒネットをご存知ですか？頭を振った。100%コントロールが一番大事なのは、", "summary_ar": "تمديد Notion البسيط إلى أداة نموذجية بقيمة 37000 دولار شهرياً قد يغير فهمك لبدء الأعمال التجارية.بدون تمويل، بدون فريق، بدون خلفية - كاتي هيغنيت وحدها حصلت على أربعين ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك.كان هناك صديق يجلس بجانبه يعمل في تطوير مستقل.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل كاتي هينييت؟وهو يهز رأسه. 100٪ من السيطرة على أكثر من...", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/x93KwOjEKWi9yugL3s02/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Julien%20Nahum%20NoteForms%20Founder.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:22:01"}, {"_id": "article_0227", "title": "利用竞争对手缺口把简单B2B方案做到月入1.5万美元SaaS", "title_en": "Take advantage of competitor gaps to make simple B2B solutions earn US$15,000 a month as SaaS", "title_jp": "競合他社のギャップを活用して、シンプルなB 2 Bソリューションを月額15，000ドルで提供", "title_ar": "الاستفادة من الفجوة المنافسة لتحقيق برنامج بسيط B2B بقيمة 15000 دولار شهرياً من خدمات الخدمة الخدمية (SaaS)", "summary": "利用竞争对手缺口把简单B2B方案做到月入1.5万美元SaaS 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——Katie Hignett一个人做到了年入100万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【早高峰地铁上】 刷手机看到一个帖子：\"做SaaS快两年了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了Katie Hignett。 01 我是一家初创公司的全栈开发人员，我渴望自己做一些东西。我想做的不仅仅是答票。我想参与整个过程。但我对我的第一个项目很现实，我是在工作的同时开始的。通过阅读其他独立黑客的资料，我知道我的第一个项目将会失败。因此，我列出了一长串想法并选择了最简单的一个。 纯属运气好，结果人们想要这个产品。他们付的钱比我预期的要多，所以这成了我的实际项目。", "summary_en": "Taking advantage of the competitor gap to make a simple B2B solution earn US$15,000 a month. SaaS is a case that today may change your understanding of entrepreneurship. No financing, no team, no background-Katie Hignett made an annual income of US$1 million. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I've been doing SaaS for almost two years, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of Katie Hignett. 01 I am a full-stack developer at a startup and I aspire to do something myself. I want to do more than just answer votes. I want to be involved in the entire process. But I was realistic about my first project, and I started it while working. By reading information from other independent hackers, I knew that my first project would fail. So I listed a long list of ideas and chose the simplest one. It was sheer luck that people wanted this product. They paid more than I expected, so this became my actual project.", "summary_jp": "競合他社のギャップを利用してシンプルなB 2 Bソリューションを月額15，000ドルにするSaaS今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもありませんケイティ·ヒネットは一人で年間100万ドルを稼ぎました5分後、あなたのギャップは能力ではなく、認知であることがわかります。“朝のピーク地下鉄”ブラシ携帯電話の投稿を参照してください：“ほぼ2年間SaaSを行っている、月収はまだホバリング、あきらめるべきですか？“私は戻らなかった。ケイティ·ヒネットのことを考えました0 1私はスタートアップのフルスタック開発者で、自分で何かを作りたいと思っています。投票以上のことをしたかった。プロセス全体に関わりたい。しかし、私は最初のプロジェクトについて現実的で、仕事と同時に始めました。他の独立したハッカーの話を読んで、私の最初のプロジェクトは失敗すると思いました。そこで、私はアイデアの長いリストを作り、最も簡単なものを選びました。運が良ければ、人々はこの製品を望んだ。思っていた以上にお金がかかったので、実際のプロジェクトになりました。", "summary_ar": "الاستفادة من الفجوة المنافسة لتحقيق برنامج بسيط B2B بقيمة 15000 دولار شهرياً هذه الحالة التي تناولتها SaaS اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - كاتي هيغنيت وحدها حصلت على مليون دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) تمرير الهاتف المحمول رؤية منشور: \"القيام بـ SaaS لمدة عامين تقريبًا ، والدخل الشهري لا يزال يتجول ، هل يجب الاستسلام؟\" \"لم أعود بعد أن أتحمل.كنت أفكر في كاتي هيغنيت. 01 أنا مطور كومة كاملة لشركة ناشئة وأنا حريص على القيام بشيء بنفسي.أريد أكثر من مجرد الرد على التصويت.أريد المشاركة في العملية برمتها.لكنني كنت واقعيًا بشأن مشروعي الأول ، الذي بدأت في الوقت الذي كنت أعمل فيه.من خلال قراءة المعلومات من قراصنة مستقلين آخرين ، كنت أعرف أن مشروعي الأول سيفشل.لذلك ، قمت بإعداد قائمة طويلة من الأفكار واختارت أبسطها.كان من حسن الحظ أن الناس يريدون هذا المنتج.لقد دفعوا أكثر مما كنت أتوقع ، لذلك أصبح هذا مشروعي الفعلي.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/xIxrVwn24DVsN8b3PYD3/tSHyRvzNLWPnx4sBYEdtWkmq4u93/Lukas%20Herrman%20founder%20stage%20timer.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:22:04"}, {"_id": "article_0228", "title": "8年B2B SaaS经验，Ryan Kulp用5个月赚20万美元", "title_en": "8 years of B2B SaaS experience, Ryan Kulp made $200,000 in 5 months", "title_jp": "8年のB 2 B SaaS経験、Ryan Kulpは5 ヶ月で$200，000を稼ぐ", "title_ar": "8 سنوات من الخبرة في B2B SaaS ، ريان كولب يكسب 200 ألف دولار في 5 أشهر", "summary": "8年B2B SaaS经验，Ryan Kulp用5个月赚20万美元 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入1万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【早高峰地铁上】 刷手机看到一个帖子：\"做SaaS几个月了，月收入还在徘徊，该放弃吗？\"我忍住没回。但我想到了James Fleischmann。 01 我是一名技术兄弟和音乐家。我是一个书呆子（但不是呆子）、一个黑客（但不是工程师）、一个营销人员（但不是销售人员）和一个创始人（但不是首席执行官）。过去六年我的个人收入从每月 3000 美元到 90000 美元不等，但这个数字与我工作的努力程度或我对工作的兴奋程度完全无关。 它与我负责交付的价值相关。我通常认为自己是一个无聊的 B2B 软件企业家。我对此很感激——如果你能打造出成千上万家（甚至数百家）公司依赖的东西来兑现自己的承诺，那么你就赢了。但我通过很多不同的项目赚了钱。", "summary_en": "With 8 years of B2B SaaS experience, Ryan Kulp made $200,000 in 5 months. This case I talked about today may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $10,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [On the subway in the morning rush hour] I swiped my mobile phone and saw a post: \"I have been doing SaaS for several months, and my monthly income is still hovering. Should I give up? \"I resisted replying. But I thought of James Fleischmann. 01 I am a technical brother and musician. I am a nerd (but not a nerd), a hacker (but not an engineer), a marketer (but not a salesperson), and a founder (but not a CEO). My personal income for the past six years has ranged from $3000 to $90000 a month, but this figure has nothing to do with how hard I work or how excited I am about it. It is related to the value I am responsible for delivering. I usually think of myself as a boring B2B software entrepreneur. I am grateful for that-if you can build something that thousands (or even hundreds) of companies rely on to deliver on your promises, then you win. But I made money through a lot of different projects.", "summary_jp": "B 2 B SaaSで8年の経験を持ち、Ryan Kulpが5 ヶ月で$200，000を稼いだこのケースは、起業家精神に対するあなたの理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは1万ドルを稼ぐことができた。5分後、あなたのギャップは能力ではなく、認知であることがわかります。“朝のピーク地下鉄”ブラシ携帯電話の投稿を見て：“数ヶ月間SaaSを行って、毎月の収入はまだホバリングしている、あきらめるべきですか？“私は戻らなかった。ジェームズ·フライシュマンのことを考えてください私は技術者でミュージシャンです。私はオタク（オタクではない）、ハッカー（エンジニアではない）、マーケティング担当者（営業担当者ではない）、創業者（CEOではない）です。私の個人的な収入は過去6年間で月額3，000ドルから90，000ドルの範囲でしたが、この数字は私の努力のレベルや仕事に対する興奮のレベルとは全く関係ありませんでした。それは私が提供する価値に関連しています。私は自分自身を退屈なB 2 Bソフトウェア起業家だと思っています。私はそれに感謝しています。何千もの企業が約束を果たすために依存するものを構築できれば、あなたの勝ちです。様々なプロジェクトでお金を稼いでいます。", "summary_ar": "مع 8 سنوات من الخبرة في B2B SaaS ، كسب ريان كولب 200،000 دولار في 5 أشهر هذه الحالة التي تتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على عشرة آلاف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. (في مترو الأنفاق ذروة الصباح) فرشحة الهاتف المحمول رؤية منشور: \"القيام بـ SaaS لعدة أشهر ، الدخل الشهري لا يزال يتجول ، هل يجب التخلي عن ذلك؟\" \"لم أعود بعد أن أتحمل.أنا أفكر في جيمس فيليشمان. 01 أنا أخ تقني وموسيقي.أنا مهووس (لكن ليس مهووسا) ، هاكرز (لكن ليس مهندسًا) ، مسوق (لكن ليس مبيعًا) ومؤسس (لكن ليس الرئيس التنفيذي).لقد تراوح دخلي الشخصي من 3000 إلى 90000 دولار في الشهر على مدى السنوات الست الماضية ، ولكن هذا الرقم لا علاقة له على الإطلاق بمدى جهدي في العمل أو مدى حماسي لعملي.إنها مرتبطة بالقيمة التي أنا مسؤول عن تسليمها.أنا عادة ما أعتبر نفسي رائد برمجيات B2B ممل.أنا ممتن لذلك - إذا تمكنت من بناء شيء تعتمد عليه الآلاف (حتى المئات) من الشركات للوفاء بوعودها ، فأنت فاز.لكنني كسبت المال من خلال العديد من المشاريع المختلفة.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/xMMR0fmB8MXFoencrEXS/vOqaQ3DJwYRP8MNEjUOSMger71w1/ryan-kulp-founder-of-trmnl-fera.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:22:05"}, {"_id": "article_0229", "title": "模板组合月入3万美元", "title_en": "Template combination earns US$30,000 a month", "title_jp": "テンプレートポートフォリオ月額3万ドル", "title_ar": "محفظة القوالب الدخل الشهري 30،000 دولار", "summary": "模板组合月入3万美元 同样做产品，为什么有人月入两千就卡死了，有人能做到年入3万美金？差距不在技术，在于一个你从来没想过的模型。 今天讲完这个故事，你会重新理解\"赚钱\"这两个字。 【半夜接了个电话】 一看是老朋友。\"不好意思这么晚打给你，但我真的睡不着。\"话筒那边的声音听起来很疲惫。\"我做了几个月了，感觉自己原地踏步。\" 01 接下来怎么办？ 更扎心的是——", "summary_en": "The template combination earns US$30,000 a month to make the same product. Why is it that someone earns US$30,000 a month and someone can earn US$30,000 a year? The gap is not in technology, but in a model you have never thought of. After finishing this story today, you will understand the word \"making money\" again. [Received a phone call in the middle of the night] I saw that he was an old friend. \"Sorry to call you so late, but I really couldn't sleep. \"The voice on the other side of the microphone sounded tired. \"I've been doing it for a few months and I feel like I'm standing where I am. \" 01 What should we do next? What is even more heartbreaking is--", "summary_jp": "同じ製品を作るために3万ドルのテンプレートの組み合わせは、なぜ誰かが2000ドルに月にカードを死ぬ、誰かが3万ドルに達することができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。夜中に電話がかかってきたのは旧友だ。“こんなに遅く電話して申し訳ありませんが、眠れません。電話の向こうの声は疲れていた。“私は数ヶ月前にそれをし、自分自身を動かしていると感じた。0 1次は？さらに重要なのは-", "summary_ar": "هل يمكن أن يكون لديك 30 ألف دولار ndent development. After chatting for half an hour, he suddenly said: \"I really feel stuck. \"I said have you heard of James Fleischmann? He shook his head. 01 What to do next? Key step:", "summary_jp": "パンチは顎を壊し、代わりに5桁の月収ビジネスを生み出し、同じ製品を行う、なぜ人々はお金を稼ぐために働いて、誰かが年間収入を得ることができますか？ギャップはテクノロジーではなく、想像もしなかったモデルにあります。この話が終わると、“お金を稼ぐ”という言葉を再理解するでしょう。【前回の起業家集会で】独立した開発者の隣に座っていた。30分ほど話した後、彼は突然言いました。“私は本当に行き詰まっていると感じます。“ジェームズ·フライシュマンをご存知ですか？頭を振った。0 1次は何？重要なステップ：", "summary_ar": "لكمة كسر الفق، بدلا من ذلك ولدت خمسة أرقام شهريا الدخل التجاري نفس المنتجات، لماذا لا يمكن لأي شخص أن يكسب المال، يمكن لأي شخص أن يفعل الدخل السنوي؟الفجوة ليست في التكنولوجيا، بل في نموذج لم تفكر فيه أبداً.بعد أن تروي هذه القصة اليوم ، سوف تعيد فهم كلمة \"كسب المال\".كان هناك صديق يجلس بجانبه يعمل في تطوير مستقل.بعد أن تحدث لمدة نصف ساعة ، قال فجأة: \"أشعر حقًا أنني عالق.هل سمعت من قبل جيمس فليشمان؟وهو يهز رأسه. 01 ماذا تفعل بعد؟الخطوة الحاسمة:", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/yQBoOGEKkI6dlsczcCtf/vOqaQ3DJwYRP8MNEjUOSMger71w1/rich-watson-founder-of-nvstly.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:22:15"}, {"_id": "article_0233", "title": "用失败业务的零件搭出月入2万美元的产品", "title_en": "Use parts from failed business to build a product that earns $20,000 a month", "title_jp": "失敗したビジネスの部品を使って月2万ドルの製品を作る", "title_ar": "إنتاج منتجات تبلغ 20 ألف دولار شهرياً من قطع غيار أعمال فاشلة", "summary": "用失败业务的零件搭出月入2万美元的产品 今天讲的这个案例，可能会改变你对创业的理解。 没有融资，没有团队，没有背景——James Fleischmann一个人做到了年入4万美金。5分钟看完，你会发现你们的差距不在能力，在于一个认知。 【一个做AI的朋友约我吃饭】 吃到一半，他放下筷子：\"我最近特别焦虑。产品没流量\"我说我给你讲个人吧。他叫James Fleischmann。 01 十多年前，我辞掉了一家广告公司的工作，创办了一家科技初创公司。我没有接受过正规的商业教育，这既是福也是祸。我没有什么坏习惯需要改掉，但有很多问题，“人们到底是怎么做到的？” 我必须弄清楚很多事情。", "summary_en": "Using parts from failed businesses to build a product that earns US$20,000 a month. Today's case may change your understanding of entrepreneurship. No financing, no team, no background-James Fleischmann made an annual income of $40,000. After reading it in 5 minutes, you will find that the gap between you lies not in your ability, but in your understanding. [A friend who works AI asked me for dinner] Halfway through the meal, he put down his chopsticks: \"I have been very anxious recently. The product has no traffic.\"I said I'll tell you about the person. His name is James Fleischmann. 01 More than ten years ago, I quit my job as an advertising agency and founded a technology startup. I did not have a formal business education, which is both a blessing and a curse. I don't have any bad habits that need to be changed, but there are a lot of questions,\"How do people do it?\" I have to figure out a lot of things.", "summary_jp": "失敗したビジネスの部品から月20，000ドルの製品を作る今日のケースは、起業家精神の理解を変えるかもしれません。資金調達もチームもバックグラウンドもなく、ジェームズ·フライシュマンは年間4万ドルを稼いだ。5分後、あなたのギャップは能力ではなく、認知であることがわかります。【AIの友達が夕食に誘ってくれた】半分食べた後、箸を置いて“最近、特に不安になっています。製品は流れていません”私はあなたに個人的な話をします。彼の名前はジェームズ·フライシュマン。10年以上前、私は広告代理店の仕事を辞め、テクノロジースタートアップを立ち上げました。私は正式なビジネス教育を受けていません。それは祝福でも災いです。私はやめるべき悪い習慣はありませんが、“人々はどうやってそれをするのか？”という質問がたくさんあります。多くのことを知る必要がある。", "summary_ar": "إنشاء منتج بقيمة 20 ألف دولار شهرياً من أجزاء من مشروع فاشل هذه الحالة التي أشار إليها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - جيمس فليشمان وحده حصل على 40 ألف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك. [أحد الأصدقاء الذي يعمل في الذكاء الاصطناعي طلب مني تناول الطعام] في منتصف الأكل ، وضع الععصي: \"أنا قلق بشكل خاص في الآونة الأخيرة. \"لا يوجد منتج\" أقول لك شخصياً.اسمه جيمس فليشمان.قبل أكثر من عقد من الزمن، تركت وظيفتي في وكالة إعلانات وبدأت شركة ناشئة في مجال التكنولوجيا.لم أتلق تعليمًا رسميًا في مجال الأعمال التجارية ، وهو نعمة وشر.ليس لدي أي عادات سيئة يجب أن أتخلص منها ، ولكن هناك الكثير من الأسئلة ، \"كيف يفعل الناس ذلك بالضبط؟\"يجب أن أوضح الكثير من الأشياء.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/yf11em5AkK3rwVMHVEgf/ibTLPyjwVebnZjMGKvz6ztarnuV2/photo-of-cecil ねた。彼は半年間AI製品を作っていたが、何も起こらなかった。ケイティ·ヒネットをご存知ですか？0 1ディマ：私たちは高校時代からの親友です。私たちは10代の頃にコードを書き、13歳の頃に映画製作と政治についてのインターネット·フォーラムを開いた。これが私たちの最初のビジネスです。その後、経済学と金融学を学び、7年間コンサルタントとして働きました。マティアス", "summary_ar": "تحويل الأعمال الجانبية إلى استوديو لبدء الأعمال، وإنشاء تطبيقات من الدرجة الأولى التي تحقق 6 آلاف دولار شهرياً هذه الحالة التي أتحدث عنها اليوم قد تغير فهمك لبدء الأعمال.بدون تمويل، بدون فريق، بدون خلفية - كاتي هيغنيت وحدها حصلت على ستة آلاف دولار سنويا.بعد خمس دقائق من القراءة ، ستجد أن الفجوة بينكما ليست في القدرة ، بل في الإدراك.كان هناك شاب يجلس في المقهى، وكان ينهد.سألته عما حدث.وقال إنه يعمل على منتجات الذكاء الاصطناعي لمدة نصف عام ، ولم يتحسن أي شيء.هل تعرف كاتي هينيت؟ديمار: كنا أفضل أصدقاء منذ المدرسة الثانوية.لقد كتبنا الكود في سن المراهقة وفتحنا منتدى على الإنترنت حول صنع الأفلام والسياسة في سن الثالثة عشرة تقريبًا.هذه هي في الأساس أول شركة لنا.ثم درست الاقتصاد والمالية وعملت في مجال الاستشارات لمدة 7 سنوات.ماتياس", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/znfXREjBbSycWRpqbY0N/tSHyRvzNLWPnx4sBYEdtWkmq4u93/indiehackers_77094_httpss.mj.run4D0bKIRqlzA_cover_image_for_an__7f8bfe10-c9b2-4062-a1ad-2d77d685f512.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:22:24"}];
