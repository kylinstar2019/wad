はグラフィックデザインとコンピュータサイエンスのミックスで、現在はフルタイムで働いています。彼と友人は小さなウェブサイト開発会社を経営しています。これがスーパースターターのアイデアです。彼らはクライアントからエンドまでの基本機能を構築しています。", "summary_ar": "قد يبدأ جوناثان ويلك في كتابة البرمجة في سن 10 سنوات.ربما كان أول شيء قام ببنائه هو موقع فرقته على الإنترنت.بعد ذلك درس في الجامعة الرؤية الحاسوبية والتصميم - في الأساس مزيج من التصميم الجرافيكي وعلوم الكمبيوتر ، وهو ما يقوم به الآن في وظيفته بدوام كامل.يدير هو وأصدقائه أيضًا شركة صغيرة لتطوير مواقع ويب.هذا هو مصدر فكرة Supastarter.لقد وجدوا أنفسهم في بناء هذه الوظيفة الأساسية للعميل من النهاية إلى النهاية.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/67jkonWWKtbWFhtPQJDC/tSHyRvzNLWPnx4sBYEdtWkmq4u93/photo-of-jonathan-wilke-founder-of-supastarter.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:16:50"}, {"_id": "article_0021", "title": "把社区做进产品，他做到了7位数ARR", "title_en": "By turning communities into products, he achieved 7-digit ARR", "title_jp": "コミュニティを製品に組み込み、7桁のARRを達成しました。", "title_ar": "جعل المجتمع في المنتج، وحصل على 7 أرقام ARR.", "summary": "把社区做进产品，他做到了7位数ARR Taylor Jacobson整个20多岁都在试不同创业想法。 Focusmate之前，他做 life coach，运营一个男性支持小组。 2015年末，小组里有个叫Jake的人 struggling。 他有个重要投资人 deck 要写，但就是写不出来。 Taylor一直幻想有人能陪他工作。 上学的时候，你可以找个学习伙伴；问题解决。", "summary_en": "By turning community into products, he achieved 7-digit ARR Taylor Jacobson has been trying different entrepreneurial ideas throughout his 20s. Before Focus, he worked as life coach and ran a men's support group. At the end of 2015, there was a guy in the group named Jake struggling. He had an important investor deck to write about, but he couldn't write it. Taylor has always dreamed of someone working with him. When you go to school, you can find a study partner; problem solving.", "summary_jp": "コミュニティを製品に変えることで、彼は7桁のARRテイラー·ジェイコブソンを作り、20代を通して様々なスタートアップのアイデアを試しました。Focus mateの前はライフコーチとして働き、男性サポートグループを運営していた。2015年後半、グループにはジェイクという男がいました。彼は書くべき重要な投資家を持っていたが、それができなかった。テイラーは誰かが一緒に働くことを夢見た。学校では、学習パートナーを見つけることができ、問題を解決します。", "summary_ar": "جعل المجتمع في المنتج، ونجح في ذلك سبعة أرقام ARR تايلور جاكوبسون جرب أفكار مختلفة لبدء الأعمال طوال العشرينات من عمره.قبل Focusmate ، كان يعمل مدربًا للحياة ويدير مجموعة دعم للرجال.في نهاية عام 2015 ، كان هناك شخص يدعى جاك يكافح في المجموعة.كان لديه مستثمر مهم ليكتب ، لكنه لم يكتب.كان تايلور يتخيل أن يعمل معه شخصًا ما.عند الذهاب إلى المدرسة ، يمكنك العثور على شريك دراسي ؛ حل المشكلات.", "thumbnail": "https://images.indiehackers.com/team-images/Taylor-Jacobson_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:16:52"}, {"_id": "article_0022", "title": "12个月把爬虫API做到$10k+ MRR", "title_en": "12 months to get the crawler API to $10k+ MRR", "title_jp": "$10 k + MRRで12 ヶ月でクローラAPIを取得", "title_ar": "12 شهرًا لتحقيق API الزاحف $ 10k + MRR", "summary": "12个月把爬虫API做到$10k+ MRR 他大学学的是心理学。 某天实习时，他了解到Uber，决定想进科技行业。 于是他搬到旧金山，上了编程训练营，给Lyft工作，骑自行车送餐维持生计。 最终在犹他找到软件工程师工作。 干了3年，存够够一年没收入的活的钱。 然后2022年 quit 工作，专注创业，同时通过自由职业延长跑道。 现在全职搞Scrape Creato", "summary_en": "He made the crawler API $10k+ MRR in 12 months. He studied psychology in college. One day during an internship, he learned about Uber and decided that he wanted to enter the technology industry. So he moved to San Francisco, went to coding boot camp, worked for Lyft, and rode a bicycle to deliver food to make ends meet. Eventually found a job as a software engineer in Utah. After working for 3 years, I saved enough money to work without income for a year. Then quit work in 2022, focusing on entrepreneurship, while extending the runway through freelance. Now I work on Scrape Creato full-time", "summary_jp": "クローラー APIを$10 k + MRRにする12 ヶ月彼は大学で心理学を学んだ。ある日、彼はUberを知り、テクノロジー業界に入りたいと決めました。そこで彼はサンフランシスコに引っ越し、プログラミングのブートキャンプに通い、Lyftで働き、自転車で食事を配達して生計を立てました。ユタ州でソフトウェアエンジニアの仕事を見つけた。3年間働いて、収入なしで1年間働くのに十分なお金を貯めました。その後、2022年にQuitで働き、起業家精神に注力しながらフリーランスとしてのキャリアを広げます。現在はScrape Creato。", "summary_ar": "12 شهرًا من API الزاحف $ 10k + MRR درس علم النفس في الجامعة.في يوم من الأيام ، أثناء تدريب داخلي ، عرف عن Uber وقرر أن يرغب في الدخول في صناعة التكنولوجيا.لذلك انتقل إلى سان فرانسيسكو، حيث التحق بمعسكرات البرمجة، وعمل في Lyft، وركوب الدراجة لتوصيل الطعام من أجل كسب العيش.في نهاية المطاف وجدت وظيفة مهندس البرمجيات في يوتا.عمل لمدة ثلاث سنوات، ومدخر ما يكفي من المال لعمل سنة واحدة دون دخول.ثم في عام 2022 استقال عن العمل والتركيز على بدء الأعمال التجارية ، في حين تمديد مسارها من خلال العمل الحر.يعمل بدوام كامل الآن في Scrape Creato", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/6iF8SJRF4WpciDff9aYi/PWairgiOpneHvkGJri7RVbtORKI2/assets_task_01k1vn2tzpeertatn2ewmcwrvs_1754348603_img_3.webp", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:16:54"}, {"_id": "article_0023", "title": "一年从0到$10k/月的App组合", "title_en": "App combinations from 0 to $10k/month per year", "title_jp": "年間0 ~ 10kドル/月のアプリポートフォリオ", "title_ar": "محفظة تطبيقات من 0 إلى 10k $/شهر في السنة", "summary": "一年从0到$10k/月的App组合 David Attias 13年前从巴黎一所计算机科学学校毕业。 开始在Criteo当技术 account manager，伦敦、巴塞罗那、纽约都待过。 之后给多家银行和专业交易员做自由职业，给他们设计交易算法，干了7年。 那是他赚钱最多的时候。 2025年，他看了一个播客，三个青少年做了个叫QUITTR的app，3个月做到$20万/月。", "summary_en": "David Attias, a one-year App portfolio ranging from 0 to $10k/month, graduated from a computer science school in Paris 13 years ago. I started working as a technical account manager at Criteo and stayed in London, Barcelona, and New York. Later, he worked freelance for many banks and professional traders, designing trading algorithms for them, and worked for seven years. That was when he made the most money. In 2025, he watched a podcast and three teenagers created an app called QUITTR, which made it $200,000 per month in three months.", "summary_jp": "年間0 ~ 10万ドル/月のアプリポートフォリオDavid Attiasは13年前にパリのコンピュータサイエンス学校を卒業しました。Criteoでテクニカルアカウントマネージャーとして働き始め、ロンドン、バルセロナ、ニューヨークで働いた。その後、多くの銀行やプロのトレーダーのためにフリーランスとして働き、7年間トレーディングアルゴリズムを設計しました。それが一番お金を稼いだ時です。2025年、彼はポッドキャストを見ていました。3人のティーンエイジャーがQUITTRというアプリを作り、3 ヶ月間で月額20万ドルを稼いだのです。", "summary_ar": "محفظة تطبيقات من 0 إلى 10 ألف دولار شهريًا في السنة تخرج ديفيد أتياس من مدرسة علوم الكمبيوتر في باريس قبل 13 عامًا.بدأت كمدير حسابات تقنية في Criteo، وعملت في لندن وبرشلونة ونيويورك.بعد ذلك عملت لحسابها الخاص للعديد من البنوك والتجار المحترفين، وتصميم خوارزميات التداول لهم، وعملت لمدة سبع سنوات.هذا هو الوقت الذي يكسب فيه أكثر أموال.في عام 2025 ، شاهد بودكاست حيث قام ثلاثة مراهقين بتطوير تطبيق يسمى QUITTR ، وجنيوا 200 ألف دولار شهريًا في ثلاثة أشهر.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/71h2PPGYn1VnPOkj9qi6/vOqaQ3DJwYRP8MNEjUOSMger71w1/david-attias-founder-of-stoppr.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:16:56"}, {"_id": "article_0024", "title": "先服务验证，再建产品，做到$27k MRR", "title_en": "Service verification first, then product building, achieving $27k MRR", "title_jp": "最初のサービス検証、製品の再構築、$27 k MRR", "title_ar": "التحقق من الخدمة أولاً ، وإعادة بناء المنتج ، وتحقيق $27k MRR", "summary": "先服务验证，再建产品，做到$27k MRR Román Czerny，30岁，目前在葡萄牙里斯本，热爱蛋挞，Gojiberry AI联合创始人。 2019年开始网上做生意，先是自由职业，然后联盟营销。 2023年发现对SaaS的热情，建了第一个产品CocoAI，后来七位数卖掉。 现在做Gojiberry AI，基于意向的LinkedIn outreach 工具。 帮B2B公司", "summary_en": "Service verification first, then product building, to achieve $27k MRR Román Czerny, 30, currently in Lisbon, Portugal, loves egg tarts and co-founder of Gojiberry AI. I started doing business online in 2019, first freelance and then affiliate marketing. In 2023, he discovered his enthusiasm for SaaS and built his first product, CocoAI, which was later sold in seven figures. Now make Gojiberry AI, the intention-based LinkedIn outreach tool. Helping B2B companies", "summary_jp": "最初にサービスを検証し、製品を構築し、$27 kを達成するMRR Rom á n Czerny、30、現在ポルトガルのリスボンに住んでいる、タルトが大好き、Gojiberry AIの共同創設者。2019年にオンラインビジネスを始め、フリーランスとして、その後アフィリエイトマーケティングを開始。2023年、SaaSへの情熱を見出し、最初の製品であるCocoAIを構築し、後に7桁で売却しました。LinkedInのインテントベースのアウトリーチツールであるGojiberry AIを今すぐ試してください。B 2 B企業の支援", "summary_ar": "تحقق من الخدمة أولاً ، وإعادة بناء المنتج ، واصل $ 27k MRR رومان Czerny ، 30 عامًا ، حاليًا في لشبونة ، البرتغال ، ومؤسس مشارك لـ Gojiberry AI.بدء الأعمال التجارية عبر الإنترنت في عام 2019 ، أولاً العمل الحر ، ثم التسويق بالعمولة.اكتشف شغفًا لخدمات الخدمة في عام 2023 ، وبنى أول منتج ، CocoAI ، الذي بيع لاحقًا بأرقام سبعة.الآن قم Gojiberry AI ، أداة LinkedIn للتوعية القائمة على النية.مساعدة شركة B2B", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/7FrT6FXChPOiUK4PbXFp/PWairgiOpneHvkGJri7RVbtORKI2/Rom%C3%A0n%20Czerny_founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:16:58"}, {"_id": "article_0025", "title": "勇敢一跃，她建了6位数ARR组合", "title_en": "With a brave leap, she built a 6-digit ARR group", "title_jp": "彼女は6桁のARRポートフォリオを構築しました。", "title_ar": "قفزة شجاعة، وقالت انها بنيت مجموعة 6 أرقام ARR", "summary": "勇敢一跃，她建了6位数ARR组合 Pauline Clavelloux，法国科技创业者。 在IBM工作9.5年后成为全职indie hacker。 COVID期间开始indie hacking，从零建了几个SaaS产品； 有些失败了，一个卖了，另外四个服务客户： 1. IACrea——AI驱动的房地产营销套件，把房产照片变成虚拟 staging 图片、视频、和现成社交", "summary_en": "With a brave leap, she founded the six-figure ARR group Pauline Clavelloux, a French technology entrepreneur. After 9.5 years at IBM, he became a full-time indie hacker. During the COVID, indie hacking began and several SaaS products were built from scratch; some failed, one was sold, and the other four served customers: 1. IACrea-an AI-driven real estate marketing suite that turns property photos into virtual staging pictures, videos, and ready-made social networking", "summary_jp": "彼女はフランスのテクノロジー起業家Pauline Clavellouxという6桁のARRポートフォリオを立ち上げました。IBMで9.5年間働いた後、フルタイムのインディーハッカーになりました。COVIDの間にIndie Hackingを開始し、いくつかのSaaS製品をゼロから構築しました。いくつかは失敗し、1つは売却され、4つのサービス顧客がいました。IACrea-AI駆動の不動産マーケティングスイートで、不動産写真をバーチャルステージング画像、動画、ソーシャルメディアに変換します。", "summary_ar": "قفزة شجاعة ، قامت ببناء محفظة ARR من 6 أرقام باولين كلافيلو ، رائدة أعمال تكنولوجيا فرنسية.أصبح قراصنة مستقلين بدوام كامل بعد 9.5 سنوات في IBM.بدأت القرصنة indie خلال COVID ، وبناء العديد من منتجات SaaS من الصفر ؛ فشل بعضها ، وبيع واحد ، وخدمة أربعة آخرين للعملاء: 1. IACrea - مجموعة تسويق العقارات التي تعمل بالذكاء الاصطناعي لتحويل صور العقارات إلى صور افتراضية ومقاطع فيديو واجتماعية جاهزة", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/8Gc6h3b74cjmNEgOgY3L/PWairgiOpneHvkGJri7RVbtORKI2/Pauline%20founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:17:00"}, {"_id": "article_0026", "title": "从移动SDK到8位数ARR组合", "title_en": "From mobile SDK to 8-digit ARR combinations", "title_jp": "モバイルSDKから8桁のARRポートフォリオへ", "title_ar": "من SDK المحمول إلى مجموعة ARR 8 أرقام", "summary": "从移动SDK到8位数ARR组合 Jonathan Rhyne从很小就是技术爱好者和计算机爱好者，对电脑游戏感兴趣。 这让他本科开始学计算机科学，很快决定不想整天独自坐在电脑前解 puzzle。 他想做点更面向人的、需要软技能和社交技能的。 他 pivot 到法学院，毕业，在20082009金融危机前后执业。 那是找工作的 tough 时期，所以他决定自己开业，给软件工程师提", "summary_en": "From mobile SDK to 8-digit ARR combo Jonathan Rhyne has been a technology enthusiast and computer enthusiast since an early age, interested in computer games. This led him to start studying computer science as an undergraduate and quickly decided that he didn't want to sit alone in front of a computer all day to solve puzzles. He wanted to do something more people-oriented and required soft skills and social skills. He pivoted to law school, graduated, and practiced medicine before and after the 2008 - 2009 financial crisis. It was a tough period for job hunting, so he decided to start his own business and advise software engineers.", "summary_jp": "モバイルSDKから8桁のARRポートフォリオへJonathan Rhyneは幼い頃からテクノロジー愛好家であり、コンピュータゲームに興味を持っていました。そこで学部でコンピュータサイエンスを学び始めた彼は、すぐに一日中コンピュータの前に座ってパズルを解きたくないと決めた。彼はもっと人間的でソフトスキルや社会的スキルを必要とすることをしたかったのですロースクールに進学し、2008年から2009年の金融危機の前後に法律実務を行った。就職活動の時期であったので、ソフトウェアエンジニアのために起業することにしました。", "summary_ar": "من SDK المحمولة إلى مجموعة ARR 8 أرقام كان جوناثان رين من عشاق التكنولوجيا وعشاق الكمبيوتر منذ سن مبكرة ، مهتمًا بألعاب الكمبيوتر.هذا سمح له بدء دراسة علوم الكمبيوتر ، وسرعان ما قرر أنه لا يريد الجلوس وحده أمام الكمبيوتر طوال اليوم لحل الألغاز.كان يريد أن يفعل شيئًا أكثر توجهًا للإنسان والذي يتطلب مهارات ناعمة ومهارات اجتماعية.تحول إلى كلية الحقوق ، وتخرج ، وممارسة قبل الأزمة المالية 2008-2009.كان ذلك وقتًا صعبًا للعثور على وظيفة ، لذلك قرر فتح عمله بنفسه وتقديم مهندس برمجيات.", "thumbnail": "https://images.indiehackers.com/team-images/jonathan-rhyne-founder.jpg", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:17:06"}, {"_id": "article_0027", "title": "建$10k/月的B2B SaaS Boilerplate", "title_en": "Build a $10k/month B2B SaaS Boilerplate", "title_jp": "B 2 B SaaS Boilerplateを月額10 kドルで構築", "title_ar": "بناء B2B SaaS Boilerplate بقيمة 10k دولارًا شهريًا", "summary": "建$10k/月的B2B SaaS Boilerplate Alexandro Martinez是墨西哥瓜达拉哈拉的全栈SaaS创始人+开发者。 他成为创始人的很大原因是看到爸爸的生活方式。 他爸也是软件开发者，虽然从没推他进这行，但他一直 admire 爸爸怎么控制自己的时间。 可以在家工作、陪家人、不被朝九晚五办公室 routine 绑住。 如果需要出差，可以当天飞出去飞回", "summary_en": "Alexandro Martinez builds a $10k/month B2B SaaS Boilerplate is the founder and developer of full-stack SaaS in Guadalajara, Mexico. A big reason why he became the founder was to see his father's lifestyle. His father is also a software developer. Although he has never pushed him into this business, he has always admired how his father can control his time. You can work from home, spend time with your family, and not be tied down by the nine-to-five office routine. If you need to go on business, you can fly out and back on the same day", "summary_jp": "$10 k/月のB2 B SaaS Boilerplate Alexandro Martinezは、メキシコのグアダラハラに拠点を置くフルスタックSaaSの創設者+開発者です。彼が創業者になった大きな理由は、父の生き方を見たことです。父親もソフトウェア開発者であり、彼をこの仕事に押し込まなかったが、父親の時間管理方法を教えてくれた。自宅で働き、家族と過ごし、9時から5時までのオフィスルーチンに縛られません。旅行が必要な場合は、同じ日に飛ぶことができます。", "summary_ar": "B2B SaaS Boilerplate بـ 10k دولارًا شهريًا Alexandro Martinez هو مؤسس + مطور SaaS في غوادالاخارا ، المكسيك.كان السبب الرئيسي الذي جعله مؤسسًا هو رؤية أسلوب حياة والده.كان والده مطورًا للبرمجيات أيضًا ، وعلى الرغم من أنه لم يدفعه أبدًا إلى هذه المهنة ، إلا أنه كان معجبًا دائمًا بكيفية التحكم في وقته.يمكنك العمل من المنزل ومرافقة عائلتك دون أن تكون مقيدة بالروتين المكتبي من التاسعة إلى الخامسة.إذا كنت بحاجة إلى السفر، يمكنك السفر في نفس اليوم.", "thumbnail": "https://storage.googleapis.com/indie-hackers.appspot.com/post-images/8QiT7aO4qYfwwbL5fvQJ/vOqaQ3DJwYRP8MNEjUOSMger71w1/alexandro-martinez-founder-of-saasrock.png", "tag": ["创业", "SaaS", "独立开发者"], "author": "阿星", "modifiedDateStr": "2026-07-07 22:17:07"}, {"_id": "article_0028", "title": "$50万ARR后才认真对待营销", "title_en": "$500,000 ARR before taking marketing seriously", "title_jp": "500，000ドルでマーケティングを真剣に考える", "title_ar": "500 مليون دولار قبل أن تأخذ التسويق بجدية", "summary": "$50万ARR后才认真对待营销 David Bressler在数据分析领域工作了15年，然后在他第二个孩子的陪产假期间launch了Formula Bot。 Formula Bot是AI驱动的数据分析平台，让所有人——无论技术或分析背景——都能更容易更快地处理数据。 他把平台当 side project 增长，同时全职做媒体分析 agency 的高级数据分析总监。 一旦Form", "summary_en": "David Bressler worked in data analytics for 15 years before launching Formula Bot during his second child's paternity leave. Formula Bot is an AI-driven data analytics platform that makes it easier and faster for everyone-regardless of technical or analytical background-to process data. He views the platform as a side project to grow, and also serves as the senior data analysis director of the media analysis agency full-time. Once Form", "summary_jp": "David Bresslerは、2人目の子供の育児休暇中にFormula Botを立ち上げる前に、データ分析に15年間携わってきました。Formula BotはAIを活用したデータ分析プラットフォームで、テクノロジーや分析のバックグラウンドに関係なく、誰もがデータをより簡単かつ迅速に処理できるようにします。彼はプラットフォームをサイドプロジェクトとして成長させ、メディア分析エージェンシーのシニアデータ分析ディレクターをフルタイムで務めました。フォームの場合", "summary_ar": "عمل ديفيد بريسلر في تحليلات البيانات لمدة 15 عامًا قبل إطلاق Formula Bot أثناء إجازة الأبوة لطفله الثاني. Formula Bot هي منصة تحليل البيانات التي تعتمد على الذكاء الاصطناعي ، مما يجعل من السهل للجميع - بغض النظر عن الخلفية التقنية أو التحليلية - معالجة البيانات بشكل أسرع وأسهل.لقد كان يستخدم المنصة كمشروع جانبي للنمو ، بينما كان يعمل بدوام كامل كمدير تحليل البيانات الأقدم في وكالة تحليلات وسائل
